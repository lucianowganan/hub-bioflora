<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Interno — Hub Bioflora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<style>
  :root{
    --burgundy:#8B1A3A; --burgundy-dark:#5E1027; --burgundy-tint:#F7E9EE;
    --ink:#161213; --paper:#F3EEEC; --line:#DDD3D0; --gray:#4A4245;
    --good:#3F7A57; --good-tint:#E8F3EC; --bad:#B4472F; --bad-tint:#FBEBE6;
    --headfont: 'Space Grotesk', 'Maven Pro', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Maven Pro',sans-serif;-webkit-font-smoothing:antialiased;}
  .chat-shell{display:flex;height:100vh;overscroll-behavior-x:none;touch-action:pan-y;}

  .canais-col{width:240px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .canais-head{padding:20px 18px 14px;border-bottom:1px solid var(--line);}
  .canais-head h1{font-family:var(--headfont);font-size:16px;margin:0;font-weight:600;}
  .canais-head p{font-size:11px;color:var(--gray);margin:2px 0 0;}
  .canais-lista{flex:1;overflow-y:auto;padding:12px 10px;}

  .grupo-bloco{margin-bottom:14px;}
  .grupo-titulo{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);padding:4px 8px;}
  .grupo-titulo .add-canal-link{font-size:14px;cursor:pointer;color:var(--gray);}
  .grupo-titulo .add-canal-link:hover{color:var(--burgundy);}
  .canal-item{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--gray);margin-bottom:1px;}
  .canal-item:hover{background:var(--paper);}
  .canal-item.active{background:var(--burgundy);color:#fff;font-weight:600;}
  .canal-item .hash{opacity:.6;}
  .canal-item .lock{font-size:10px;opacity:.7;margin-left:auto;}
  .canal-badge{background:var(--burgundy);color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 6px;margin-left:auto;}
  .canal-item .lock ~ .canal-badge{margin-left:6px;}

  .novo-grupo-btn{margin:6px 10px;font-family:'Maven Pro',sans-serif;font-size:11.5px;font-weight:600;color:var(--gray);background:transparent;border:1.5px dashed var(--line);border-radius:8px;padding:7px;cursor:pointer;width:calc(100% - 20px);}
  .novo-grupo-btn:hover{border-color:var(--burgundy);color:var(--burgundy);}

  .dm-lista{padding:0 2px;}
  .dm-item{display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:8px;cursor:pointer;}
  .dm-item:hover{background:var(--paper);}
  .dm-item.active{background:var(--burgundy);color:#fff;}
  .dm-avatar{width:34px;height:34px;border-radius:50%;background:var(--burgundy-tint);color:var(--burgundy);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;}
  .dm-item.active .dm-avatar{background:rgba(255,255,255,.25);color:#fff;}
  .dm-info{flex:1;min-width:0;}
  .dm-info-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
  .dm-nome{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dm-item.active .dm-nome{color:#fff;}
  .dm-hora{font-size:10px;color:var(--gray);flex-shrink:0;}
  .dm-item.active .dm-hora{color:rgba(255,255,255,.75);}
  .dm-info-bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:1px;}
  .dm-preview{font-size:11px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dm-item.active .dm-preview{color:rgba(255,255,255,.85);}
  .dm-badge{background:var(--burgundy);color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 6px;flex-shrink:0;}
  .dm-item.active .dm-badge{background:#fff;color:var(--burgundy);}

  .canais-foot{padding:12px 14px;border-top:1px solid var(--line);}
  .canais-foot a{font-size:12px;color:var(--gray);text-decoration:none;}
  .canais-foot a:hover{color:var(--burgundy);}

  .chat-main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-header{padding:16px 22px;border-bottom:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:center;}
  .chat-voltar-btn{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink);padding:4px 10px 4px 0;line-height:1;}
  .busca-conversa-bar{display:flex;align-items:center;gap:10px;padding:9px 22px;background:var(--paper);border-bottom:1px solid var(--line);}
  .busca-conversa-bar input{flex:1;font-family:'Maven Pro',sans-serif;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;}
  .busca-conversa-bar button{background:none;border:none;color:var(--gray);cursor:pointer;font-size:15px;}
  .msg-row.busca-oculta{display:none;}
  .msg-row.busca-encontrada .msg-texto{background:#FBF1E0;border-radius:5px;}
  .tab-sec-btn{font-family:'Maven Pro',sans-serif;font-size:12.5px;font-weight:600;padding:7px 15px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--gray);}
  .tab-sec-btn.active{background:var(--burgundy);color:#fff;border-color:var(--burgundy);}

  @media (max-width:720px) and (pointer:coarse){
    .chat-shell{height:100dvh;}
    .canais-col{width:100%;}
    .chat-main{display:none;}
    .chat-shell.mostrando-conversa .canais-col{display:none;}
    .chat-shell.mostrando-conversa .chat-main{display:flex;}
    .chat-voltar-btn{display:inline-flex;align-items:center;}
  }
  .chat-header h2{font-family:var(--headfont);font-size:15px;margin:0;}
  .chat-header p{font-size:11.5px;color:var(--gray);margin:2px 0 0;}
  .del-canal-link{font-size:11px;color:var(--bad);background:none;border:none;cursor:pointer;text-decoration:underline;}

  .mensagens-area{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
  .msg-row{display:flex;gap:10px;max-width:640px;animation:msgEntrar .22s ease-out;}
  .separador-data{display:flex;align-items:center;gap:10px;margin:14px 0 8px;}
  .separador-data::before, .separador-data::after{content:'';flex:1;height:1px;background:var(--line);}
  .separador-data span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--gray);white-space:nowrap;}
  .msg-row.agrupada{margin-top:-9px;}
  @keyframes msgEntrar{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  .msg-avatar-spacer{width:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .msg-hora-hover{font-size:9.5px;color:var(--gray);opacity:0;transition:opacity .12s;}
  .msg-row.agrupada:hover .msg-hora-hover{opacity:1;}
  .msg-reacoes .msg-del{margin-left:4px;}

  .digitando-indicador{padding:2px 24px 0;font-size:11.5px;color:var(--gray);font-style:italic;display:flex;align-items:center;gap:6px;}
  .digitando-dots{display:inline-flex;gap:2px;}
  .digitando-dots span{width:4px;height:4px;border-radius:50%;background:var(--gray);animation:digitandoPulso 1.1s infinite ease-in-out;}
  .digitando-dots span:nth-child(2){animation-delay:.15s;}
  .digitando-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes digitandoPulso{ 0%,60%,100%{opacity:.25;transform:translateY(0);} 30%{opacity:1;transform:translateY(-2px);} }
  .msg-avatar{width:32px;height:32px;border-radius:50%;background:var(--burgundy-tint);color:var(--burgundy);display:flex;align-items:center;justify-content:center;font-family:var(--headfont);font-weight:600;font-size:13px;flex-shrink:0;}
  .msg-body .msg-meta{font-size:11.5px;color:var(--gray);margin-bottom:3px;}
  .msg-body .msg-meta strong{color:var(--ink);font-weight:700;}
  .msg-body .msg-texto{font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:9px 13px;}
  .msg-row.mine .msg-texto{background:var(--burgundy-tint);border-color:#EAD2DA;}
  .msg-texto.truncada{max-height:38vh;overflow:hidden;position:relative;}
  .msg-texto.truncada::after{content:'';position:absolute;bottom:0;left:0;right:0;height:36px;background:linear-gradient(transparent,#fff);}
  .msg-row.mine .msg-texto.truncada::after{background:linear-gradient(transparent,var(--burgundy-tint));}
  .msg-expandir-btn{display:block;font-family:'Maven Pro',sans-serif;font-size:11px;font-weight:600;color:var(--burgundy);background:none;border:none;cursor:pointer;padding:4px 0 0;text-decoration:underline;}
  .msg-anexo img, .msg-anexo video{max-width:280px;max-height:280px;border-radius:10px;margin-top:6px;display:block;}
  .pdf-chip{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-family:'Maven Pro',sans-serif;font-size:12.5px;font-weight:600;color:var(--burgundy);background:var(--burgundy-tint);border:1px solid #EAD2DA;border-radius:8px;padding:8px 13px;text-decoration:none;}
  .pdf-chip:hover{border-color:var(--burgundy);}
  .msg-del{font-size:10.5px;color:var(--gray);background:none;border:none;cursor:pointer;margin-left:8px;text-decoration:underline;opacity:.6;}
  .msg-del:hover{opacity:1;color:var(--bad);}

  .msg-reacoes{display:flex;gap:6px;margin-top:0;height:0;overflow:hidden;opacity:0;transition:opacity .12s;}
  .msg-row:hover .msg-reacoes, .msg-reacoes.tem-reacao{height:auto;overflow:visible;opacity:1;margin-top:6px;}
  .reacao-btn{font-family:'Maven Pro',sans-serif;font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 9px;cursor:pointer;color:var(--gray);}
  .reacao-btn.on{background:var(--burgundy-tint);border-color:var(--burgundy);color:var(--burgundy);font-weight:700;}

  .input-area{padding:14px 22px;border-top:1px solid var(--line);background:#fff;display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;z-index:5;flex-shrink:0;}
  .mencao{background:var(--burgundy-tint,#F7E9EE);color:var(--burgundy,#8B1A3A);font-weight:700;padding:1px 4px;border-radius:5px;}
  .input-area textarea{flex:1;font-family:'Maven Pro',sans-serif;font-size:13.5px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;resize:none;min-height:44px;max-height:160px;overflow-y:auto;}
  .anexo-btn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:17px;flex-shrink:0;}
  .anexo-btn:hover{border-color:var(--burgundy);}
  .input-area button.enviar{font-family:'Maven Pro',sans-serif;font-size:13px;font-weight:600;padding:0 22px;height:44px;border-radius:10px;border:none;cursor:pointer;background:var(--burgundy);color:#fff;flex-shrink:0;}
  .empty-state{text-align:center;color:var(--gray);font-size:13px;margin:auto;}
  .anexo-preview{font-size:11.5px;color:var(--gray);padding:8px 22px;display:none;align-items:center;gap:10px;}
  .anexo-preview-img{width:44px;height:44px;object-fit:cover;border-radius:6px;}
  .anexo-preview-nome{flex:1;min-width:0;}
  .anexo-preview button{background:none;border:none;color:var(--burgundy);cursor:pointer;font-size:11.5px;font-weight:600;}
  .chat-main.arrastando-arquivo{position:relative;}
  .chat-main.arrastando-arquivo::after{
    content:'Solte pra anexar';
    position:absolute;inset:0;background:rgba(139,26,58,.08);border:3px dashed var(--burgundy);
    display:flex;align-items:center;justify-content:center;font-family:var(--headfont,inherit);
    font-size:18px;font-weight:600;color:var(--burgundy);z-index:50;pointer-events:none;
  }
  .reply-banner{display:flex;align-items:center;gap:10px;padding:8px 22px;background:var(--paper);border-top:1px solid var(--line);}
  .reply-banner-linha{width:3px;align-self:stretch;background:var(--burgundy);border-radius:2px;}
  .reply-banner-texto{flex:1;min-width:0;}
  .reply-banner-nome{font-size:11.5px;font-weight:700;color:var(--burgundy);}
  .reply-banner-preview{font-size:12px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .reply-banner-fechar{background:none;border:none;color:var(--gray);cursor:pointer;font-size:15px;padding:2px 6px;}
  .msg-reply-quote{border-left:3px solid var(--burgundy);background:rgba(139,26,58,.06);border-radius:6px;padding:5px 9px;margin-bottom:5px;cursor:pointer;}
  .msg-reply-quote-nome{font-size:11px;font-weight:700;color:var(--burgundy);}
  .msg-reply-quote-texto{font-size:11.5px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .msg-destacada{animation:msgFlash 1.4s ease;}
  @keyframes msgFlash{0%{background:var(--burgundy-tint);border-radius:8px;}100%{background:transparent;}}
  .msg-editado-tag{font-size:10.5px;color:var(--gray);font-weight:400;font-style:italic;}
  .msg-editar-box textarea{width:100%;font-family:'Maven Pro',sans-serif;font-size:13.5px;padding:7px 10px;border:1.5px solid var(--burgundy);border-radius:8px;resize:vertical;min-height:44px;}
  .msg-editar-acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:5px;}
  .msg-editar-acoes button{font-family:'Maven Pro',sans-serif;font-size:12px;font-weight:600;padding:6px 14px;border-radius:7px;border:none;cursor:pointer;background:var(--burgundy);color:#fff;}
  .msg-editar-acoes button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .reply-btn{background:none;border:none;color:inherit;opacity:.6;cursor:pointer;font-size:13px;line-height:1;}
  .reply-btn:hover{opacity:1;}
  .anexo-preview button{background:none;border:none;color:var(--bad);cursor:pointer;text-decoration:underline;font-size:11px;margin-left:6px;}

  /* Modais internos (substituem prompt/confirm do navegador) */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(22,18,19,.5);z-index:300;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;}
  .modal h2{font-family:var(--headfont);font-weight:600;font-size:17px;margin:0 0 16px;}
  .modal label{font-size:11px;font-weight:700;color:var(--gray);display:block;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.03em;}
  .modal label:first-of-type{margin-top:0;}
  .modal input[type="text"], .modal input:not([type]), .modal textarea{width:100%;font-family:'Maven Pro',sans-serif;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;}
  .modal textarea{resize:vertical;min-height:60px;font-family:inherit;}
  .radio-row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);font-weight:400;padding:5px 0;}
  .radio-row input{width:auto !important;}
  .cargo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
  .cargo-check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);}
  .cargo-check input{width:auto !important;}
  .modal-actions{display:flex;gap:8px;margin-top:22px;}
  .modal-actions .btn{flex:1;text-align:center;font-family:'Maven Pro',sans-serif;font-size:13px;font-weight:600;padding:10px;border-radius:8px;border:none;cursor:pointer;background:var(--burgundy);color:#fff;}
  .modal-actions .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .modal-actions .btn.danger{background:var(--bad);}

  .busca-pessoa-input{width:100%;font-family:'Maven Pro',sans-serif;font-size:13.5px;padding:10px 13px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;}
  .lista-pessoas-busca{max-height:320px;overflow-y:auto;}
  .pessoa-busca-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer;}
  .pessoa-busca-item:hover{background:var(--paper);}
  .pessoa-busca-item .dm-avatar{width:32px;height:32px;font-size:11px;}
  .pessoa-busca-nome{font-size:13px;font-weight:600;color:var(--ink);}
  .pessoa-busca-tag{font-size:10.5px;color:var(--gray);margin-left:auto;}
</style>
</head>
<body>

<div class="chat-shell">
  <div class="canais-col">
    <div class="canais-head">
      <h1>💬 Chat Interno</h1>
      <p>Farmácia Bioflora</p>
    </div>
    <div class="canais-lista" id="canaisLista"></div>
    <div class="canais-foot"><a href="index.html">← Voltar ao Hub</a></div>
  </div>

  <div class="chat-main">
    <div class="chat-header">
      <div style="display:flex;align-items:center;min-width:0;">
        <button class="chat-voltar-btn" onclick="voltarParaListaMobile()" title="Voltar">←</button>
        <div style="cursor:pointer;min-width:0;" onclick="abrirDetalhesConversa()" title="Ver detalhes, mídia e arquivos">
          <h2 id="canalNome">Selecione uma conversa</h2>
          <p id="canalDesc"></p>
        </div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;">
        <button class="del-canal-link" onclick="abrirBuscaConversa()" title="Buscar nessa conversa">🔍</button>
        <button class="del-canal-link" id="editCanalBtn" style="display:none;color:var(--burgundy)" onclick="abrirEdicaoCanal()">Editar canal</button>
        <button class="del-canal-link" id="delCanalBtn" style="display:none" onclick="excluirCanal()">Excluir canal</button>
      </div>
    </div>
    <div class="busca-conversa-bar" id="buscaConversaBar" style="display:none">
      <input id="buscaConversaInput" placeholder="Buscar nessa conversa..." oninput="filtrarBuscaConversa()">
      <span id="buscaConversaContagem" style="font-size:11.5px;color:var(--gray);white-space:nowrap;"></span>
      <button onclick="fecharBuscaConversa()" title="Fechar busca">✕</button>
    </div>
    <div class="mensagens-area" id="mensagensArea">
      <div class="empty-state">Escolha um canal ou uma pessoa pra começar.</div>
    </div>
    <div class="digitando-indicador" id="digitandoIndicador" style="display:none"></div>
    <div class="anexo-preview" id="anexoPreview" style="display:none"></div>
    <div class="reply-banner" id="replyBanner" style="display:none">
      <div class="reply-banner-linha"></div>
      <div class="reply-banner-texto">
        <div class="reply-banner-nome" id="replyBannerNome"></div>
        <div class="reply-banner-preview" id="replyBannerPreview"></div>
      </div>
      <button class="reply-banner-fechar" onclick="cancelarResposta()" title="Cancelar resposta">✕</button>
    </div>
    <div class="input-area" id="inputArea" style="display:none">
      <button class="anexo-btn" onclick="document.getElementById('anexoInput').click()" title="Anexar imagem ou vídeo">📎</button>
      <input type="file" id="anexoInput" accept="image/*,video/*,audio/*,application/pdf,.xlsx,.xls,.csv" style="display:none" onchange="anexoSelecionado(this)">
      <textarea id="msgInput" placeholder="Escreva uma mensagem..." rows="1"></textarea>
      <button class="enviar" onclick="enviarMensagem()">Enviar</button>
    </div>
  </div>
</div>

<!-- Modal: Novo grupo -->
<div class="modal-overlay" id="modalGrupoOverlay">
  <div class="modal" style="max-width:360px">
    <h2>Novo grupo</h2>
    <label>Nome</label>
    <input id="grupoNomeInput" placeholder="Ex: Atendimento, Laboratório" />
    <div class="modal-actions">
      <button class="btn secondary" onclick="fecharModalGrupo()">Cancelar</button>
      <button class="btn" onclick="confirmarNovoGrupo()">Criar grupo</button>
    </div>
  </div>
</div>

<!-- Modal: Novo canal -->
<div class="modal-overlay" id="modalCanalOverlay">
  <div class="modal">
    <h2 id="modalCanalTitulo">Novo canal</h2>
    <label>Nome</label>
    <input id="canalNomeInput" placeholder="Ex: duvidas, geral, wanessa" />
    <label>Descrição (opcional)</label>
    <textarea id="canalDescInput" placeholder="Do que se trata esse canal..."></textarea>
    <label>Visibilidade</label>
    <div class="radio-row"><input type="radio" name="canalVis" value="publico" checked onchange="toggleCargosCanal()"> Público — todo mundo vê</div>
    <div class="radio-row"><input type="radio" name="canalVis" value="restrito" onchange="toggleCargosCanal()"> Restrito a alguns cargos</div>
    <div id="cargosCanalArea" style="display:none">
      <div class="cargo-grid" id="cargosCanalGrid"></div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="fecharModalCanal()">Cancelar</button>
      <button class="btn" id="btnConfirmarCanal" onclick="confirmarNovoCanal()">Criar canal</button>
    </div>
  </div>
</div>

<!-- Modal: detalhes da conversa (mídia e arquivos) -->

async function aplicarNomesDeColaboradores(perfis){
  const vinculados = perfis.filter(p => p.colaborador_vinculado);
  if(!vinculados.length) return;

  const ids = vinculados.map(p => p.colaborador_vinculado);
  const { data: colaboradores } = await supa.from('colaboradores_nomes_publicos').select('id,nome_completo').in('id', ids);
  const colabPorId = {};
  (colaboradores||[]).forEach(c => { colabPorId[c.id] = c.nome_completo; });

  // Conta quantas vezes cada primeiro nome aparece entre TODOS os
  // colaboradores vinculados, pra saber quando precisa desambiguar
  // com o segundo nome também
  const primeirosNomes = {};
  vinculados.forEach(p => {
    const nomeCompleto = colabPorId[p.colaborador_vinculado];
    if(!nomeCompleto) return;
    const primeiro = nomeCompleto.trim().split(/\s+/)[0];
    primeirosNomes[primeiro] = (primeirosNomes[primeiro]||0) + 1;
  });

  vinculados.forEach(p => {
    const nomeCompleto = colabPorId[p.colaborador_vinculado];
    if(!nomeCompleto) return;
    const partes = nomeCompleto.trim().split(/\s+/);
    const primeiro = partes[0];
    const precisaDesambiguar = primeirosNomes[primeiro] > 1 && partes.length > 1;
    nomesPorId[p.id] = precisaDesambiguar ? `${primeiro} ${partes[1]}` : primeiro;
  });
}

}

function tocarSom(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(740, ctx.currentTime);
    osc.frequency.setValueAtTime(920, ctx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  }catch(e){ /* navegador sem suporte a Web Audio, ignora */ }
}

function notificarMensagemNova(m, tipo){
  const nome = nomesPorId[m.autor_id] || 'Alguém';
  const conversaAberta = (tipo==='canal' && modoAtual==='canal' && alvoAtivoId===m.canal_id)
    || (tipo==='dm' && modoAtual==='dm' && alvoAtivoId===m.autor_id);
  const abaVisivel = document.visibilityState === 'visible' && document.hasFocus();

  if(!abaVisivel || !conversaAberta){
    tocarSom();
    if('Notification' in window && Notification.permission === 'granted'){
      const texto = m.conteudo || (m.anexo_tipo === 'imagem' ? '🖼️ Enviou uma imagem' : m.anexo_tipo === 'video' ? '🎥 Enviou um vídeo' : m.anexo_tipo === 'audio' ? '🎵 Enviou um áudio' : m.anexo_tipo === 'pdf' ? '📄 Enviou um PDF' : m.anexo_tipo === 'planilha' ? '📊 Enviou uma planilha' : 'Nova mensagem');
      const notif = new Notification(nome + ' — Chat Interno', { body: texto, icon: undefined, tag: 'hub-chat-'+(m.canal_id||m.autor_id) });
      notif.onclick = () => { window.focus(); notif.close(); };
    }
  }
}

let ultimoEnvioDigitando = 0;
let timeoutEsconderDigitando = null;

function autoCrescerTextarea(){

async function carregarTudo(){

// ============================================================
// NÃO LIDAS NOS CANAIS + NOTIFICAÇÃO GLOBAL
// (funciona pra qualquer canal/DM, não só a conversa aberta)
// ============================================================
async function carregarNaoLidosCanais(){
  if(!canais.length) return;
  const { data: leituras, error: erroLeitura } = await supa.from('canais_leitura').select('canal_id,lida_ate').eq('usuario_id', meuUserId);
  if(erroLeitura) console.error('Erro ao buscar canais_leitura:', erroLeitura);
  leituraCanais = {};
  (leituras||[]).forEach(l => { leituraCanais[l.canal_id] = new Date(l.lida_ate); });

  const trintaDiasAtras = new Date(Date.now() - 30*24*60*60*1000).toISOString();
  const { data: mensagens } = await supa.from('mensagens_chat')
    .select('canal_id,autor_id,criado_em')
    .in('canal_id', canais.map(c=>c.id))
    .neq('autor_id', meuUserId)
    .gte('criado_em', trintaDiasAtras);

  contadorNaoLidosCanais = {};
  (mensagens||[]).forEach(m => {
    const lidaAte = leituraCanais[m.canal_id];
    // Sem registro de leitura ainda = canal nunca aberto por essa
    // pessoa; considera tudo como não lido nesse caso.
    if(!lidaAte || new Date(m.criado_em) > lidaAte){
      contadorNaoLidosCanais[m.canal_id] = (contadorNaoLidosCanais[m.canal_id]||0) + 1;
    }
  });
}

async function marcarCanalComoLido(canalId){
  const agora = new Date().toISOString();
  leituraCanais[canalId] = new Date(agora);
  contadorNaoLidosCanais[canalId] = 0;

  // Em vez de upsert (que depende do onConflict bater certinho com a
  // chave composta), faz na unha: tenta atualizar primeiro; se não
  // existir nenhuma linha ainda pra essa pessoa+canal, insere.
  const { data: atualizado, error: erroUpdate } = await supa
    .from('canais_leitura')
    .update({ lida_ate: agora })
    .eq('canal_id', canalId)
    .eq('usuario_id', meuUserId)
    .select();

  if(erroUpdate){ console.error('Erro ao marcar canal como lido (update):', erroUpdate); return; }

  if(!atualizado || atualizado.length === 0){
    const { error: erroInsert } = await supa
      .from('canais_leitura')
      .insert({ canal_id: canalId, usuario_id: meuUserId, lida_ate: agora });
    if(erroInsert) console.error('Erro ao marcar canal como lido (insert):', erroInsert);
  }
}

function assinarTempoRealGlobal(){
  if(subscricaoGlobal) supa.removeChannel(subscricaoGlobal);
  subscricaoGlobal = supa.channel('chat-global-'+meuUserId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensagens_chat' }, (payload) => {
      const m = payload.new;
      if(m.autor_id === meuUserId) return;
      const estouVendoEsseCanal = modoAtual==='canal' && alvoAtivoId===m.canal_id;
      if(estouVendoEsseCanal) return; // já tratado pela assinatura da conversa aberta

      contadorNaoLidosCanais[m.canal_id] = (contadorNaoLidosCanais[m.canal_id]||0) + 1;
      renderSidebar();
      notificarMensagemNova(m, 'canal');
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dm_mensagens' }, async (payload) => {
      const m = payload.new;
      if(m.remetente_id === meuUserId || m.destinatario_id !== meuUserId) return;
      const estouVendoEssaDm = modoAtual==='dm' && alvoAtivoId===m.remetente_id;
      if(estouVendoEssaDm) return; // já tratado pela assinatura da conversa aberta

      await carregarConversasDm();
      renderSidebar();
      notificarMensagemNova({...m, autor_id: m.remetente_id}, 'dm');
    })
    .subscribe();
}

async function carregarConversasDm(){
  const { data } = await supa.from('dm_mensagens').select('*')
    .or(`remetente_id.eq.${meuUserId},destinatario_id.eq.${meuUserId}`)
    .order('criado_em', { ascending: false });

  const porPessoa = {};
  (data||[]).forEach(m => {
    const outraPessoa = m.remetente_id === meuUserId ? m.destinatario_id : m.remetente_id;
    if(!porPessoa[outraPessoa]){
      porPessoa[outraPessoa] = { userId: outraPessoa, ultimaMsg: m, naoLidas: 0 };
    }
    if(m.destinatario_id === meuUserId && !m.lida) porPessoa[outraPessoa].naoLidas++;
  });

  conversasDm = Object.values(porPessoa);
}

function renderSidebar(){

  grupos.forEach(grp => {

        ${doGrupo.map(canalItemHtml).join('') || '<p style="font-size:11px;color:var(--gray);padding:4px 10px;">Sem canais ainda.</p>'}

  if(semGrupo.length){
    html += `

        <div class="grupo-titulo"><span>Sem grupo</span><span class="add-canal-link" onclick="criarCanal(null)" title="Novo canal">+</span></div>
        ${semGrupo.map(canalItemHtml).join('')}
      </div>`;
  }

  html += `<button class="novo-grupo-btn" onclick="criarGrupo()">+ Novo grupo</button>`;

  html += `
    <div class="grupo-bloco">
      <div class="grupo-titulo"><span>Mensagens diretas</span></div>
      <div class="dm-lista">
        ${conversasDm.length ? conversasDm.map(dmItemHtml).join('') : '<p style="font-size:11px;color:var(--gray);padding:4px 10px;">Nenhuma conversa ainda.</p>'}
      </div>
      <button class="novo-grupo-btn" onclick="abrirModalNovaConversa()">+ Nova conversa</button>
    </div>`;

  document.getElementById('canaisLista').innerHTML = html;
}

function canalItemHtml(c){
  const ativo = modoAtual==='canal' && alvoAtivoId===c.id;
  const naoLidas = contadorNaoLidosCanais[c.id] || 0;
  return `

}

function dmItemHtml(conv){
  const p = perfisTodos.find(x=>x.id===conv.userId);
  const nome = nomesPorId[conv.userId] || 'Alguém';
  const ativo = modoAtual==='dm' && alvoAtivoId===conv.userId;

  const souEuQueMandei = m.remetente_id === meuUserId;
  let prevText = m.conteudo ? m.conteudo : (m.anexo_tipo === 'imagem' ? '🖼️ Imagem' : m.anexo_tipo === 'video' ? '🎥 Vídeo' : m.anexo_tipo === 'audio' ? '🎵 Áudio' : m.anexo_tipo === 'pdf' ? '📄 PDF' : m.anexo_tipo === 'planilha' ? '📊 Planilha' : '');
  if(souEuQueMandei) prevText = 'Você: ' + prevText;
  const hora = new Date(m.criado_em).toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});

  return `
    <div class="dm-item ${ativo?'active':''}" onclick="abrirDm('${conv.userId}')">
      <span class="dm-avatar">${iniciais(nome)}</span>
      <div class="dm-info">

      </div>
    </div>`;
}

async function confirmarNovoCanal(){
  const nome = document.getElementById('canalNomeInput').value.trim();
  if(!nome){ alert('Digite um nome pro canal.'); return; }
  const descricao = document.getElementById('canalDescInput').value.trim();
  const restrito = document.querySelector('input[name="canalVis"]:checked').value === 'restrito';

  let papeis_permitidos = [];
  let privado = false;
  if(restrito){
    papeis_permitidos = Array.from(document.querySelectorAll('.cargoCheck:checked')).map(cb=>cb.value);
    if(!papeis_permitidos.length){ alert('Marque pelo menos um cargo, ou escolha "Público".'); return; }
    privado = true;
  }

  const dadosCanal = { nome: nome.toLowerCase().replace(/\s+/g,'-'), descricao, grupo_id: grupoAlvoNovoCanal, privado, papeis_permitidos };

  if(canalEmEdicaoId){
    const { error } = await supa.from('canais_chat').update(dadosCanal).eq('id', canalEmEdicaoId);
    if(error){ alert('Erro ao salvar: ' + error.message); return; }
  } else {
    const { error } = await supa.from('canais_chat').insert({ ...dadosCanal, criado_por: meuUserId });
    if(error){ alert('Erro ao criar canal: ' + error.message); return; }
  }

  const idParaReabrir = canalEmEdicaoId;
  fecharModalCanal();
  await carregarTudo();
  if(idParaReabrir) await abrirCanal(idParaReabrir);
}
window.confirmarNovoCanal = confirmarNovoCanal;

async function excluirCanal(){
  if(modoAtual !== 'canal') return;
  const canal = canais.find(c=>c.id===alvoAtivoId);
  if(!canal) return;
  pedirConfirmacao(`Excluir #${canal.nome}?`, 'Todas as mensagens desse canal também serão apagadas. Não dá pra desfazer.', async () => {
    const { error } = await supa.from('canais_chat').delete().eq('id', alvoAtivoId);
    if(error){ alert('Erro ao excluir: ' + error.message); return; }
    fecharConversa();
    await carregarTudo();
  });
}
window.excluirCanal = excluirCanal;

function fecharConversa(){
  modoAtual = null; alvoAtivoId = null;
  document.getElementById('inputArea').style.display = 'none';
  document.getElementById('delCanalBtn').style.display = 'none';
  document.getElementById('editCanalBtn').style.display = 'none';
  document.getElementById('canalNome').textContent = 'Selecione uma conversa';
  document.getElementById('canalDesc').textContent = '';
  document.getElementById('mensagensArea').innerHTML = '<div class="empty-state">Escolha um canal ou uma pessoa pra começar.</div>';
}

async function abrirCanal(canalId){
  document.getElementById('digitandoIndicador').style.display = 'none';
  cancelarResposta();
  fecharBuscaConversa();
  modoAtual = 'canal';
  alvoAtivoId = canalId;
  const canal = canais.find(c=>c.id===canalId);
  document.getElementById('canalNome').textContent = '#' + (canal?.nome || '');
  document.getElementById('canalDesc').textContent = canal?.descricao || (canal?.privado ? 'Canal restrito' : '');
  document.getElementById('delCanalBtn').style.display = 'inline-block';
  document.getElementById('editCanalBtn').style.display = (meuPapel==='chefia' || canal?.criado_por===meuUserId) ? 'inline-block' : 'none';
  document.getElementById('inputArea').style.display = 'flex';
  renderSidebar();
  await carregarMensagensCanal();
  assinarTempoRealCanal();
  await marcarCanalComoLido(canalId);
  renderSidebar();
  mostrarConversaMobile();
}
window.abrirCanal = abrirCanal;

async function abrirDm(userId){

let ultimoAutorRenderizado = null;
let ultimoHorarioRenderizado = null;
let ultimaDataRenderizada = null;
const JANELA_AGRUPAMENTO_MS = 5 * 60 * 1000; // 5 minutos

function resetAgrupamento(){
  ultimoAutorRenderizado = null;
  ultimoHorarioRenderizado = null;
  ultimaDataRenderizada = null;
}

function deveAgrupar(m){
  if(ultimoAutorRenderizado !== m.autor_id) return false;
  if(!ultimoHorarioRenderizado) return false;
  return (new Date(m.criado_em) - ultimoHorarioRenderizado) < JANELA_AGRUPAMENTO_MS;
}

function marcarComoRenderizada(m){
  ultimoAutorRenderizado = m.autor_id;
  ultimoHorarioRenderizado = new Date(m.criado_em);
}

function renderListaMensagens(lista, tipo){
  resetAgrupamento();
  const partes = [];
  lista.forEach(m => {
    const agrupada = deveAgrupar(m);
    partes.push(renderMensagem(m, tipo, agrupada));
    marcarComoRenderizada(m);
  });
  return partes.join('');
}

async function carregarMensagensCanal(){
  const { data } = await supa.from('mensagens_chat').select('*').eq('canal_id', alvoAtivoId).order('criado_em');
  mensagensCarregadasPorId = {};
  indexarMensagensCarregadas(data||[]);
  await carregarReacoesPara((data||[]).map(m=>m.id), 'canal');
  const area = document.getElementById('mensagensArea');
  area.innerHTML = (data||[]).length ? renderListaMensagens(data, 'canal') : '<div class="empty-state">Nenhuma mensagem ainda. Manda a primeira!</div>';
  area.scrollTop = area.scrollHeight;
}

function assinarTempoRealCanal(){
  if(subscricaoAtual) supa.removeChannel(subscricaoAtual);
  subscricaoAtual = supa.channel('chat-canal-'+alvoAtivoId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensagens_chat', filter: `canal_id=eq.${alvoAtivoId}` }, (payload) => {
      inserirMensagemNaTela(payload.new, 'canal');
      if(payload.new.autor_id !== meuUserId) notificarMensagemNova(payload.new, 'canal');
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'mensagens_chat', filter: `canal_id=eq.${alvoAtivoId}` }, (payload) => {
      if(mensagensCarregadasPorId[payload.new.id]){
        mensagensCarregadasPorId[payload.new.id].conteudo = payload.new.conteudo;
        mensagensCarregadasPorId[payload.new.id].editado_em = payload.new.editado_em;
        atualizarTextoMensagemNaTela(payload.new.id);
      }
    })
    .on('broadcast', { event: 'digitando' }, (payload) => {
      if(payload.payload.userId !== meuUserId) mostrarDigitando(payload.payload.nome);
    })
    .subscribe();
}

async function carregarMensagensDm(){
  const { data } = await supa.from('dm_mensagens').select('*')
    .or(`and(remetente_id.eq.${meuUserId},destinatario_id.eq.${alvoAtivoId}),and(remetente_id.eq.${alvoAtivoId},destinatario_id.eq.${meuUserId})`)
    .order('criado_em');
  mensagensCarregadasPorId = {};
  const comAutor = (data||[]).map(m => ({...m, autor_id: m.remetente_id}));
  indexarMensagensCarregadas(comAutor);
  await carregarReacoesPara((data||[]).map(m=>m.id), 'dm');
  const area = document.getElementById('mensagensArea');
  area.innerHTML = comAutor.length ? renderListaMensagens(comAutor, 'dm') : '<div class="empty-state">Nenhuma mensagem ainda. Manda a primeira!</div>';
  area.scrollTop = area.scrollHeight;

  // Marca como lidas as mensagens que essa pessoa me mandou
  const naoLidasIds = (data||[]).filter(m => m.destinatario_id===meuUserId && !m.lida).map(m=>m.id);
  if(naoLidasIds.length){
    await supa.from('dm_mensagens').update({ lida: true }).in('id', naoLidasIds);
    await carregarConversasDm();
    renderSidebar();
  }
}

function assinarTempoRealDm(){
  if(subscricaoAtual) supa.removeChannel(subscricaoAtual);
  subscricaoAtual = supa.channel('chat-dm-'+[meuUserId,alvoAtivoId].sort().join('-'))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dm_mensagens' }, async (payload) => {
      const m = payload.new;
      const ehDessaConversa = (m.remetente_id===meuUserId && m.destinatario_id===alvoAtivoId) || (m.remetente_id===alvoAtivoId && m.destinatario_id===meuUserId);
      if(ehDessaConversa){
        inserirMensagemNaTela({...m, autor_id: m.remetente_id}, 'dm');
        if(m.remetente_id !== meuUserId) notificarMensagemNova({...m, autor_id: m.remetente_id}, 'dm');
      }
      await carregarConversasDm();
      renderSidebar();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'dm_mensagens' }, (payload) => {
      const m = payload.new;
      if(mensagensCarregadasPorId[m.id]){
        mensagensCarregadasPorId[m.id].conteudo = m.conteudo;
        mensagensCarregadasPorId[m.id].editado_em = m.editado_em;
        atualizarTextoMensagemNaTela(m.id);
      }
    })
    .on('broadcast', { event: 'digitando' }, (payload) => {
      if(payload.payload.userId !== meuUserId) mostrarDigitando(payload.payload.nome);
    })
    .subscribe();
}

function inserirMensagemNaTela(m, tipo){
  if(document.getElementById('msg_'+m.id)) return;
  mensagensCarregadasPorId[m.id] = { autor_id: m.autor_id, conteudo: m.conteudo };
  const area = document.getElementById('mensagensArea');
  const vazio = area.querySelector('.empty-state');
  if(vazio) vazio.remove();
  const agrupada = deveAgrupar(m);
  area.insertAdjacentHTML('beforeend', renderMensagem(m, tipo, agrupada));
  marcarComoRenderizada(m);
  area.scrollTop = area.scrollHeight;
}

// Formatação estilo WhatsApp: *negrito*, _itálico_, ~riscado~.
// Escapa HTML primeiro (segurança) e só depois aplica a formatação.
function construirRegexMencoes(){
  const nomes = new Set(Object.values(nomesPorId));
  nomes.add('todos');
  const nomesOrdenados = [...nomes].filter(n => n && n !== 'Alguém').sort((a,b)=>b.length-a.length);
  if(!nomesOrdenados.length) return null;
  const escapados = nomesOrdenados.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return new RegExp('@(' + escapados.join('|') + ')\\b', 'g');
}

function formatarTextoMensagem(texto){
  let seguro = (texto||'').replace(/</g,'&lt;');
  seguro = seguro.replace(/\*([^\*\n]+)\*/g, '<strong>$1</strong>');
  seguro = seguro.replace(/_([^_\n]+)_/g, '<em>$1</em>');
  seguro = seguro.replace(/~([^~\n]+)~/g, '<del>$1</del>');
  const regexMencoes = construirRegexMencoes();
  if(regexMencoes) seguro = seguro.replace(regexMencoes, '<span class="mencao">@$1</span>');
  return seguro;
}

let mensagensCarregadasPorId = {}; // id -> {autor_id, conteudo}
let mensagemRespondendoId = null;
let mensagemRespondendoTipo = null;

function indexarMensagensCarregadas(lista){
  lista.forEach(m => { mensagensCarregadasPorId[m.id] = { autor_id: m.autor_id, conteudo: m.conteudo }; });
}

function irParaMensagem(id){
  const el = document.getElementById('msg_'+id);
  if(!el){ return; }
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.add('msg-destacada');
  setTimeout(() => el.classList.remove('msg-destacada'), 1400);
}
window.irParaMensagem = irParaMensagem;

function resumirTexto(texto, max){
  if(!texto) return '';
  const t = texto.replace(/\n/g,' ').trim();
  return t.length > max ? t.slice(0, max).trim()+'…' : t;
}

function responderMensagem(id, tipo){
  const original = mensagensCarregadasPorId[id];
  if(!original) return;
  mensagemRespondendoId = id;
  mensagemRespondendoTipo = tipo;
  document.getElementById('replyBannerNome').textContent = nomesPorId[original.autor_id] || 'Alguém';
  document.getElementById('replyBannerPreview').textContent = resumirTexto(original.conteudo, 90) || '📎 Anexo';
  document.getElementById('replyBanner').style.display = 'flex';
  document.getElementById('msgInput').focus();
}
window.responderMensagem = responderMensagem;

function cancelarResposta(){
  mensagemRespondendoId = null;
  mensagemRespondendoTipo = null;
  document.getElementById('replyBanner').style.display = 'none';
}
window.cancelarResposta = cancelarResposta;

function localDataStrChat(d){ const off=d.getTimezoneOffset(); return new Date(d.getTime()-off*60000).toISOString().slice(0,10); }

function rotuloDataSeparador(dataObj){
  const hojeStr = localDataStrChat(new Date());
  const ontem = new Date(); ontem.setDate(ontem.getDate()-1);
  const ontemStr = localDataStrChat(ontem);
  const dataStr = localDataStrChat(dataObj);
  if(dataStr === hojeStr) return 'Hoje';
  if(dataStr === ontemStr) return 'Ontem';
  const rotulo = dataObj.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
  return rotulo.charAt(0).toUpperCase() + rotulo.slice(1);
}

function separadorDataSeNecessario(m){
  const dataStr = localDataStrChat(new Date(m.criado_em));
  if(dataStr === ultimaDataRenderizada) return '';
  ultimaDataRenderizada = dataStr;
  return `<div class="separador-data"><span>${rotuloDataSeparador(new Date(m.criado_em))}</span></div>`;
}

function renderMensagem(m, tipo, agrupada){
  const separador = separadorDataSeNecessario(m);
  const nome = nomesPorId[m.autor_id] || 'Alguém';
  const hora = new Date(m.criado_em).toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  const minha = m.autor_id === meuUserId;

  let anexoHtml = '';
  if(m.anexo_url){
    anexoHtml = m.anexo_tipo === 'video'
      ? `<div class="msg-anexo"><video src="${m.anexo_url}" controls></video></div>`
      : m.anexo_tipo === 'audio'
      ? `<div class="msg-anexo"><audio src="${m.anexo_url}" controls></audio></div>`
      : m.anexo_tipo === 'pdf'
      ? `<div class="msg-anexo"><a class="pdf-chip" href="${m.anexo_url}" target="_blank" rel="noopener">📄 Abrir PDF</a></div>`
      : m.anexo_tipo === 'planilha'
      ? `<div class="msg-anexo"><a class="pdf-chip" href="${m.anexo_url}" target="_blank" rel="noopener" download>📊 Baixar planilha</a></div>`
      : `<div class="msg-anexo"><img src="${m.anexo_url}" alt="anexo"></div>`;
  }

  const chaveReacao = m.id+'_'+tipo;
  const reacoesMsg = reacoesCache[chaveReacao] || [];
  const checkCount = reacoesMsg.filter(r=>r.reacao==='check').length;
  const xCount = reacoesMsg.filter(r=>r.reacao==='x').length;
  const minhaReacao = reacoesMsg.find(r=>r.usuario_id===meuUserId)?.reacao;
  const botaoExcluir = (minha||meuPapel==='chefia') ? `<button class="msg-del" onclick="excluirMensagem('${m.id}','${tipo}')">excluir</button>` : '';
  const botaoEditar = (minha && m.conteudo) ? `<button class="reply-btn" onclick="editarMensagem('${m.id}','${tipo}')" title="Editar">✏️</button>` : '';

  let citacaoHtml = '';
  if(m.resposta_a_id){
    const original = mensagensCarregadasPorId[m.resposta_a_id];
    const nomeOriginal = original ? (nomesPorId[original.autor_id] || 'Alguém') : 'Mensagem';
    const textoOriginal = original ? resumirTexto(original.conteudo, 110) || '📎 Anexo' : 'não disponível';
    citacaoHtml = `<div class="msg-reply-quote" onclick="irParaMensagem('${m.resposta_a_id}')">
      <div class="msg-reply-quote-nome">${nomeOriginal}</div>
      <div class="msg-reply-quote-texto">${(textoOriginal||'').replace(/</g,'&lt;')}</div>
    </div>`;
  }

  // Mensagens gigantes (mais de ~800 caracteres) começam cortadas,
  // com botão pra expandir — não deixa uma mensagem tomar a tela toda
  const textoLongo = m.conteudo && m.conteudo.length > 800;
  const idTexto = 'txt_'+m.id;

  return `
    ${separador}
    <div class="msg-row ${minha?'mine':''} ${agrupada?'agrupada':''}" id="msg_${m.id}">
      ${agrupada ? `<div class="msg-avatar-spacer"><span class="msg-hora-hover">${hora}</span></div>` : `<div class="msg-avatar">${iniciais(nome)}</div>`}
      <div class="msg-body">
        ${agrupada ? '' : `<div class="msg-meta"><strong>${nome}</strong> · ${hora}${m.editado_em ? ' <span class="msg-editado-tag">(editado)</span>' : ''}${botaoExcluir}</div>`}
        ${citacaoHtml}
        ${m.conteudo ? `<div class="msg-texto ${textoLongo?'truncada':''}" id="${idTexto}">${formatarTextoMensagem(m.conteudo)}</div>
        ${textoLongo ? `<button class="msg-expandir-btn" onclick="expandirMensagem('${idTexto}', this)">Ver mensagem completa</button>` : ''}` : ''}
        ${anexoHtml}
        <div class="msg-reacoes ${(checkCount||xCount)?'tem-reacao':''}">
          <button class="reply-btn" onclick="responderMensagem('${m.id}','${tipo}')" title="Responder">↩</button>
          ${botaoEditar}
          <button class="reacao-btn ${minhaReacao==='check'?'on':''}" onclick="reagir('${m.id}','${tipo}','check')">✅ ${checkCount||''}</button>
          <button class="reacao-btn ${minhaReacao==='x'?'on':''}" onclick="reagir('${m.id}','${tipo}','x')">❌ ${xCount||''}</button>
          ${(minha && (checkCount||xCount)) ? `<button class="reply-btn" onclick="abrirDetalheReacoes('${m.id}','${tipo}')" title="Ver quem reagiu">ⓘ</button>` : ''}
          ${agrupada ? botaoExcluir : ''}
        </div>
      </div>
    </div>`;
}

function expandirMensagem(idTexto, botao){
  const el = document.getElementById(idTexto);
  el.classList.toggle('truncada');
  botao.textContent = el.classList.contains('truncada') ? 'Ver mensagem completa' : 'Ver menos';
}
window.expandirMensagem = expandirMensagem;

async function carregarReacoesPara(mensagemIds, tipo){
  if(!mensagemIds.length) return;
  const { data } = await supa.from('chat_reacoes').select('*').eq('tipo_mensagem', tipo).in('mensagem_id', mensagemIds);
  (data||[]).forEach(r => {
    const chave = r.mensagem_id+'_'+tipo;
    (reacoesCache[chave] ||= []).push(r);
  });
}

async function reagir(mensagemId, tipo, reacao){
  const chave = mensagemId+'_'+tipo;
  const atual = (reacoesCache[chave]||[]).find(r=>r.usuario_id===meuUserId);

  if(atual && atual.reacao === reacao){
    await supa.from('chat_reacoes').delete().match({ mensagem_id: mensagemId, tipo_mensagem: tipo, usuario_id: meuUserId });
  } else {
    await supa.from('chat_reacoes').upsert({ mensagem_id: mensagemId, tipo_mensagem: tipo, usuario_id: meuUserId, reacao });
  }

  reacoesCache = {};
  if(modoAtual === 'canal') await carregarMensagensCanal();
  else await carregarMensagensDm();
}
window.reagir = reagir;

function abrirDetalheReacoes(mensagemId, tipo){
  const chave = mensagemId+'_'+tipo;
  const lista = [...(reacoesCache[chave]||[])].sort((a,b)=> new Date(a.criado_em) - new Date(b.criado_em));
  document.getElementById('detalheReacoesConteudo').innerHTML = lista.length ? lista.map(r => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;">
      <span>${r.reacao==='check'?'✅':'❌'} ${nomesPorId[r.usuario_id] || 'Alguém'}</span>
      <span style="font-size:11.5px;color:var(--gray);">${new Date(r.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
    </div>
  `).join('') : '<div style="color:var(--gray);font-size:12.5px;">Nenhuma reação ainda.</div>';
  document.getElementById('modalDetalheReacoes').classList.add('show');
}
window.abrirDetalheReacoes = abrirDetalheReacoes;

const TAMANHO_MAX_ANEXO = 25 * 1024 * 1024; // 25MB

function detectarTipoAnexo(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(['xlsx','xls','csv'].includes(ext)) return 'planilha';
  if(file.type.startsWith('image')) return 'imagem';
  if(file.type.startsWith('video')) return 'video';
  if(file.type.startsWith('audio')) return 'audio';
  if(file.type === 'application/pdf' || ext==='pdf') return 'pdf';
  return null;
}

function processarArquivoParaAnexo(file){
  const tipo = detectarTipoAnexo(file);
  if(!tipo){
    alert('Só é possível enviar imagem, áudio, vídeo, PDF ou planilha (XLSX, XLS, CSV).');
    return;
  }
  if(file.size > TAMANHO_MAX_ANEXO){
    alert(`Esse arquivo tem ${(file.size/1024/1024).toFixed(1)}MB — o limite por anexo é 25MB.`);
    return;
  }
  arquivoSelecionado = file;
  renderAnexoPreview(file, tipo);
}

function renderAnexoPreview(file, tipo){
  const preview = document.getElementById('anexoPreview');
  preview.style.display = 'flex';
  const tamanho = `${(file.size/1024/1024).toFixed(1)}MB`;
  if(tipo === 'imagem'){
    const url = URL.createObjectURL(file);
    preview.innerHTML = `<img src="${url}" class="anexo-preview-img"><span class="anexo-preview-nome">${file.name} (${tamanho})</span><button onclick="cancelarAnexo()">remover</button>`;
  } else {
    const iconePorTipo = { video:'🎥', audio:'🎵', pdf:'📄', planilha:'📊' };
    preview.innerHTML = `<span style="font-size:22px;">${iconePorTipo[tipo]}</span><span class="anexo-preview-nome">${file.name} (${tamanho})</span><button onclick="cancelarAnexo()">remover</button>`;
  }
}

function anexoSelecionado(input){
  const file = input.files[0];
  if(!file) return;
  processarArquivoParaAnexo(file);
}
window.anexoSelecionado = anexoSelecionado;

function cancelarAnexo(){
  arquivoSelecionado = null;
  document.getElementById('anexoInput').value = '';
  document.getElementById('anexoPreview').style.display = 'none';
}
window.cancelarAnexo = cancelarAnexo;

async function enviarMensagem(){
  if(!modoAtual || !alvoAtivoId) return;
  const input = document.getElementById('msgInput');
  const conteudo = input.value.trim();
  if(!conteudo && !arquivoSelecionado) return;

  let anexo_url = null, anexo_tipo = null;
  if(arquivoSelecionado){
    const ext = arquivoSelecionado.name.split('.').pop();
    const caminho = `${meuUserId}/${Date.now()}.${ext}`;
    const { error: upErr } = await supa.storage.from('chat-anexos').upload(caminho, arquivoSelecionado);
    if(upErr){ alert('Erro ao enviar anexo: ' + upErr.message); return; }
    const { data: pub } = supa.storage.from('chat-anexos').getPublicUrl(caminho);
    anexo_url = pub.publicUrl;
    anexo_tipo = detectarTipoAnexo(arquivoSelecionado) || 'imagem';
  }

  input.value = ''; input.style.height='auto';
  cancelarAnexo();

  const respostaId = (mensagemRespondendoTipo === modoAtual) ? mensagemRespondendoId : null;
  cancelarResposta();

  if(modoAtual === 'canal'){
    const { error } = await supa.from('mensagens_chat').insert({ canal_id: alvoAtivoId, autor_id: meuUserId, conteudo: conteudo||null, anexo_url, anexo_tipo, resposta_a_id: respostaId });
    if(error){ alert('Erro ao enviar: ' + error.message); return; }
    await carregarMensagensCanal();
  } else {
    const { error } = await supa.from('dm_mensagens').insert({ remetente_id: meuUserId, destinatario_id: alvoAtivoId, conteudo: conteudo||null, anexo_url, anexo_tipo, resposta_a_id: respostaId });
    if(error){ alert('Erro ao enviar: ' + error.message); return; }
    await carregarMensagensDm();
    await carregarConversasDm();
    renderSidebar();
  }
}
window.enviarMensagem = enviarMensagem;

function editarMensagem(id, tipo){
  const original = mensagensCarregadasPorId[id];
  if(!original) return;
  const el = document.getElementById('txt_'+id);
  if(!el) return;
  el.outerHTML = `<div class="msg-editar-box" id="editbox_${id}">
    <textarea id="editarea_${id}" rows="2">${(original.conteudo||'').replace(/</g,'&lt;')}</textarea>
    <div class="msg-editar-acoes">
      <button class="secondary" onclick="cancelarEdicaoMensagem('${id}')">Cancelar</button>
      <button onclick="salvarEdicaoMensagem('${id}','${tipo}')">Salvar</button>
    </div>
  </div>`;
  const area = document.getElementById('editarea_'+id);
  area.focus();
  area.setSelectionRange(area.value.length, area.value.length);
}
window.editarMensagem = editarMensagem;

function atualizarTextoMensagemNaTela(id){
  const original = mensagensCarregadasPorId[id];
  if(!original) return;
  const elAtual = document.getElementById('txt_'+id) || document.getElementById('editbox_'+id);
  if(!elAtual) return;
  const textoLongo = original.conteudo && original.conteudo.length > 800;
  elAtual.outerHTML = `<div class="msg-texto ${textoLongo?'truncada':''}" id="txt_${id}">${formatarTextoMensagem(original.conteudo)}</div>`;
  const row = document.getElementById('msg_'+id);
  const meta = row?.querySelector('.msg-meta');
  if(meta && original.editado_em && !meta.querySelector('.msg-editado-tag')){
    meta.querySelector('.msg-del')?.insertAdjacentHTML('beforebegin', ' <span class="msg-editado-tag">(editado)</span>');
  }
}

function cancelarEdicaoMensagem(id){
  atualizarTextoMensagemNaTela(id);
}
window.cancelarEdicaoMensagem = cancelarEdicaoMensagem;

async function salvarEdicaoMensagem(id, tipo){
  const novoTexto = document.getElementById('editarea_'+id).value.trim();
  if(!novoTexto) return;
  const tabela = tipo==='canal' ? 'mensagens_chat' : 'dm_mensagens';
  const agora = new Date().toISOString();
  const { error } = await supa.from(tabela).update({ conteudo: novoTexto, editado_em: agora }).eq('id', id);
  if(error){ alert('Erro ao editar: '+error.message); return; }
  const original = mensagensCarregadasPorId[id];
  if(original){ original.conteudo = novoTexto; original.editado_em = agora; }
  atualizarTextoMensagemNaTela(id);
}
window.salvarEdicaoMensagem = salvarEdicaoMensagem;

async function excluirMensagem(id, tipo){
  pedirConfirmacao('Excluir mensagem?', 'Não dá pra desfazer.', async () => {
    const tabela = tipo === 'canal' ? 'mensagens_chat' : 'dm_mensagens';
    const { error } = await supa.from(tabela).delete().eq('id', id);
    if(error){ alert('Erro: ' + error.message); return; }
    document.getElementById('msg_'+id)?.remove();
  });
}
window.excluirMensagem = excluirMensagem;

// ---------- Mobile: lista/conversa estilo WhatsApp ----------
function mostrarConversaMobile(){
  document.querySelector('.chat-shell').classList.add('mostrando-conversa');
}
function voltarParaListaMobile(){
  document.querySelector('.chat-shell').classList.remove('mostrando-conversa');
}
window.voltarParaListaMobile = voltarParaListaMobile;

// ---------- Detalhes da conversa (mídia e arquivos) ----------
function abrirDetalhesConversa(){
  if(!alvoAtivoId) return;
  let nome, desc;
  if(modoAtual === 'canal'){
    const canal = canais.find(c=>c.id===alvoAtivoId);
    nome = '#' + (canal?.nome || '');
    desc = canal?.descricao || '';
  } else {
    nome = nomesPorId[alvoAtivoId] || 'Conversa';
    desc = ROLE_LABELS[papelPorId[alvoAtivoId]] || '';
  }
  document.getElementById('detConvNome').textContent = nome;
  document.getElementById('detConvDesc').textContent = desc;
  renderDetalhesMidia();
  renderDetalhesArquivos();
  trocarAbaDetalhes('midia');
  document.getElementById('modalDetalhesConversa').classList.add('show');
}
window.abrirDetalhesConversa = abrirDetalhesConversa;

function trocarAbaDetalhes(aba){
  document.getElementById('tabDetMidia').classList.toggle('active', aba==='midia');
  document.getElementById('tabDetArquivos').classList.toggle('active', aba==='arquivos');
  document.getElementById('detConvMidiaGrid').style.display = aba==='midia' ? 'grid' : 'none';
  document.getElementById('detConvArquivosLista').style.display = aba==='arquivos' ? 'block' : 'none';
}
window.trocarAbaDetalhes = trocarAbaDetalhes;

function irParaMensagemFechandoModal(id){
  document.getElementById('modalDetalhesConversa').classList.remove('show');
  setTimeout(() => irParaMensagem(id), 200);
}
window.irParaMensagemFechandoModal = irParaMensagemFechandoModal;

function renderDetalhesMidia(){
  const itens = Object.values(mensagensCarregadasPorId).filter(m => m.anexo_tipo==='imagem' || m.anexo_tipo==='video');
  document.getElementById('detConvMidiaGrid').innerHTML = itens.length ? itens.map(m => m.anexo_tipo==='imagem'
    ? `<img src="${m.anexo_url}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;" onclick="irParaMensagemFechandoModal('${m.id}')">`
    : `<video src="${m.anexo_url}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;" onclick="irParaMensagemFechandoModal('${m.id}')" muted></video>`
  ).join('') : '<div class="empty-state" style="grid-column:1/-1;">Nenhuma mídia enviada ainda.</div>';
}

function renderDetalhesArquivos(){
  const itens = Object.values(mensagensCarregadasPorId).filter(m => m.anexo_tipo==='pdf' || m.anexo_tipo==='planilha');
  document.getElementById('detConvArquivosLista').innerHTML = itens.length ? itens.map(m => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;" onclick="irParaMensagemFechandoModal('${m.id}')">
      <span>${m.anexo_tipo==='pdf'?'📄':'📊'} ${nomesPorId[m.autor_id] || 'Alguém'}</span>
      <span style="font-size:11px;color:var(--gray);">${m.criado_em ? new Date(m.criado_em).toLocaleDateString('pt-BR') : ''}</span>
    </div>
  `).join('') : '<div class="empty-state">Nenhum arquivo enviado ainda.</div>';
}

// ---------- Busca dentro da conversa ----------
function abrirBuscaConversa(){
  if(!alvoAtivoId) return;
  document.getElementById('buscaConversaBar').style.display = 'flex';
  document.getElementById('buscaConversaInput').value = '';
  document.getElementById('buscaConversaInput').focus();
  filtrarBuscaConversa();
}
window.abrirBuscaConversa = abrirBuscaConversa;

function fecharBuscaConversa(){
  document.getElementById('buscaConversaBar').style.display = 'none';
  document.querySelectorAll('.msg-row.busca-oculta').forEach(el => el.classList.remove('busca-oculta'));
  document.querySelectorAll('.msg-row.busca-encontrada').forEach(el => el.classList.remove('busca-encontrada'));
}
window.fecharBuscaConversa = fecharBuscaConversa;

function filtrarBuscaConversa(){
  const termo = document.getElementById('buscaConversaInput').value.trim().toLowerCase();
  const linhas = document.querySelectorAll('#mensagensArea .msg-row');
  const contagem = document.getElementById('buscaConversaContagem');
  if(!termo){
    linhas.forEach(el => { el.classList.remove('busca-oculta'); el.classList.remove('busca-encontrada'); });
    contagem.textContent = '';
    return;
  }
  let achados = 0;
  let primeiroEncontrado = null;
  linhas.forEach(el => {
    const id = el.id.replace('msg_','');
    const m = mensagensCarregadasPorId[id];
    const bate = m && (m.conteudo||'').toLowerCase().includes(termo);
    el.classList.toggle('busca-oculta', !bate);
    el.classList.toggle('busca-encontrada', bate);
    if(bate){ achados++; if(!primeiroEncontrado) primeiroEncontrado = el; }
  });
  contagem.textContent = achados ? `${achados} encontrada(s)` : 'Nada encontrado';
  if(primeiroEncontrado) primeiroEncontrado.scrollIntoView({behavior:'smooth', block:'center'});
}
window.filtrarBuscaConversa = filtrarBuscaConversa;

// ---------- Arrastar e soltar arquivo (anexa igual o WhatsApp) ----------
(function(){
  const areaChat = document.querySelector('.chat-main');
  let contadorArrasto = 0;
  areaChat.addEventListener('dragenter', (e) => {
    e.preventDefault();
    if(!alvoAtivoId) return;
    contadorArrasto++;
    areaChat.classList.add('arrastando-arquivo');
  });
  areaChat.addEventListener('dragover', (e) => e.preventDefault());
  areaChat.addEventListener('dragleave', (e) => {
    e.preventDefault();
    contadorArrasto = Math.max(0, contadorArrasto-1);
    if(contadorArrasto === 0) areaChat.classList.remove('arrastando-arquivo');
  });
  areaChat.addEventListener('drop', (e) => {
    e.preventDefault();
    contadorArrasto = 0;
    areaChat.classList.remove('arrastando-arquivo');
    if(!alvoAtivoId) return;
    const file = e.dataTransfer.files?.[0];
    if(file) processarArquivoParaAnexo(file);
  });
})();

// O gesto nativo do navegador ("arrastar da borda volta a página
// anterior") competia com esse e ganhava, porque touchstart/touchend
// sozinhos com passive:true não conseguem bloquear o gesto nativo --
// precisa de um touchmove não-passivo chamando preventDefault()
let toqueInicioX = null, toqueInicioY = null, bloqueandoGestoNativo = false;
document.addEventListener('touchstart', (e) => {
  if(e.touches.length !== 1) return;
  toqueInicioX = e.touches[0].clientX;
  toqueInicioY = e.touches[0].clientY;
  bloqueandoGestoNativo = false;
}, {passive:true});
document.addEventListener('touchmove', (e) => {
  if(toqueInicioX === null || toqueInicioX > 60) return;
  const naConversa = document.querySelector('.chat-shell')?.classList.contains('mostrando-conversa');
  if(!naConversa) return;
  const toque = e.touches[0];
  const deltaX = toque.clientX - toqueInicioX;
  const deltaY = Math.abs(toque.clientY - toqueInicioY);
  if(deltaX > 15 && deltaY < 40){
    bloqueandoGestoNativo = true;
    e.preventDefault();
  }
}, {passive:false});
document.addEventListener('touchend', (e) => {
  if(toqueInicioX === null) return;
  const toque = e.changedTouches[0];
  const deltaX = toque.clientX - toqueInicioX;
  const deltaY = Math.abs(toque.clientY - toqueInicioY);
  const naConversa = document.querySelector('.chat-shell')?.classList.contains('mostrando-conversa');
  if(naConversa && toqueInicioX < 60 && deltaX > 70 && deltaY < 60){
    voltarParaListaMobile();
  }
  toqueInicioX = null; toqueInicioY = null; bloqueandoGestoNativo = false;
}, {passive:true});

init();
