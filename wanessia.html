<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanessia — Hub Bioflora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<style>
  :root{
    --burgundy:#8B1A3A; --burgundy-tint:#F7E9EE;
    --ink:#161213; --paper:#F3EEEC; --line:#DDD3D0; --gray:#4A4245;
    --headfont: 'Space Grotesk', 'Maven Pro', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Maven Pro',sans-serif;-webkit-font-smoothing:antialiased;}
  .shell{max-width:760px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:0 20px;}
  header.top{padding:22px 0 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .avatar{width:42px;height:42px;border-radius:50%;background:var(--burgundy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--headfont);font-weight:600;font-size:16px;}
  .brand h1{font-family:var(--headfont);font-size:17px;margin:0;font-weight:600;}
  .brand p{font-size:11.5px;color:var(--gray);margin:1px 0 0;}
  .btn{font-family:'Maven Pro',sans-serif;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;}

  .mensagens{flex:1;overflow-y:auto;padding:20px 0;display:flex;flex-direction:column;gap:14px;}
  .msg{max-width:82%;padding:11px 15px;border-radius:14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;}
  .msg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start;}
  .msg.user{background:var(--burgundy);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
  .msg.pensando{color:var(--gray);font-style:italic;}
  .empty-state{margin:auto;text-align:center;color:var(--gray);font-size:13px;padding:0 30px;}
  .empty-state .avatar-grande{width:60px;height:60px;border-radius:50%;background:var(--burgundy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--headfont);font-weight:600;font-size:22px;margin:0 auto 14px;}
  .sugestoes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;}
  .sugestao-btn{font-family:'Maven Pro',sans-serif;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 14px;cursor:pointer;color:var(--ink);}
  .sugestao-btn:hover{border-color:var(--burgundy);color:var(--burgundy);}

  .input-area{padding:16px 0 22px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;}
  .input-area textarea{flex:1;font-family:'Maven Pro',sans-serif;font-size:13.5px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;resize:none;min-height:46px;max-height:120px;}
  .input-area button.enviar{font-family:'Maven Pro',sans-serif;font-size:13px;font-weight:600;padding:0 22px;height:46px;border-radius:10px;border:none;cursor:pointer;background:var(--burgundy);color:#fff;flex-shrink:0;}
  .input-area button.enviar:disabled{opacity:.5;cursor:default;}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="avatar">W</div>
      <div><h1>Wanessia</h1><p>Normas Anvisa e regimento interno · Farmácia Bioflora</p></div>
    </div>
    <a href="index.html" class="btn">← Voltar ao Hub</a>
  </header>

  <div class="mensagens" id="mensagensArea">
    <div class="empty-state" id="estadoVazio">
      <div class="avatar-grande">W</div>
      <p><strong>Oi! Sou a Wanessia.</strong><br>Pode perguntar sobre normas, procedimentos ou pedir dicas pra melhorar seu atendimento.</p>
      <div class="sugestoes">
        <button class="sugestao-btn" onclick="enviarSugestao('Quais erros eu mais cometo nos últimos 30 dias?')">Meus erros recentes</button>
        <button class="sugestao-btn" onclick="enviarSugestao('Como devo proceder com uma receita controlada vencida?')">Receita controlada vencida</button>
        <button class="sugestao-btn" onclick="enviarSugestao('Quais os cuidados na dispensação de manipulados?')">Dispensação de manipulados</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="msgInput" placeholder="Pergunte alguma coisa pra Wanessia..." rows="1"></textarea>
    <button class="enviar" id="btnEnviar" onclick="enviarMensagem()">Enviar</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://gbbjpltqmbhlfluqhrmg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiYmpwbHRxbWJobGZsdXFocm1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDY3ODAsImV4cCI6MjA5ODkyMjc4MH0.Gi3iw6IMyJ_6wrOG3WOcHPTW5Mo1IROTH3x_2qTyzrA';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let historico = [];

async function init(){
  await requireRole(['chefia','rh','gestao','laboratorio','recepcao','conferencia','atendente']);

  document.getElementById('msgInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviarMensagem(); }
  });
}

function enviarSugestao(texto){
  document.getElementById('msgInput').value = texto;
  enviarMensagem();
}
window.enviarSugestao = enviarSugestao;

function renderMensagem(role, texto, id){
  const vazio = document.getElementById('estadoVazio');
  if(vazio) vazio.remove();

  const area = document.getElementById('mensagensArea');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  if(id) div.id = id;
  div.textContent = texto;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

async function enviarMensagem(){
  const input = document.getElementById('msgInput');
  const texto = input.value.trim();
  if(!texto) return;

  input.value = '';
  document.getElementById('btnEnviar').disabled = true;

  renderMensagem('user', texto);
  historico.push({ role: 'user', content: texto });

  const bolhaPensando = renderMensagem('bot', 'Wanessia está digitando...');
  bolhaPensando.classList.add('pensando');

  const { data, error } = await supa.functions.invoke('wanessia-chat', { body: { mensagens: historico } });

  bolhaPensando.remove();
  document.getElementById('btnEnviar').disabled = false;

  if(error || data?.error){
    let motivo = data?.error || error.message;
    if(error?.context && typeof error.context.json === 'function'){
      try{ const corpo = await error.context.json(); if(corpo?.error) motivo = corpo.error; }catch(e){}
    }
    renderMensagem('bot', '⚠️ Erro: ' + motivo);
    return;
  }

  renderMensagem('bot', data.resposta);
  historico.push({ role: 'assistant', content: data.resposta });
}
window.enviarMensagem = enviarMensagem;

init();
</script>
<script src="acessibilidade.js?v=2"></script>
<script src="hub-sidebar.js"></script>
</body>
</html>
