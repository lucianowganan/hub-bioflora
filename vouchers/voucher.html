<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Voucher Bioflora</title>
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--marrom:#7F4812;--ouro:#AB7813;--ouro-esc:#8F6210;--creme:#FAF4E9;--ink:#2B2118;--gray:#7A6C5E}
*{box-sizing:border-box}
body{margin:0;background:#fff}
.voucher{width:1200px;height:480px;background:var(--creme);display:flex;position:relative;overflow:hidden;font-family:'Maven Pro',system-ui,sans-serif;color:var(--ink)}
.valor{width:400px;background:var(--marrom);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.valor .pre{font:600 22px 'Maven Pro',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#E9CF98}
.valor .num{font:700 148px/1 'Space Grotesk',sans-serif;letter-spacing:-.04em;margin:6px 0 2px;display:flex;align-items:flex-start;gap:8px}
.valor .num small{font:600 40px 'Space Grotesk',sans-serif;margin-top:20px;color:#E9CF98;letter-spacing:0}
.valor .off{font:600 20px 'Maven Pro',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#E9CF98}
.valor::after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:2px;background:repeating-linear-gradient(var(--creme) 0 10px,transparent 10px 20px)}
.corte{position:absolute;left:386px;width:28px;height:28px;border-radius:50%;background:#fff;z-index:2}
.corte.a{top:-14px}.corte.b{bottom:-14px}
.corpo{flex:1;padding:44px 56px 40px 60px;display:flex;flex-direction:column;justify-content:space-between}
.corpo img{height:92px;width:auto;align-self:flex-start}
.titulo{font:700 34px/1.15 'Space Grotesk',sans-serif;letter-spacing:-.02em;color:var(--marrom);margin:0;max-width:640px}
.evento{font:600 17px 'Maven Pro',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ouro-esc);margin-top:6px}
.campos{display:flex;gap:36px}
.campo{flex:1}
.campo .l{font:600 13px 'Maven Pro',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gray)}
.campo .linha{border-bottom:2px solid #D8C7A8;height:34px;display:flex;align-items:flex-end;padding-bottom:3px}.pre-data{font:600 22px 'Maven Pro',sans-serif;color:var(--marrom)}
.rodape{font:500 14px 'Maven Pro',sans-serif;color:var(--gray);display:flex;gap:12px;flex-wrap:wrap;border-top:1px solid #E5D8BF;padding-top:12px}.rodape i{font-style:normal;color:var(--ouro)}
.faixa{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--ouro)}
</style></head>
<body>
<div class="voucher" id="v">
  <div class="valor"><div class="pre">Vale-compra</div><div class="num"><small>R$</small><span id="valor">100</span></div><div class="off">de desconto</div></div>
  <div class="corte a"></div><div class="corte b"></div>
  <div class="corpo">
    <img src="../logo-bioflora-vet.svg" alt="Bioflora Vet">
    <div><h1 class="titulo">Você ganhou um voucher para usar na Farmácia Bioflora</h1><div class="evento">Válido em 30 dias</div></div>
    <div class="campos"><div class="campo"><div class="l">Nome</div><div class="linha"></div></div><div class="campo" style="flex:.6"><div class="l">Data de entrega</div><div class="linha"><span class="pre-data">31/10/26</span></div></div></div>
    <div class="rodape"><span>WhatsApp 35 98449-3997</span><i>•</i><span>Rua Francisco Masseli, 426, Centro</span><i>•</i><span>@bioflorafarmacia</span></div>
  </div>
  <div class="faixa"></div>
</div>
</body></html>
