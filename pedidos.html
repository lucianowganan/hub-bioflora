<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — Chama Acesa</title>
<style>
  :root{
    --vinho:#3a0d1a; --dourado:#d9ab5f; --dourado-claro:#f2c98a;
    --texto:#f5ece0; --erro:#e15c5c; --ok:#6fbf73;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--vinho); color:var(--texto); min-height:100vh; padding:20px;}
  .wrap{max-width:760px; margin:0 auto;}
  h1{font-size:1.5rem; color:var(--dourado-claro); margin-bottom:2px;}
  .status-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-size:.85rem;}
  .status-pill{padding:4px 12px; border-radius:999px; font-weight:600;}
  .status-pill.online{background:rgba(111,191,115,.2); color:var(--ok);}
  .status-pill.offline{background:rgba(225,92,92,.2); color:var(--erro);}
  .fila-pill{color:rgba(245,236,224,.7);}

  input[type=text]{
    width:100%; padding:14px; border-radius:10px; border:1px solid rgba(217,171,95,.4);
    background:rgba(0,0,0,.2); color:var(--texto); font-size:1.05rem; margin-bottom:12px;
  }
  .produtos-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; margin-bottom:20px;}
  .produto-card{
    background:rgba(255,255,255,.05); border:1px solid rgba(217,171,95,.25); border-radius:12px;
    padding:14px; text-align:center; cursor:pointer;
  }
  .produto-card:hover{background:rgba(255,255,255,.09);}
  .produto-card .nome{font-weight:700; font-size:.92rem;}
  .produto-card .preco{color:var(--dourado-claro); font-size:.85rem; margin-top:4px;}

  .carrinho{background:rgba(255,255,255,.05); border:1px solid rgba(217,171,95,.3); border-radius:14px; padding:16px; margin-top:20px;}
  .item-carrinho{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08);}
  .item-carrinho:last-child{border-bottom:none;}
  .qtd-controle{display:flex; align-items:center; gap:8px;}
  .qtd-controle button{background:rgba(217,171,95,.2); border:none; color:var(--texto); width:28px; height:28px; border-radius:6px; cursor:pointer; font-size:1rem;}
  .total-linha{display:flex; justify-content:space-between; font-weight:700; font-size:1.1rem; margin-top:10px; padding-top:10px; border-top:1px solid rgba(217,171,95,.3);}

  .btn{background:var(--dourado); color:#2a0a13; border:none; padding:13px 18px; border-radius:10px; font-weight:700; cursor:pointer; font-size:1rem; width:100%; margin-top:14px;}
  .btn:hover{background:var(--dourado-claro);}
  .btn:disabled{opacity:.5; cursor:default;}

  .historico{margin-top:28px;}
  .historico h2{font-size:1.1rem; color:var(--dourado-claro);}
  .pedido-item{background:rgba(255,255,255,.04); border-radius:10px; padding:10px 14px; margin-bottom:8px; font-size:.88rem;}
  .pedido-item .nome{font-weight:700;}

  .add-produto{background:none; border:1px dashed rgba(217,171,95,.4); color:var(--dourado-claro); border-radius:12px; padding:14px; text-align:center; cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛍️ Pedidos — Chama Acesa</h1>
  <div class="status-bar">
    <span class="status-pill" id="status-conexao">verificando...</span>
    <span class="fila-pill" id="fila-info"></span>
  </div>

  <label style="font-size:.85rem; color:var(--dourado-claro);">Nome de quem está pedindo</label>
  <input type="text" id="nome-cliente" placeholder="Nome completo">

  <div id="produtos-container" class="produtos-grid"></div>
  <div class="add-produto" onclick="adicionarProdutoManual()">+ Adicionar item avulso (não está na lista)</div>

  <div class="carrinho" id="carrinho">
    <p style="color:rgba(245,236,224,.6); margin:0;">Nenhum item no carrinho ainda.</p>
  </div>

  <button class="btn" id="btn-finalizar" onclick="finalizarPedido()" disabled>Salvar pedido</button>

  <div class="historico">
    <h2>Últimos pedidos salvos aqui</h2>
    <div id="lista-historico"></div>
  </div>
</div>

<script>
  const CONFIG = {
    SUPABASE_URL: "https://gbbjpltqmbhlfluqhrmg.supabase.co",
    SUPABASE_ANON_KEY: "sb_publishable_a_t-5SMQWML0AQ8muZv6Qg_jYYEIFeP",
    // Cole aqui a lista de produtos disponíveis no evento. Edite antes de usar.
    PRODUTOS: [
      // { nome: "Nome do produto", preco: 0 },
    ]
  };

  const FILA_KEY = 'chama_acesa_fila_pedidos';
  let fila = JSON.parse(localStorage.getItem(FILA_KEY) || '[]');
  let carrinho = {}; // { nomeProduto: {preco, qtd} }

  function salvarFila(){ localStorage.setItem(FILA_KEY, JSON.stringify(fila)); atualizarStatus(); renderHistorico(); }

  function atualizarStatus(){
    const online = navigator.onLine;
    const pill = document.getElementById('status-conexao');
    pill.textContent = online ? '🟢 Online' : '🔴 Offline (salvando local)';
    pill.className = 'status-pill ' + (online ? 'online' : 'offline');
    const pendentes = fila.filter(f => !f.sincronizado).length;
    document.getElementById('fila-info').textContent = pendentes ? `${pendentes} pendente(s) de sincronizar` : 'Tudo sincronizado';
  }

  function renderProdutos(){
    const box = document.getElementById('produtos-container');
    if(!CONFIG.PRODUTOS.length){
      box.innerHTML = '<p style="grid-column:1/-1; color:rgba(245,236,224,.6);">Nenhum produto cadastrado ainda. Use "+ Adicionar item avulso" abaixo ou edite a lista PRODUTOS no arquivo.</p>';
      return;
    }
    box.innerHTML = CONFIG.PRODUTOS.map(p => `
      <div class="produto-card" onclick="adicionarAoCarrinho('${escapeAttr(p.nome)}', ${p.preco})">
        <div class="nome">${escapeHtml(p.nome)}</div>
        <div class="preco">R$ ${p.preco.toFixed(2)}</div>
      </div>
    `).join('');
  }

  function adicionarProdutoManual(){
    const nome = prompt('Nome do produto:');
    if(!nome) return;
    const precoTxt = prompt('Preço (ex: 59.90):', '0');
    const preco = parseFloat(precoTxt.replace(',', '.')) || 0;
    adicionarAoCarrinho(nome, preco);
  }

  function adicionarAoCarrinho(nome, preco){
    if(!carrinho[nome]) carrinho[nome] = {preco, qtd:0};
    carrinho[nome].qtd += 1;
    renderCarrinho();
  }

  function alterarQtd(nome, delta){
    if(!carrinho[nome]) return;
    carrinho[nome].qtd += delta;
    if(carrinho[nome].qtd <= 0) delete carrinho[nome];
    renderCarrinho();
  }

  function renderCarrinho(){
    const box = document.getElementById('carrinho');
    const nomes = Object.keys(carrinho);
    if(!nomes.length){
      box.innerHTML = '<p style="color:rgba(245,236,224,.6); margin:0;">Nenhum item no carrinho ainda.</p>';
      document.getElementById('btn-finalizar').disabled = true;
      return;
    }
    let total = 0;
    box.innerHTML = nomes.map(nome => {
      const item = carrinho[nome];
      total += item.preco * item.qtd;
      return `<div class="item-carrinho">
        <span>${escapeHtml(nome)} <span style="color:rgba(245,236,224,.6);">R$ ${item.preco.toFixed(2)}</span></span>
        <div class="qtd-controle">
          <button onclick="alterarQtd('${escapeAttr(nome)}', -1)">−</button>
          <span>${item.qtd}</span>
          <button onclick="alterarQtd('${escapeAttr(nome)}', 1)">+</button>
        </div>
      </div>`;
    }).join('') + `<div class="total-linha"><span>Total</span><span>R$ ${total.toFixed(2)}</span></div>`;
    document.getElementById('btn-finalizar').disabled = false;
  }

  function finalizarPedido(){
    const nomeCliente = document.getElementById('nome-cliente').value.trim();
    if(!nomeCliente){
      alert('Digite o nome de quem está fazendo o pedido.');
      return;
    }
    const itens = Object.entries(carrinho).map(([nome, item]) => ({nome, preco: item.preco, qtd: item.qtd}));
    const total = itens.reduce((s,i) => s + i.preco*i.qtd, 0);

    const pedido = {
      id: 'local-' + Date.now(),
      nome_cliente: nomeCliente,
      itens,
      total,
      criado_em: new Date().toISOString(),
      sincronizado: false
    };
    fila.push(pedido);
    salvarFila();

    alert(`✅ Pedido salvo: ${nomeCliente} — R$ ${total.toFixed(2)}`);
    carrinho = {};
    document.getElementById('nome-cliente').value = '';
    renderCarrinho();
    tentarSincronizar();
  }

  function renderHistorico(){
    const box = document.getElementById('lista-historico');
    if(!fila.length){
      box.innerHTML = '<p style="color:rgba(245,236,224,.6);">Nenhum pedido salvo ainda.</p>';
      return;
    }
    box.innerHTML = fila.slice().reverse().map(p => `
      <div class="pedido-item">
        <span class="nome">${escapeHtml(p.nome_cliente)}</span> — R$ ${p.total.toFixed(2)}
        ${p.sincronizado ? '✅' : '⏳'}
        <div style="color:rgba(245,236,224,.6); margin-top:4px;">${p.itens.map(i => `${i.qtd}x ${escapeHtml(i.nome)}`).join(', ')}</div>
      </div>
    `).join('');
  }

  async function tentarSincronizar(){
    if(!navigator.onLine) { atualizarStatus(); return; }
    let houveMudanca = false;
    for(const pedido of fila){
      if(pedido.sincronizado) continue;
      try{
        const resp = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/chama_acesa_pedidos`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': CONFIG.SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            nome_cliente: pedido.nome_cliente,
            itens: pedido.itens,
            total: pedido.total,
            criado_em: pedido.criado_em
          })
        });
        if(resp.ok){ pedido.sincronizado = true; houveMudanca = true; }
      }catch(err){
        console.warn('Falhou sincronizar pedido, tenta de novo depois.', err);
      }
    }
    if(houveMudanca) salvarFila();
    atualizarStatus();
  }

  function exportarCSVLocal(){
    if(!fila.length){ alert('Nenhum pedido salvo ainda.'); return; }
    const linhas = [['Nome','Itens','Total','Criado em','Sincronizado']];
    fila.forEach(p => {
      linhas.push([
        p.nome_cliente,
        p.itens.map(i => `${i.qtd}x ${i.nome}`).join(' | '),
        p.total.toFixed(2),
        p.criado_em,
        p.sincronizado ? 'sim' : 'não'
      ]);
    });
    const csv = linhas.map(l => l.map(v => `"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `chama-acesa-pedidos-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }
  function escapeAttr(str){ return String(str).replace(/'/g, "\\'"); }

  window.addEventListener('online', () => { atualizarStatus(); tentarSincronizar(); });
  window.addEventListener('offline', atualizarStatus);
  setInterval(tentarSincronizar, 15000);

  renderProdutos();
  renderCarrinho();
  atualizarStatus();
  renderHistorico();
  tentarSincronizar();
</script>
</body>
</html>
