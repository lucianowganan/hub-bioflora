<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração — Hub Bioflora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/cal-sans" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --burgundy:#8B1A3A; --burgundy-tint:#F7E9EE;
    --ink:#111111; --paper:#FBF9F7; --line:#C9BFC1; --gray:#4A4245;
    --good:#3F7A57; --good-tint:#E8F3EC; --bad:#B4472F; --bad-tint:#FBEBE6;
    --warn:#C9922B; --warn-tint:#FBF1E0;
    --headfont: 'Cal Sans', 'Fraunces', serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Maven Pro',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1050px;margin:0 auto;padding:36px 28px 80px;}
  header.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:20px;margin-bottom:24px;flex-wrap:wrap;gap:16px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{height:34px;display:flex;align-items:center;}
  .brand-mark svg{height:100%;width:auto;display:block;}
  .brand-text h1{font-family:var(--headfont);font-weight:600;font-size:24px;margin:0;letter-spacing:-0.01em;color:var(--ink);}
  .brand-text p{margin:2px 0 0;font-size:12.5px;color:var(--gray);}
  .btn{font-family:'Maven Pro',sans-serif;font-size:13px;font-weight:600;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;background:var(--burgundy);color:#fff;text-decoration:none;display:inline-block;}
  .btn.secondary{background:#fff;color:var(--ink);border:1.5px solid var(--line);}

  .blocked{text-align:center;padding:80px 20px;}
  .blocked .big{font-size:40px;margin-bottom:14px;}

  .panel{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:22px;}
  .panel h2{font-family:var(--headfont);font-size:18px;font-weight:600;margin:0 0 4px;color:var(--ink);}
  .panel .desc{font-size:12.5px;color:var(--gray);margin:0 0 16px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--gray);font-weight:700;padding:0 10px 10px;border-bottom:2px solid var(--ink);}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--line);color:var(--ink);}
  select{font-family:'Maven Pro',sans-serif;font-size:12.5px;padding:6px 10px;border:1.5px solid var(--line);border-radius:7px;color:var(--ink);background:#fff;}
  .btn-reset-senha{font-family:'Maven Pro',sans-serif;font-size:11.5px;font-weight:600;padding:6px 11px;border:1.5px solid var(--line);border-radius:7px;background:#fff;color:var(--burgundy);cursor:pointer;white-space:nowrap;}
  .btn-reset-senha:hover{border-color:var(--burgundy);}
  .tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;white-space:nowrap;}
  .tag.chefia{background:var(--burgundy-tint);color:var(--burgundy);}
  .tag.rh{background:var(--good-tint);color:var(--good);}
  .tag.gestao{background:#EFE7F5;color:#6E4A8C;}
  .tag.laboratorio{background:var(--warn-tint);color:#8A6512;}
  .tag.recepcao{background:#E9F0F6;color:#3E6B93;}
  .tag.conferencia{background:var(--bad-tint);color:var(--bad);}
  .tag.atendente{background:#E4F0EA;color:#2F5F42;}
  .tag.sem_papel{background:#F1ECEA;color:var(--gray);}

  .roles-legend{font-size:12px;color:var(--gray);margin-top:18px;line-height:1.8;}
  .roles-legend strong{color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-mark"><svg id="Camada_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 31.3 8.7">

    </style>
  </defs>
  <image class="st1" width="1000" height="250" transform="translate(-1 -.4) scale(0)" xlink:href="Bioflora/logo-bioflora-vinho-e-cinza.png"/>
  <path class="st3" d="M12.1,3.5s.2-.2.2-.3c.3-.8-.1-1.6-.9-1.7-.3,0-1.5,0-1.8,0-.2,0-.3.2-.4.4,0,1.1,0,2.3,0,3.3,0,.3.1.4.4.5.4,0,1.6,0,1.9,0,.7-.2,1-1,.8-1.6,0-.1-.2-.4-.2-.5ZM11.4,4.6s-.2.1-.2.1h-1.1v-.9h1.2s.1,0,.2.1c.2.2.2.6,0,.7ZM11.4,2.9s-.2.2-.2.2h-1.2v-.7s0,0,0,0h1.1s.2,0,.2.1c.2.1.2.3,0,.5Z"/>

  <path class="st3" d="M15.6,2.4c-2.3,0-2,3.6.3,3.1,1.8-.4,1.5-3.2-.3-3.1ZM16.3,4.3c-.3.8-1.6.4-1.4-.5.1-.5.8-.7,1.2-.3.2.2.3.5.2.8Z"/>
  <path class="st3" d="M23.1,2.5c-1.9.3-1.7,3.3.4,3.2,2.1-.1,1.9-3.5-.4-3.2ZM22.9,4.6c-.5-.4-.3-1.3.4-1.3.3,0,.6.2.7.5.3.7-.5,1.3-1.1.9Z"/>
  <path class="st3" d="M19,3.2c.7,0,.7.9,0,.9,0,.8.2,1.8-.6,2.3s-1,.1-.9-.4.7-.2.7-.5,0-1,0-1.4c-.7,0-.7-.9,0-.9,0-.6,0-1.3.6-1.6s1.1-.3,1,.4-.7.2-.7.5,0,.6,0,.8Z"/>
  <path class="st3" d="M20.8,1.6c0,0,.1.3.1.4v2.6c.1.3.4.2.6.3.3.2.1.7-.2.7-.6,0-1.2-.4-1.2-.9,0-.9,0-1.9,0-2.9,0-.3.5-.4.7-.2Z"/>
  <path class="st3" d="M25.7,2.9c.3-.3,1.2-.7,1.5-.3s.1.4,0,.6c-.3.2-.6,0-.9.4s0,1.2-.1,1.6-.8.4-.8,0,0-1.1,0-1.4.2-.7.4-1Z"/>

  <path class="st3" d="M13.1,1.5c.7-.1.7,1,0,.8s-.5-.8,0-.8Z"/>
  <circle class="st0" cx="30.9" cy="2.7" r=".4"/>
  <text class="st2" transform="translate(19.1 7.9) scale(1 1)"><tspan x="0" y="0">FARMÁCIA</tspan></text>
  <text class="st4" transform="translate(30.7 2.9)"><tspan x="0" y="0">R</tspan></text>
</svg></div>
      <div class="brand-text">
        <h1>Administração</h1>
        <p>Usuários e permissões — acesso restrito à chefia</p>
      </div>
    </div>
    <a href="index.html" class="btn secondary">← Voltar ao Hub</a> <button onclick="logout()" class="btn secondary" style="margin-left:6px">Sair</button>
  </header>

  <div id="content"></div>
</div>

<script>
const SUPABASE_URL = 'https://gbbjpltqmbhlfluqhrmg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiYmpwbHRxbWJobGZsdXFocm1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDY3ODAsImV4cCI6MjA5ODkyMjc4MH0.Gi3iw6IMyJ_6wrOG3WOcHPTW5Mo1IROTH3x_2qTyzrA';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ROLE_LABELS = {chefia:'Chefia', rh:'RH', gestao:'Gestão', laboratorio:'Laboratório', recepcao:'Recepção', conferencia:'Conferência', atendente:'Atendente', sem_papel:'Sem papel'};

async function logout(){ await supa.auth.signOut(); window.location.href = 'login.html'; }

async function init(){
  const { data: { session } } = await supa.auth.getSession();
  if(!session){ window.location.href = 'login.html'; return; }

  const { data: meuPerfil } = await supa.from('perfis').select('papel').eq('id', session.user.id).maybeSingle();
  if(!meuPerfil || meuPerfil.papel !== 'chefia'){
    document.getElementById('content').innerHTML = `
      <div class="panel blocked">
        <div class="big">🔒</div>
        <p>Esta área é restrita à chefia.<br>Seu papel atual: <strong>${ROLE_LABELS[meuPerfil?.papel || 'sem_papel']}</strong></p>
      </div>`;
    return;
  }

  const { data: perfis, error } = await supa.from('perfis').select('*').order('criado_em', {ascending:true});
  if(error){ document.getElementById('content').innerHTML = `<div class="panel">Erro ao carregar: ${error.message}</div>`; return; }

  const { data: atendentesList } = await supa.from('atendentes_erros').select('nome').order('nome');
  const atendentes = (atendentesList||[]).map(a=>a.nome);

  const { data: avisos } = await supa.from('avisos_popup').select('*').order('criado_em', {ascending:false});

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <h2>Avisos em pop-up</h2>
      <p class="desc">Cria um aviso que aparece na tela de quem tem o cargo escolhido assim que abrir o Hub</p>
      <div style="display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px;">
        <input id="avisoTitulo" placeholder="Título do aviso" style="font-family:'Maven Pro',sans-serif;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;">
        <textarea id="avisoMensagem" placeholder="Mensagem completa..." style="font-family:'Maven Pro',sans-serif;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;min-height:70px;resize:vertical;"></textarea>
        <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;">
          <label><input type="checkbox" value="" id="avisoTodos" checked onchange="toggleAvisoTodos()"> Todo mundo</label>
          ${Object.entries(ROLE_LABELS).filter(([k])=>k!=='sem_papel').map(([k,l]) => `<label><input type="checkbox" class="avisoPapel" value="${k}" disabled> ${l}</label>`).join('')}
        </div>
        <button class="btn-reset-senha" style="width:fit-content;background:var(--burgundy);color:#fff;border-color:var(--burgundy)" onclick="criarAviso()">Criar aviso</button>
      </div>
      ${(avisos||[]).length ? `<table>
        <thead><tr><th>Título</th><th>Alvo</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${avisos.map(a => `
            <tr>
              <td><strong>${a.titulo}</strong><br><span style="color:var(--gray);font-size:12px">${a.mensagem}</span></td>
              <td style="font-size:12px">${a.papeis_alvo.length ? a.papeis_alvo.map(p=>ROLE_LABELS[p]).join(', ') : 'Todo mundo'}</td>
              <td><span class="tag ${a.ativo?'chefia':''}" style="background:${a.ativo?'var(--good-tint)':'#F1ECEA'};color:${a.ativo?'var(--good)':'var(--gray)'}">${a.ativo?'Ativo':'Desativado'}</span></td>
              <td>
                <button class="btn-reset-senha" onclick="toggleAvisoAtivo('${a.id}', ${!a.ativo})">${a.ativo?'Desativar':'Reativar'}</button>
                <button class="btn-reset-senha" style="color:var(--bad)" onclick="excluirAviso('${a.id}')">Excluir</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>` : '<p style="color:var(--gray);font-size:12.5px">Nenhum aviso criado ainda.</p>'}
    </div>

    <div class="panel">
      <h2>Usuários cadastrados</h2>
      <p class="desc">Defina o papel de cada pessoa e, se ela participar da conferência, vincule ao nome dela na planilha de erros</p>
      <table>
        <thead><tr><th>Email</th><th>Papel atual</th><th>Alterar</th><th>Vincular a atendente (erros)</th><th>Senha</th></tr></thead>
        <tbody id="tbody">
          ${perfis.map(p => `
            <tr>
              <td>${p.nome_exibicao || '—'}</td>
              <td><span class="tag ${p.papel}">${ROLE_LABELS[p.papel]}</span></td>
              <td>
                <select onchange="updatePapel('${p.id}', this.value)">
                  ${Object.entries(ROLE_LABELS).map(([k,l]) => `<option value="${k}" ${k===p.papel?'selected':''}>${l}</option>`).join('')}
                </select>
              </td>
              <td>
                <select onchange="updateVinculo('${p.id}', this.value)">
                  <option value="">— nenhum —</option>
                  ${atendentes.map(a => `<option value="${a}" ${a===p.atendente_vinculado?'selected':''}>${a}</option>`).join('')}
                </select>
              </td>
              <td>
                <button class="btn-reset-senha" onclick="redefinirSenha('${p.id}', '${(p.nome_exibicao||'').replace(/'/g,"\\'")}')">Redefinir senha</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div class="roles-legend">
        <strong>Chefia</strong>: acessa tudo, inclusive administração ·
        <strong>RH</strong>: só envio de planilhas do banco de horas ·
        <strong>Gestão</strong>: só resultados do banco de horas ·
        <strong>Laboratório</strong>: controle de produção (fórmulas/pesagens) ·
        <strong>Recepção</strong>: kanban de rótulos ·
        <strong>Conferência</strong>: rótulos, ordens de produção e a grade completa de erros ·
        <strong>Atendente</strong>: rótulos, ordens de produção e o próprio desempenho em "Meus erros" ·
        <strong>Sem papel</strong>: nenhum módulo até ser definido<br><br>
        O vínculo com atendente é usado na tela "Meus erros" — cada pessoa vinculada só vê o próprio desempenho lá.
      </div>
    </div>`;
}

async function updatePapel(id, papel){
  const { error } = await supa.from('perfis').update({papel}).eq('id', id);
  if(error){ alert('Erro ao atualizar: ' + error.message); return; }
  init();
}
window.updatePapel = updatePapel;

async function updateVinculo(id, atendente_vinculado){
  const { error } = await supa.from('perfis').update({atendente_vinculado: atendente_vinculado || null}).eq('id', id);
  if(error){ alert('Erro ao vincular: ' + error.message); return; }
  init();
}
window.updateVinculo = updateVinculo;

async function redefinirSenha(userId, nomeExibicao){
  const novaSenha = prompt(`Nova senha para ${nomeExibicao || 'este usuário'} (mínimo 6 caracteres):`);
  if(!novaSenha) return;
  if(novaSenha.length < 6){ alert('A senha precisa ter pelo menos 6 caracteres.'); return; }

  const { data, error } = await supa.functions.invoke('admin-reset-password', {
    body: { userId, novaSenha }
  });

  if(error || data?.error){
    let motivo = data?.error || error.message;
    // O erro genérico do Supabase esconde o corpo real da resposta — vamos buscar
    if(error?.context && typeof error.context.json === 'function'){
      try{
        const corpo = await error.context.json();
        if(corpo?.error) motivo = corpo.error;
      }catch(e){ /* corpo não era JSON, mantém a mensagem genérica */ }
    }
    alert('Erro ao redefinir: ' + motivo);
    return;
  }
  alert(`Senha redefinida para ${data.email}. Avise a pessoa com a nova senha por um canal seguro (WhatsApp, presencial etc).`);
}
window.redefinirSenha = redefinirSenha;

function toggleAvisoTodos(){
  const todos = document.getElementById('avisoTodos').checked;
  document.querySelectorAll('.avisoPapel').forEach(cb => { cb.disabled = todos; if(todos) cb.checked = false; });
}
window.toggleAvisoTodos = toggleAvisoTodos;

async function criarAviso(){
  const titulo = document.getElementById('avisoTitulo').value.trim();
  const mensagem = document.getElementById('avisoMensagem').value.trim();
  if(!titulo || !mensagem){ alert('Preencha título e mensagem.'); return; }

  const todos = document.getElementById('avisoTodos').checked;
  const papeis_alvo = todos ? [] : Array.from(document.querySelectorAll('.avisoPapel:checked')).map(cb=>cb.value);
  if(!todos && !papeis_alvo.length){ alert('Escolha "Todo mundo" ou pelo menos um cargo.'); return; }

  const { data: { session } } = await supa.auth.getSession();
  const { error } = await supa.from('avisos_popup').insert({ titulo, mensagem, papeis_alvo, criado_por: session.user.id });
  if(error){ alert('Erro ao criar aviso: ' + error.message); return; }
  init();
}
window.criarAviso = criarAviso;

async function toggleAvisoAtivo(id, novoStatus){
  const { error } = await supa.from('avisos_popup').update({ativo: novoStatus}).eq('id', id);
  if(error){ alert('Erro: ' + error.message); return; }
  init();
}
window.toggleAvisoAtivo = toggleAvisoAtivo;

async function excluirAviso(id){
  if(!confirm('Excluir esse aviso? Não dá pra desfazer.')) return;
  const { error } = await supa.from('avisos_popup').delete().eq('id', id);
  if(error){ alert('Erro: ' + error.message); return; }
  init();
}
window.excluirAviso = excluirAviso;

init();
</script>
</body>
</html>
