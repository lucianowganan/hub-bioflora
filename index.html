<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub Bioflora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --burgundy:#8B1A3A; --burgundy-dark:#5E1027; --burgundy-tint:#F7E9EE;
    --ink:#161213; --paper:#F3EEEC; --line:#DDD3D0; --gray:#4A4245;
    --good:#3F7A57; --good-tint:#E8F3EC;
    --bad:#B4472F; --bad-tint:#FBEBE6;
    --info:#3E6B93; --info-tint:#E9F0F6;
    --warn:#C9922B; --warn-tint:#FBF1E0;
    --headfont: 'Space Grotesk', 'Maven Pro', sans-serif;
    --sidebar-w: 92px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Maven Pro',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    position:fixed;left:14px;top:14px;bottom:14px;width:64px;background:linear-gradient(180deg,#B8325A 0%,#8B1A3A 48%,#4A0E20 100%);border-radius:28px;box-shadow:0 8px 28px rgba(74,14,32,.28);
    display:flex;flex-direction:column;align-items:stretch;padding:20px 0;z-index:200;overflow:hidden;
    transition:width .16s ease;
  }
  .sidebar:hover{width:250px;overflow-y:auto;}
  .sidebar.editando{width:250px !important;overflow-y:auto;}
  .side-arrastavel{cursor:grab;}
  .side-arrastavel:active{cursor:grabbing;}
  .side-arrastando{opacity:.35;}
  .side-drag-over{outline:2px dashed rgba(255,255,255,.6);}
  .sidebar::-webkit-scrollbar{width:0;}
  .sidebar .mark-row{display:flex;align-items:center;gap:12px;padding:0 13px;margin-bottom:22px;flex-shrink:0;}
  .sidebar .mark{width:38px;height:38px;min-width:38px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .sidebar .mark svg{width:38px;height:36px;display:block;}
  .sidebar .mark-nome{color:#fff;font-family:var(--headfont);font-weight:600;font-size:14.5px;white-space:nowrap;opacity:0;transition:opacity .12s;}
  .sidebar:hover .mark-nome{opacity:1;}
  .sidebar nav{display:flex;flex-direction:column;gap:4px;flex:1;}
  .side-btn{
    display:flex;align-items:center;gap:14px;height:42px;min-height:42px;border-radius:16px;
    color:rgba(255,255,255,.7);text-decoration:none;cursor:pointer;border:none;background:transparent;
    transition:background .15s,color .15s;position:relative;flex-shrink:0;font-family:'Maven Pro',sans-serif;
    font-size:13px;font-weight:600;width:calc(100% - 16px);margin:0 8px;padding:0 13px;white-space:nowrap;
    box-sizing:border-box;
  }
  .side-btn .side-icon{width:21px;height:21px;min-width:21px;flex-shrink:0;}
  .side-btn .tooltip{opacity:0;transition:opacity .1s;}
  .sidebar:hover .side-btn .tooltip{opacity:1;}
  .side-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
  .side-btn.active{background:#fff;color:var(--burgundy);}
  .sidebar .bottom{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}

  @media (max-width:720px){
    .main{margin-left:0;}
    .sidebar{left:0;right:0;top:auto;bottom:0;width:auto !important;height:calc(64px + env(safe-area-inset-bottom,0px));flex-direction:row;border-radius:0;box-shadow:none;background:linear-gradient(90deg,#B8325A 0%,#8B1A3A 50%,#4A0E20 100%);
      padding:0 4px env(safe-area-inset-bottom,0px);overflow-x:auto;overflow-y:hidden;align-items:center;}
    .sidebar .mark-row{display:none;}
    .sidebar nav{flex-direction:row;gap:0;flex:none;}
    .sidebar .bottom{flex-direction:row;gap:0;}
    .side-btn{width:56px;min-width:56px;height:56px;margin:0;padding:0;flex-direction:column;justify-content:center;gap:2px;border-radius:10px;}
    .side-btn .tooltip{display:none;}
  }

  /* ---------- Main ---------- */
  .main{margin-left:var(--sidebar-w);padding:28px 28px 80px;}
  .wrap{max-width:1180px;margin:0 auto;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .who{font-size:12.5px;color:var(--gray);}

  /* Quick stats row */
  .quickstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
  .qs-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
  .qs-card .qs-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);font-weight:700;}
  .qs-card .qs-value{font-family:var(--headfont);font-size:24px;font-weight:600;margin-top:4px;color:var(--ink);}
  .qs-card.accent{background:var(--burgundy);color:#fff;}
  .qs-card.accent .qs-label{color:rgba(255,255,255,.75);}
  .qs-card.accent .qs-value{color:#fff;}

  /* Welcome hero */
  .hero{
    background:linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
    border-radius:22px;padding:28px 32px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden;
  }
  .hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;position:relative;z-index:1;}
  .hero h1{font-family:var(--headfont);font-size:27px;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .hero .sub{font-size:13px;opacity:.8;margin-top:4px;}
  .role-pill{background:rgba(255,255,255,.16);border-radius:20px;padding:6px 16px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}

  /* Widget grid */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-bottom:8px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;grid-column:span 12;}
  @media (min-width:760px){
    .card.w4{grid-column:span 4;} .card.w6{grid-column:span 6;} .card.w8{grid-column:span 8;} .card.w12{grid-column:span 12;}
    .home-period-btn{font-family:'Maven Pro',sans-serif;font-size:11.5px;font-weight:600;padding:6px 14px;border-radius:16px;border:1px solid #E7DFE0;background:#fff;cursor:pointer;color:#6E6266;}
    .home-period-btn.active{background:#8B1A3A;color:#fff;border-color:#8B1A3A;}
  }
  .card h2{font-family:var(--headfont);font-size:15px;font-weight:600;margin:0 0 2px;color:var(--ink);}
  .card .card-sub{font-size:11.5px;color:var(--gray);margin:0 0 16px;}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px;}
  .card-icon{font-size:20px;}

  .stat-big{font-family:var(--headfont);font-size:34px;font-weight:600;color:var(--ink);line-height:1;}
  .stat-delta{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;margin-top:8px;}
  .stat-delta.good{background:var(--good-tint);color:var(--good);}
  .stat-delta.bad{background:var(--bad-tint);color:var(--bad);}

  .mini-list{font-size:13px;}
  .mini-list-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);}
  .mini-list-row:last-child{border-bottom:none;}
  .mini-list-row .name{font-weight:600;}
  .badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;text-transform:uppercase;}
  .badge.bad{background:var(--bad-tint);color:var(--bad);}
  .badge.warn{background:var(--warn-tint);color:#8A6512;}
  .badge.good{background:var(--good-tint);color:var(--good);}
  .badge.info{background:var(--info-tint);color:var(--info);}

  canvas{max-height:200px;}
  .empty-mini{font-size:12px;color:var(--gray);padding:14px 0;text-align:center;}
  .card-alert{font-size:11.5px;font-weight:600;background:var(--bad-tint);color:var(--bad);border-radius:8px;padding:8px 11px;margin:4px 0 8px;}

  /* Integrações (placeholder) */
  .integ-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:stretch;}
  .integ-card{background:#fff;border:1.5px dashed var(--line);border-radius:16px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;}
  .integ-card .integ-icon{font-size:26px;margin-bottom:8px;flex-shrink:0;}
  .integ-card h3{font-family:var(--headfont);font-size:14px;margin:0 0 4px;color:var(--ink);flex-shrink:0;}
  .integ-card p{font-size:11.5px;color:var(--gray);margin:0 0 12px;line-height:1.4;flex:1;}
  .integ-soon{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);background:#F1ECEA;padding:5px 12px;border-radius:20px;display:inline-block;flex-shrink:0;align-self:center;width:fit-content;}

  /* Mini calendário (prévia, clique leva pro módulo completo) */
  .minical-link{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:8px;transition:.15s;}
  .minical-link:hover{border-color:var(--burgundy);}
  .minical-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .minical-head h3{font-family:var(--headfont);font-size:15px;margin:0;text-transform:capitalize;color:var(--ink);}
  .minical-head span{font-size:11.5px;color:var(--burgundy);font-weight:700;}
  .minical-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .minical-weekday{text-align:center;font-size:9.5px;font-weight:700;color:var(--gray);text-transform:uppercase;padding:2px 0 6px;}
  .minical-day{min-height:52px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:#fff;}
  .minical-day.empty{visibility:hidden;}
  .minical-day.today{border-color:var(--burgundy);border-width:1.5px;background:var(--burgundy-tint);}
  .minical-day-num{font-size:10.5px;font-weight:700;color:var(--gray);}
  .minical-day.today .minical-day-num{color:var(--burgundy);}
  .minical-evt{font-size:9px;line-height:1.3;background:var(--burgundy);color:#fff;border-radius:3px;padding:1px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .minical-evt-more{font-size:9px;color:var(--gray);margin-top:1px;}

  .section-title{font-family:var(--headfont);font-size:17px;font-weight:600;margin:34px 0 14px;color:var(--ink);}
  .modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .module-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;color:var(--ink);display:block;transition:.15s;position:relative;overflow:hidden;}
  .module-card:hover{border-color:var(--burgundy);transform:translateY(-2px);}
  .module-card .stripe{position:absolute;top:0;left:0;right:0;height:4px;}
  .module-card .icon{font-size:24px;margin-bottom:10px;}
  .module-card h3{font-family:var(--headfont);font-size:15px;font-weight:600;margin:0 0 4px;}
  .module-card p{font-size:11.5px;color:var(--gray);margin:0;line-height:1.4;}
  .card-horas .stripe{background:var(--burgundy);}
  .card-rh .stripe{background:var(--burgundy);}
  .card-visitas .stripe{background:var(--burgundy);}
  .card-rotulos .stripe{background:var(--warn);}
  .card-producao .stripe{background:var(--info);}
  .card-controle .stripe{background:#6E4A8C;}
  .card-erros .stripe{background:#B4472F;}
  .card-meuserros .stripe{background:var(--good);}
  .card-chat .stripe{background:#6E4A8C;}
  .card-reaproveitamento .stripe{background:#2F7A5F;}
  .card-tarefas .stripe{background:var(--good);}
  .card-calendario-interno .stripe{background:var(--info);}

  .status-banner{background:var(--warn-tint);border:1px solid #EBD8A6;border-radius:12px;padding:12px 16px;font-size:12.5px;color:#7A5C15;margin-top:24px;}
  .loading-msg{font-size:12px;color:var(--gray);padding:30px 0;text-align:center;}
  footer{margin-top:50px;text-align:center;font-size:11px;color:var(--gray);}

  /* ============================================================
     REPAGINAÇÃO DA HOME (linha "Suave" + grupos por área)
     Estas regras sobrescrevem as antigas acima.
     ============================================================ */
  body{background:#F4EFEC;}
  .main{padding:26px 34px 80px;}
  .wrap{max-width:1320px;}

  .hm-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;}
  .hm-search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:30px;padding:0 18px;height:44px;width:380px;max-width:100%;box-shadow:0 1px 3px rgba(0,0,0,.04);color:#9a8f92;}
  .hm-search svg{width:18px;height:18px;flex-shrink:0;}
  .hm-search input{border:none;outline:none;background:transparent;font-family:'Maven Pro',sans-serif;font-size:14px;color:var(--ink);width:100%;}
  .hm-user{display:flex;align-items:center;gap:12px;}
  .hm-user-txt{text-align:right;line-height:1.25;}
  .hm-user-txt b{display:block;font-size:13.5px;font-weight:700;}
  .hm-user-txt span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--burgundy);}
  .hm-av{width:42px;height:42px;border-radius:50%;background:var(--burgundy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;}

  .hm-hero{background:linear-gradient(120deg,#9A2347 0%,#5E1027 100%);border-radius:30px;padding:32px 38px;color:#fff;position:relative;overflow:hidden;margin-bottom:22px;}
  .hm-hero::after{content:'';position:absolute;right:-90px;top:-100px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none;}
  .hm-hero-txt{position:relative;z-index:1;}
  .hm-date{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;font-weight:700;}
  .hm-hero h1{font-family:var(--headfont);font-size:32px;font-weight:600;margin:6px 0 4px;letter-spacing:-0.01em;}
  .hm-hero .sub{font-size:14px;opacity:.8;}
  .hm-kpis{display:flex;flex-wrap:wrap;gap:14px;margin-top:24px;position:relative;z-index:1;}
  .hm-kpi{display:block;text-decoration:none;color:#fff;background:rgba(255,255,255,.14);border-radius:20px;padding:15px 22px;min-width:168px;transition:background .15s;}
  a.hm-kpi:hover{background:rgba(255,255,255,.22);}
  .hm-kpi b{display:block;font-family:var(--headfont);font-size:28px;font-weight:600;line-height:1.1;}
  .hm-kpi .l{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.82;margin-top:3px;font-weight:700;}
  .hm-kpi .h{display:block;font-size:11.5px;opacity:.7;margin-top:2px;}
  .hm-kpi.bad{background:rgba(232,64,64,.28);}
  .hm-kpi.warn{background:rgba(201,146,43,.3);}

  .hm-sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 14px;}
  .hm-sec h2{font-family:var(--headfont);font-size:17px;font-weight:600;margin:0;}
  .hm-sec small{font-size:12px;color:var(--gray);}

  /* cartões de painel (widgets) */
  .grid{gap:16px;grid-auto-flow:dense;}
  .card{border:none;border-radius:24px;padding:22px 24px;box-shadow:0 2px 10px rgba(94,16,39,.06);}
  .card-head h2{font-size:15px;}
  .card-icon{width:34px;height:34px;border-radius:11px;background:var(--burgundy-tint);color:var(--burgundy);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0;}
  .card-icon svg{width:18px;height:18px;}
  .card-sub a{color:var(--burgundy);font-weight:700;text-decoration:none;}
  .hm-chart{position:relative;height:220px;}
  .hm-chart canvas{max-height:none;}
  .hm-lista{display:flex;flex-direction:column;}
  .hm-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13px;}
  .hm-item:last-child{border-bottom:none;}
  a.hm-item:hover .nome{color:var(--burgundy);}
  .hm-item .nome{font-weight:600;}
  .hm-item .sub{display:block;font-size:11.5px;color:var(--gray);font-weight:400;margin-top:1px;}
  .hm-ok{font-size:11px;color:var(--gray);}
  .hm-skel{height:140px;border-radius:24px;background:linear-gradient(90deg,#EFE8E4,#F7F2EF,#EFE8E4);background-size:200% 100%;animation:hmSkel 1.2s infinite;}
  @keyframes hmSkel{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* módulos por área */
  .hm-grupo{margin-bottom:22px;}
  .hm-grupo h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--burgundy);font-weight:700;margin:0 2px 12px;}
  .hm-mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .hm-mod{display:block;background:#fff;border-radius:22px;padding:18px 18px 16px;text-decoration:none;color:var(--ink);box-shadow:0 2px 10px rgba(94,16,39,.06);transition:transform .15s,box-shadow .15s;}
  .hm-mod:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(94,16,39,.12);}
  .hm-mi{width:42px;height:42px;border-radius:14px;background:var(--burgundy-tint);color:var(--burgundy);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
  .hm-mi svg{width:22px;height:22px;}
  .hm-mod h3{font-family:var(--headfont);font-size:14.5px;font-weight:600;margin:0 0 4px;}
  .hm-mod p{font-size:12px;color:#7a6e72;margin:0;line-height:1.4;}
  .hm-vazio{text-align:center;color:var(--gray);padding:30px 0;font-size:13px;}
  .minical-link{border:none;border-radius:24px;box-shadow:0 2px 10px rgba(94,16,39,.06);}
  .minical-link:hover{box-shadow:0 8px 22px rgba(94,16,39,.12);}

  /* ---------- Responsivo (celular / tela dividida estreita) ---------- */
  @media (max-width:720px){
    .main{margin-left:0;padding:16px 14px calc(80px + env(safe-area-inset-bottom,0px));}
    .hm-top{gap:10px;}
    .hm-search{width:auto;flex:1;height:42px;}
    .hm-user-txt{display:none;}
    .hm-hero{padding:22px 20px;border-radius:24px;}
    .hm-hero h1{font-size:24px;}
    .hm-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
    .hm-kpi{min-width:0;padding:13px 15px;border-radius:16px;}
    .hm-kpi b{font-size:22px;}
    .card{padding:18px;border-radius:20px;}
    .hm-chart{height:200px;}
    .hm-mods{grid-template-columns:1fr 1fr;gap:10px;}
    .hm-mod{padding:14px;border-radius:18px;}
    .minical-link{padding:14px;}
    .minical-grid{gap:2px;}
    .minical-day{min-height:38px;padding:2px 3px;}
    .minical-evt{font-size:0;width:6px;height:6px;padding:0;border-radius:50%;display:inline-block;margin:2px 2px 0 0;}
    .minical-evt-more{display:none;}
  }
</style>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8B1A3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub Bioflora">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>

let sideModoEdicao = false;
let sideOrdemPersonalizada = null;
let sideItemArrastadoHref = null;
let sideTemPermRef = null;
let sideUserIdRef = null;

function paginaAtualIndex(){ return (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '') + '.html'; }
try{ if(/\.html$/.test(location.pathname)) history.replaceState(null,'',location.pathname.replace(/index\.html$/,'').replace(/\.html$/,'')+location.search+location.hash); }catch(e){}

function sideModulosVisiveisOrdenados(){
  const visiveis = SIDE_MODULOS.filter(m => !m.perm || (sideTemPermRef && sideTemPermRef(m.perm)));
  if(!sideOrdemPersonalizada || !sideOrdemPersonalizada.length) return visiveis;
  const porHref = {};
  visiveis.forEach(m => { porHref[m.href] = m; });
  const ordenados = [];
  sideOrdemPersonalizada.forEach(href => { if(porHref[href]){ ordenados.push(porHref[href]); delete porHref[href]; } });
  Object.values(porHref).forEach(m => ordenados.push(m));
  return ordenados;
}

function montarSideBotao(m){
  const atual = paginaAtualIndex() === m.href;
  const btn = document.createElement('a');
  btn.href = m.href;
  btn.className = 'side-btn' + (atual ? ' active' : '');
  btn.innerHTML = `${sideSvg(m.icone)}<span class="tooltip">${m.label}</span>${sideModoEdicao ? sideSvg('arrastar') : ''}`;
  return btn;
}

function renderSideNav(){
  const nav = document.getElementById('sideNav');
  const lista = sideModulosVisiveisOrdenados();
  nav.innerHTML = '';
  lista.forEach(m => {
    const btn = montarSideBotao(m);
    if(sideModoEdicao){
      btn.draggable = true;
      btn.classList.add('side-arrastavel');
      btn.addEventListener('click', (e)=> e.preventDefault());
      btn.addEventListener('dragstart', ()=>{ sideItemArrastadoHref = m.href; btn.classList.add('side-arrastando'); });
      btn.addEventListener('dragend', ()=> btn.classList.remove('side-arrastando'));
      btn.addEventListener('dragover', (e)=>{ e.preventDefault(); btn.classList.add('side-drag-over'); });
      btn.addEventListener('dragleave', ()=> btn.classList.remove('side-drag-over'));
      btn.addEventListener('drop', (e)=>{
        e.preventDefault();
        btn.classList.remove('side-drag-over');
        if(!sideItemArrastadoHref || sideItemArrastadoHref === m.href) return;
        const atualOrdem = lista.map(x=>x.href);
        const doIdx = atualOrdem.indexOf(sideItemArrastadoHref);
        const paraIdx = atualOrdem.indexOf(m.href);
        atualOrdem.splice(doIdx,1);
        atualOrdem.splice(paraIdx,0,sideItemArrastadoHref);
        sideOrdemPersonalizada = atualOrdem;
        renderSideNav();
        salvarOrdemSidebarIndex(atualOrdem);
      });
    }
    nav.appendChild(btn);
  });
}

async function salvarOrdemSidebarIndex(ordem){
  if(!sideUserIdRef) return;
  try{
    await supa.from('preferencias_hub').upsert(
      { user_id: sideUserIdRef, sidebar_ordem: ordem, atualizado_em: new Date().toISOString() },
      { onConflict: 'user_id' }
    );
  }catch(e){ /* silencioso */ }
}

function toggleSideModoEdicao(){
  sideModoEdicao = !sideModoEdicao;

// AVISOS EM POP-UP — chefia cria um aviso direcionado a um ou mais
// cargos (ou todo mundo); aparece assim que a pessoa abre o Hub, uma
// única vez (marca "visualizado" ao fechar).
// ============================================================
async function checkAvisosPopup(papel, userId){
  const { data: avisos } = await supa.from('avisos_popup').select('*').eq('ativo', true).order('criado_em', {ascending:false});
  if(!avisos || !avisos.length) return;

  const paraMim = avisos.filter(a => !a.papeis_alvo.length || a.papeis_alvo.includes(papel));
  if(!paraMim.length) return;

  const { data: vistos } = await supa.from('avisos_popup_visualizacoes').select('aviso_id').eq('usuario_id', userId);
  const idsVistos = new Set((vistos||[]).map(v=>v.aviso_id));
  const naoVistos = paraMim.filter(a => !idsVistos.has(a.id));
  if(!naoVistos.length) return;

  mostrarPopupAviso(naoVistos, 0, userId);
}

function mostrarPopupAviso(fila, indice, userId){
  if(indice >= fila.length) return;
  const aviso = fila[indice];
  const ehEnquete = aviso.tipo === 'enquete' && aviso.opcoes_enquete && aviso.opcoes_enquete.length;

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(42,34,36,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:28px;max-width:420px;width:100%;">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--burgundy);margin-bottom:8px;">${ehEnquete ? '🗳️ Enquete' : '📢 Aviso'}</div>
      <h2 style="font-family:var(--headfont);font-size:19px;margin:0 0 10px;">${aviso.titulo}</h2>
      <p style="font-size:13.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;margin:0 0 22px;">${aviso.mensagem.replace(/</g,'&lt;')}</p>
      ${ehEnquete
        ? `<div style="display:flex;flex-direction:column;gap:8px;">
            ${aviso.opcoes_enquete.map(op => `<button class="opcaoEnqueteBtn" data-opcao="${op.replace(/"/g,'&quot;')}" style="width:100%;font-family:'Maven Pro',sans-serif;font-size:13.5px;font-weight:600;padding:10px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-align:left;">${op}</button>`).join('')}
          </div>`
        : `<button id="fecharAvisoBtn" style="width:100%;font-family:'Maven Pro',sans-serif;font-size:14px;font-weight:600;padding:11px;border-radius:8px;border:none;cursor:pointer;background:var(--burgundy);color:#fff;">👍 Confirmar leitura</button>`
      }
    </div>`;
  document.body.appendChild(overlay);

  async function avancar(){
    document.body.removeChild(overlay);
    mostrarPopupAviso(fila, indice+1, userId);
  }

  if(ehEnquete){
    overlay.querySelectorAll('.opcaoEnqueteBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        await supa.from('avisos_popup_votos').upsert({ aviso_id: aviso.id, usuario_id: userId, opcao: btn.dataset.opcao });
        await supa.from('avisos_popup_visualizacoes').upsert({ aviso_id: aviso.id, usuario_id: userId });
        avancar();
      });
    });
  } else {
    overlay.querySelector('#fecharAvisoBtn').addEventListener('click', async () => {
      await supa.from('avisos_popup_visualizacoes').upsert({ aviso_id: aviso.id, usuario_id: userId });
      avancar();
    });
  }

// MINI CALENDÁRIO INTERNO — prévia em grade do mês atual na home,
// lê eventos_internos (a RLS já filtra por cargo/pessoa). Só leitura,
// clique no card leva pra calendario-interno.html.
// ============================================================
async function renderMiniCalendarioInterno(){
  const el = document.getElementById('minicalArea');
  const hoje = new Date();
  const inicioMes = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().slice(0,10);
  const fimMes = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).toISOString().slice(0,10);
  const label = hoje.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

  const { data: eventos } = await supa.from('eventos_internos').select('*').gte('data_inicio', inicioMes).lte('data_inicio', fimMes);

  const porDia = {};
  (eventos||[]).forEach(ev => { (porDia[ev.data_inicio] ||= []).push(ev); });

  const ano = hoje.getFullYear(), mes = hoje.getMonth();
  const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
  const totalDias = new Date(ano, mes + 1, 0).getDate();
  const hojeKey = localDateStr(hoje);

  let grid = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d => `<div class="minical-weekday">${d}</div>`).join('');
  for(let i=0; i<primeiroDiaSemana; i++) grid += `<div class="minical-day empty"></div>`;
  for(let dia=1; dia<=totalDias; dia++){
    const key = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const doDia = porDia[key] || [];
    const visiveis = doDia.slice(0,2);
    grid += `<div class="minical-day ${key===hojeKey?'today':''}">
      <div class="minical-day-num">${dia}</div>
      ${visiveis.map(ev => `<div class="minical-evt">${(ev.titulo||'(sem título)').replace(/</g,'&lt;')}</div>`).join('')}
      ${doDia.length > 2 ? `<div class="minical-evt-more">+${doDia.length - 2}</div>` : ''}
    </div>`;
  }

  el.innerHTML = `
    <div class="minical-head"><h3>${label}</h3><span>Abrir calendário completo →</span></div>
    <div class="minical-grid">${grid}</div>`;
}

const fmtMinHome = (min) => { const h = Math.floor(min/60), m = Math.round(min%60); return h > 0 ? `${h}h${m>0?' '+m+'min':''}` : `${Math.round(min)}min`; };

function semanaSegASab(){
  const d = new Date(), dow = d.getDay();
  const seg = new Date(d); seg.setDate(d.getDate() - ((dow + 6) % 7));
  return [0,1,2,3,4,5].map(i => { const x = new Date(seg); x.setDate(seg.getDate()+i); return localDateStr(x); });
}

// Minutos disponíveis por dia nas Fórmulas Complexas: dia específico > dia da semana > 480
async function fcDisponivelPorDia(datas){
  const [{ data: esp }, { data: sem }] = await Promise.all([
    supa.from('formulas_complexas_tempo_diario').select('data,minutos_disponiveis').in('data', datas),
    supa.from('formulas_complexas_limite_semanal').select('dia_semana,minutos_disponiveis'),
  ]);
  const espM = {}; (esp||[]).forEach(r => { espM[r.data] = r.minutos_disponiveis; });
  const semM = {}; (sem||[]).forEach(r => { semM[r.dia_semana] = r.minutos_disponiveis; });
  const out = {};
  datas.forEach(d => { const dow = new Date(d+'T12:00:00').getDay(); out[d] = espM[d] != null ? espM[d] : (semM[dow] != null ? semM[dow] : 480); });
  return out;
}

async function contar(tabela, filtros){
  let q = supa.from(tabela).select('id', { count:'exact', head:true });
  (filtros||[]).forEach(f => { q = q[f[0]](...f.slice(1)); });
  const { count } = await q;
  return count || 0;
}

let periodoIncHome = 'dia';
let nomeIncHomeAtual = null;
function localDateStrHomeInc(d){ const off=d.getTimezoneOffset(); return new Date(d.getTime()-off*60000).toISOString().slice(0,10); }

function limitesPeriodoIncHome(){
  const hoje = new Date();
  if(periodoIncHome === 'dia'){
    const s = localDateStrHomeInc(hoje);
    return { inicio: s, fim: s };
  }
  if(periodoIncHome === 'semana'){
    const diaSemana = hoje.getDay();
    const inicioSemana = new Date(hoje); inicioSemana.setDate(hoje.getDate()-diaSemana);
    const fimSemana = new Date(inicioSemana); fimSemana.setDate(inicioSemana.getDate()+6);
    return { inicio: localDateStrHomeInc(inicioSemana), fim: localDateStrHomeInc(fimSemana) };
  }
  const ano = hoje.getFullYear(), mes = hoje.getMonth();
  return { inicio: localDateStrHomeInc(new Date(ano,mes,1)), fim: localDateStrHomeInc(new Date(ano,mes+1,0)) };
}

async function mudarPeriodoIncHome(periodo){
  periodoIncHome = periodo;
  document.getElementById('homeIncPDia').classList.toggle('active', periodo==='dia');
  document.getElementById('homeIncPSemana').classList.toggle('active', periodo==='semana');
  document.getElementById('homeIncPMes').classList.toggle('active', periodo==='mes');
  await ligarWidgetMinhasInclusoes(nomeIncHomeAtual);
}

async function ligarWidgetMinhasInclusoes(nome){
  if(!nome) return;
  nomeIncHomeAtual = nome;
  const { inicio, fim } = limitesPeriodoIncHome();
  const [{ data: inclusoes }, { data: erros }] = await Promise.all([
    supa.from('inclusoes_diarias').select('quantidade').eq('atendente', nome).gte('data', inicio).lte('data', fim),
    supa.from('erros_registrados').select('id').eq('atendente', nome).gte('registrado_em', inicio+'T00:00:00').lte('registrado_em', fim+'T23:59:59'),
  ]);
  const totalInclusoes = (inclusoes||[]).reduce((s,i)=>s+i.quantidade,0);
  const totalErros = (erros||[]).length;
  const pct = totalInclusoes > 0 ? (totalErros/totalInclusoes*100) : (totalErros>0 ? 100 : 0);
  const cor = pct<=2 ? '#3F7A57' : pct<=5 ? '#C9922B' : '#B4472F';

  const elTotal = document.getElementById('homeIncTotal');
  const elErros = document.getElementById('homeIncErros');
  const elPct = document.getElementById('homeIncPct');
  if(!elTotal) return; // widget pode ter sido trocado de tela
  elTotal.textContent = totalInclusoes;
  elErros.textContent = totalErros;
  elPct.textContent = pct.toFixed(1)+'%';
  elPct.style.color = cor;
}
window.ligarWidgetMinhasInclusoes = ligarWidgetMinhasInclusoes;

function situacaoValidadeHome(validade){
  if(!validade) return { cls:'good', label:'Sem validade' };
  const hoje = new Date(localDateStr(new Date()));
  const dataVal = new Date(validade+'T00:00:00');
  const diffDias = Math.round((dataVal - hoje) / 86400000);
  if(diffDias < 0) return { cls:'bad', label:'Vencido' };
  if(diffDias <= 5) return { cls:'warn', label:`Vence em ${diffDias}d` };
  return { cls:'good', label:`Vence em ${diffDias}d` };
}

  const [limitesHoje, { data: registros }] = await Promise.all([
    fcDisponivelPorDia([hojeStr]),
    supa.from('formulas_complexas_registro').select('quantidade,requisicao,status,minutos_calculados,formulas_complexas_catalogo(nome)').eq('data', hojeStr).in('status', ['aprovado','pendente']).order('minutos_calculados', {ascending:false})
  ]);
  const disponivel = limitesHoje[hojeStr];
  const lista = registros || [];
  const usados = lista.reduce((s,r)=>s+(r.minutos_calculados||0), 0);
  const pct = disponivel ? Math.min(100, Math.round((usados/disponivel)*100)) : 100;
  const formatarMin = (min) => { const h=Math.floor(min/60), m=Math.round(min%60); return h>0 ? `${h}h${m>0?' '+m+'min':''}` : `${Math.round(min)}min`; };

  return `<div class="card w8">
    <div class="card-head"><h2>Fórmulas Complexas hoje</h2><span class="card-icon">🧩</span></div>
    <p class="card-sub">${formatarMin(usados)} usados de ${formatarMin(disponivel)} — <a href="formulas-complexas.html">ver calendário completo</a></p>
    <div style="height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px;">
      <div style="height:100%;width:${pct}%;background:${pct>=100?'var(--bad)':'var(--good)'};border-radius:99px;"></div>
    </div>
    <div>
      ${lista.length ? lista.slice(0,5).map(r => `<div class="mini-list-row">
        <span class="name">${r.formulas_complexas_catalogo?.nome || '—'} — req. ${r.requisicao || '—'}</span>
        <span class="badge ${r.status==='pendente'?'bad':'good'}">${r.status==='pendente'?'pendente':formatarMin(r.minutos_calculados)}</span>
      </div>`).join('') : `<div class="mini-list-row"><span class="name" style="color:var(--gray);">Nenhuma requisição pra hoje ainda.</span></div>`}
    </div>
  </div>`;
}

  const [{ data: posts }, { data: stories }] = await Promise.all([
    supa.from('calendario_posts').select('*').eq('data', hojeStr),
    supa.from('calendario_stories').select('*').eq('data', hojeStr),
  ]);

  if(!(posts||[]).length && !(stories||[]).length) return '';

  return `<div class="card w12">
    <div class="card-head"><h2>Hoje no conteúdo</h2><span class="card-icon">📅</span></div>
    <p class="card-sub">O que grava, fala e posta hoje — <a href="calendario-editorial.html">ver calendário completo</a></p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">

        ${(posts||[]).map(p => `

            <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--info);margin-bottom:4px;">📸 Post${p.pilar_editorial ? ' — '+p.pilar_editorial : ''}</div>
            ${p.ideia_pauta ? `<div style="font-size:13px;font-weight:600;margin-bottom:3px;">${p.ideia_pauta}</div>` : ''}
            ${p.formato ? `<div style="font-size:11.5px;color:var(--gray);">${p.formato}</div>` : ''}
          </div>
        `).join('') || '<div style="font-size:12.5px;color:var(--gray);">Nenhum post planejado pra hoje.</div>'}
      </div>
      <div>
        ${(stories||[]).map(s => `
          <div style="background:var(--paper);border-radius:12px;padding:14px 16px;margin-bottom:10px;">
            <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--good);margin-bottom:4px;">💬 Stories</div>
            ${s.produto_pressao ? `<div style="font-size:13px;font-weight:600;margin-bottom:3px;">${s.produto_pressao}</div>` : ''}
            ${s.oferta_cta ? `<div style="font-size:11.5px;color:var(--gray);">CTA: ${s.oferta_cta}</div>` : ''}
          </div>

      </div>
    </div>
  </div>`;
}

async function widgetReaproveitamento(){
  const { data } = await supa.from('manipulados_nao_retirados')
    .select('requisicao,forma_farmaceutica,validade,manipulados_ativos(concentracao,ativos_cadastrados(codigo))')
    .eq('status','disponivel')
    .order('validade', {ascending:true, nullsFirst:false})
    .limit(6);

  const linhas = (data && data.length) ? data.map(m => {
    const sit = situacaoValidadeHome(m.validade);
    const ativosTxt = (m.manipulados_ativos||[]).map(a => `${a.ativos_cadastrados?.codigo}:${a.concentracao}`).join(' + ');
    return `<div class="mini-list-row">
      <span class="name">${m.requisicao} <span style="font-weight:400;color:var(--gray)">— ${m.forma_farmaceutica||'—'} (${ativosTxt||'sem ativos'})</span></span>
      <span class="badge ${sit.cls}">${sit.label}</span>
    </div>`;
  }).join('') : `<div class="empty-mini">Nenhum manipulado disponível pra reaproveitar agora.</div>`;

  return `<div class="card w8">
    <div class="card-head"><h2>Disponíveis para Reaproveitamento</h2><span class="card-icon">♻️</span></div>
    <p class="card-sub">Manipulados não retirados prontos pra usar em vez de manipular de novo</p>
    <div class="mini-list">${linhas}</div>
  </div>`;
}

async function widgetRotulos(){
  const { data } = await supa.from('rotulos_kanban').select('status');

  (data||[]).forEach(r => { if(counts[r.status]!==undefined) counts[r.status]++; });

    <div class="mini-list">

      <div class="mini-list-row"><span class="name">Pedido</span><span class="badge warn">${counts.pedido}</span></div>
      <div class="mini-list-row"><span class="name">Chegou</span><span class="badge good">${counts.chegou}</span></div>
    </div></div>`;
}

async function widgetOrdens(){
  const { data } = await supa.from('ordens_producao').select('status');
  const counts = { em_falta:0, ordem_criada:0, em_manipulacao:0, liberado:0 };
  (data||[]).forEach(r => { if(counts[r.status]!==undefined) counts[r.status]++; });
  return `<div class="card w4"><div class="card-head"><h2>Ordens de Produção</h2><span class="card-icon">🧪</span></div><p class="card-sub">Situação atual</p>
    <div class="mini-list">
      <div class="mini-list-row"><span class="name">Em falta</span><span class="badge bad">${counts.em_falta}</span></div>

function fmtMinIdx(m){
  const sign = m<0?'-':'+';
  const abs = Math.abs(m);
  const h = Math.floor(abs/60), mm = abs%60;
  return sign+String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}

async function widgetBancoHoras(){
  const { data: ultimoPeriodo } = await supa.from('folhas_ponto').select('periodo_inicio').order('periodo_inicio',{ascending:false}).limit(1);

  // Aviso de prazo: se o mês corrente já passou do dia 5 e ninguém
  // subiu a folha do mês anterior ainda, mostra alerta em vez do resumo.
  const hoje = new Date();
  const inicioMesAtual = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const diaDoMes = hoje.getDate();
  const periodoEsperado = new Date(hoje.getFullYear(), hoje.getMonth()-1, 1).toISOString().slice(0,10);
  const emAtraso = diaDoMes > 5 && (!ultimoPeriodo || !ultimoPeriodo.length || ultimoPeriodo[0].periodo_inicio < periodoEsperado);

  if(!ultimoPeriodo || !ultimoPeriodo.length){
    return `<div class="card w4"><div class="card-head"><h2>Banco de Horas</h2><span class="card-icon">⏱️</span></div>
      <div class="card-alert">⚠️ Nenhum período enviado ainda. Suba a planilha do mês em Banco de Horas.</div></div>`;
  }

  const periodo = ultimoPeriodo[0].periodo_inicio;
  const { data: folhas } = await supa.from('folhas_ponto').select('saldo_final_min, funcionarios(nome)').eq('periodo_inicio', periodo);
  const lista = (folhas||[]).map(f => ({ nome: f.funcionarios?.nome || '—', saldo: f.saldo_final_min }));
  const negativos = lista.filter(f=>f.saldo<0).length;
  const total = lista.length;

  let devedor = null, credor = null;
  if(lista.length){
    devedor = lista.reduce((a,b)=> a.saldo < b.saldo ? a : b);
    credor = lista.reduce((a,b)=> a.saldo > b.saldo ? a : b);
  }

  return `<div class="card w4">
    <div class="card-head"><h2>Banco de Horas</h2><span class="card-icon">⏱️</span></div>
    <p class="card-sub">Período ${periodo}</p>
    ${emAtraso ? `<div class="card-alert">⚠️ A planilha do mês passado ainda não foi enviada.</div>` : ''}
    <div class="stat-big">${negativos}</div><div class="stat-delta ${negativos>0?'bad':'good'}">de ${total} com saldo negativo</div>
    ${devedor ? `<div class="mini-list" style="margin-top:12px">
      <div class="mini-list-row"><span class="name">🔻 Maior devedor: ${devedor.nome.split(' ').slice(0,2).join(' ')}</span><span class="badge bad">${fmtMinIdx(devedor.saldo)}</span></div>
      <div class="mini-list-row"><span class="name">🔺 Maior saldo: ${credor.nome.split(' ').slice(0,2).join(' ')}</span><span class="badge good">${fmtMinIdx(credor.saldo)}</span></div>
    </div>` : ''}
  </div>`;
}
