<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de RH — Hub Bioflora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="auth-guard.js"></script>
<style>
  :root{
    --burgundy:#8B1A3A; --burgundy-dark:#5E1027; --burgundy-tint:#F7E9EE;
    --ink:#2A2224; --paper:#FBF9F7; --line:#E7DFE0; --gray:#6E6266;
    --good:#3F7A57; --good-tint:#E8F3EC; --bad:#B4472F; --bad-tint:#FBEBE6;
    --warn:#C9922B; --warn-tint:#FBF1E0; --info:#3E6B93; --info-tint:#E9F0F6;
    --headfont: 'Space Grotesk', 'Maven Pro', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:'Maven Pro',sans-serif;-webkit-font-smoothing:antialiased;}
  .shell{display:flex;min-height:100vh;}

  .rh-nav{width:230px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:24px 16px;}
  .rh-nav-brand{font-family:var(--headfont);font-size:16px;font-weight:600;margin:0 0 2px;}
  .rh-nav-brand span{color:var(--burgundy);}
  .rh-nav-sub{font-size:11px;color:var(--gray);margin:0 0 22px;}
  .rh-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;color:var(--gray);margin-bottom:2px;}
  .rh-nav-item:hover{background:var(--paper);}
  .rh-nav-item.active{background:var(--burgundy);color:#fff;font-weight:600;}
  .rh-nav-group{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);margin:18px 0 6px 12px;}
  .rh-nav-foot{margin-top:24px;}
  .rh-nav-foot a{font-size:12px;color:var(--gray);text-decoration:none;}
  .rh-nav-foot a:hover{color:var(--burgundy);}

  .rh-main{flex:1;padding:32px 36px 60px;max-width:1300px;}

  .hero{background:linear-gradient(135deg,var(--burgundy),var(--burgundy-dark));border-radius:20px;padding:36px 40px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden;}
  .hero h1{font-family:var(--headfont);font-size:38px;font-weight:600;margin:0 0 8px;letter-spacing:-0.01em;}
  .hero p{font-size:14px;color:rgba(255,255,255,.85);margin:0 0 22px;max-width:440px;}
  .hero-stats{display:flex;gap:36px;}
  .hero-stats .n{font-family:var(--headfont);font-size:32px;font-weight:600;}
  .hero-stats .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.75);margin-top:2px;}

  .toolbar-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .search-box{flex:1;min-width:220px;max-width:340px;position:relative;}
  .search-box input{width:100%;font-family:'Maven Pro',sans-serif;font-size:13px;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:10px;background:#fff;}
  .search-box .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:13px;}
  .btn{font-family:'Maven Pro',sans-serif;font-size:13px;font-weight:600;padding:10px 18px;border-radius:9px;border:none;cursor:pointer;background:var(--burgundy);color:#fff;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn.dark{background:var(--ink);color:#fff;}

  .colab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .colab-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;}
  .colab-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .colab-avatar{width:48px;height:48px;border-radius:50%;background:var(--burgundy-tint);color:var(--burgundy);display:flex;align-items:center;justify-content:center;font-family:var(--headfont);font-weight:600;font-size:16px;}
  .colab-status{font-size:10px;font-weight:700;text-transform:uppercase;padding:4px 10px;border-radius:20px;}
  .colab-status.ativo{background:var(--good-tint);color:var(--good);}
  .colab-status.ferias{background:var(--info-tint);color:var(--info);}
  .colab-status.afastado{background:var(--warn-tint);color:#8A6512;}
  .colab-status.desligado{background:#F1ECEA;color:var(--gray);}
  .colab-nome{font-family:var(--headfont);font-size:16px;font-weight:600;margin:0;}
  .colab-cargo{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);margin:2px 0 12px;}
  .colab-detail{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);margin-bottom:6px;}
  .colab-detail .ico{color:var(--gray);width:14px;flex-shrink:0;}
  .colab-card-actions{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .colab-card-actions button{flex:1;font-family:'Maven Pro',sans-serif;font-size:11.5px;font-weight:600;padding:7px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--gray);}
  .colab-card-actions button.edit{color:var(--burgundy);}
  .colab-card-actions button.del{color:var(--bad);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--gray);grid-column:1/-1;}
  .empty-state .big{font-size:36px;margin-bottom:10px;}
  .placeholder-tab{text-align:center;padding:100px 20px;color:var(--gray);}
  .placeholder-tab .big{font-size:40px;margin-bottom:14px;}
  .placeholder-tab h2{font-family:var(--headfont);color:var(--ink);font-size:19px;margin:0 0 8px;}

  .modal-overlay{position:fixed !important;inset:0 !important;background:rgba(0,0,0,.4);display:none;align-items:center !important;justify-content:center !important;z-index:999 !important;padding:20px;margin:0 !important;width:100vw !important;height:100vh !important;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:26px;max-width:480px;width:100%;max-height:88vh;overflow:auto;}
  .modal h3{font-family:var(--headfont);margin:0 0 16px;font-size:17px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .form-grid label{font-size:11px;color:var(--gray);font-weight:600;display:block;margin-bottom:4px;}
  .form-grid input, .form-grid select, .form-grid textarea{width:100%;font-family:'Maven Pro',sans-serif;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;}
  .form-grid textarea{resize:vertical;min-height:60px;font-family:inherit;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}

  /* Ponto */
  .config-banner{background:var(--warn-tint);border:1px solid #EBD8A6;border-radius:10px;padding:14px 18px;font-size:13px;color:#7A5C15;margin-bottom:22px;display:none;}
  .config-banner.show{display:block;}
  .upload-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px;}
  .upload-panel h2{font-family:var(--headfont);font-weight:600;font-size:16px;margin:0 0 6px;}
  .upload-panel .desc{font-size:12.5px;color:var(--gray);margin:0 0 16px;}
  .upload-zone{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:.15s;}
  .upload-zone:hover, .upload-zone.drag{border-color:var(--burgundy);background:var(--burgundy-tint);}
  .upload-zone input{display:none;}
  .upload-zone .icon{font-size:28px;margin-bottom:8px;}
  .upload-zone .label{font-size:13.5px;font-weight:600;}
  .upload-zone .sub{font-size:12px;color:var(--gray);margin-top:4px;}
  .period-row{display:flex;gap:12px;margin-top:16px;align-items:center;flex-wrap:wrap;}
  .period-row label{font-size:12.5px;color:var(--gray);}
  .period-row input[type=date]{font-family:'Maven Pro',sans-serif;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;}
  .status-msg{font-size:13px;margin-top:12px;padding:10px 14px;border-radius:8px;display:none;}
  .status-msg.show{display:block;}
  .status-msg.ok{background:var(--good-tint);color:var(--good);}
  .status-msg.err{background:var(--bad-tint);color:var(--bad);}
  .status-msg.info{background:#F1ECEA;color:var(--gray);}
  .ponto-kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;}
  .ponto-kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .ponto-kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray);font-weight:600;}
  .ponto-kpi .value{font-family:var(--headfont);font-weight:600;font-size:26px;margin-top:5px;}
  .ponto-kpi .sub{font-size:12px;color:var(--gray);margin-top:3px;}
  .ponto-kpi.accent{background:var(--burgundy);color:#fff;}
  .ponto-kpi.accent .label,.ponto-kpi.accent .sub{color:rgba(255,255,255,.75);}
  .panel-white{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;}
  .panel-white h2{font-family:var(--headfont);font-weight:600;font-size:16px;margin:0 0 4px;}
  .panel-white .desc{font-size:12.5px;color:var(--gray);margin:0 0 16px;}
  .period-select{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:14px;}
  .period-select select{font-family:'Maven Pro',sans-serif;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;}
  .grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
  .bar-name{width:150px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:16px;background:#F1ECEA;border-radius:4px;position:relative;overflow:hidden;}
  .bar-fill{position:absolute;top:0;bottom:0;border-radius:4px;}
  .bar-fill.pos{background:var(--good);left:50%;} .bar-fill.neg{background:var(--bad);right:50%;}
  .bar-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line);}
  .bar-val{width:56px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0;}
  .bar-val.pos{color:var(--good);} .bar-val.neg{color:var(--bad);}
  .ponto-table{width:100%;border-collapse:collapse;font-size:12.8px;}
  .ponto-table thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);font-weight:600;padding:0 8px 10px;border-bottom:1px solid var(--ink);}
  .ponto-table tbody td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .emp-name{font-weight:600;} .emp-cargo{font-size:11px;color:var(--gray);display:block;margin-top:1px;}
  .tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;text-transform:uppercase;}
  .tag.good{background:var(--good-tint);color:var(--good);}
  .tag.bad{background:var(--bad-tint);color:var(--bad);}
  .tag.neutral{background:#F1ECEA;color:var(--gray);}
  .num{font-variant-numeric:tabular-nums;text-align:right;}
  .num.pos{color:var(--good);} .num.neg{color:var(--bad);}
  th.num, td.num{text-align:right;}

  /* Férias */
  .ferias-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  .ferias-hero{background:linear-gradient(135deg,var(--burgundy),var(--burgundy-dark));border-radius:18px;padding:26px 28px;color:#fff;}
  .ferias-hero h2{font-family:var(--headfont);font-size:19px;margin:0 0 4px;}
  .ferias-hero p{font-size:12.5px;color:rgba(255,255,255,.85);margin:0;}
  .ferias-form label{font-size:11px;color:var(--gray);font-weight:600;display:block;margin-bottom:4px;}
  .ferias-form input, .ferias-form textarea{width:100%;font-family:'Maven Pro',sans-serif;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;margin-bottom:10px;}
  .ferias-form textarea{resize:vertical;min-height:56px;font-family:inherit;}
  .aviso-conflito{font-size:12px;background:var(--warn-tint);color:#8A6512;border-radius:8px;padding:9px 12px;margin-bottom:10px;}
  .solic-item{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);gap:10px;}
  .solic-item:last-child{border-bottom:none;}
  .solic-nome{font-weight:600;font-size:13px;}
  .solic-datas{font-size:11.5px;color:var(--gray);margin-top:2px;}
  .solic-status{font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .solic-status.pendente{background:var(--warn-tint);color:#8A6512;}
  .solic-status.aprovada{background:var(--good-tint);color:var(--good);}
  .solic-status.rejeitada{background:var(--bad-tint);color:var(--bad);}
  .solic-status.cancelada{background:#F1ECEA;color:var(--gray);}
  .solic-actions{display:flex;gap:6px;margin-top:6px;}
  .solic-actions button{font-family:'Maven Pro',sans-serif;font-size:10.5px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;}
  .solic-actions button.aprovar{color:var(--good);border-color:var(--good-tint);}
  .solic-actions button.rejeitar{color:var(--bad);border-color:var(--bad-tint);}
  .pendentes-badge{background:var(--warn);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;}

  .cal-ferias-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-ferias-weekday{text-align:center;font-size:9.5px;font-weight:700;color:var(--gray);text-transform:uppercase;padding:2px 0 6px;}
  .cal-ferias-day{min-height:64px;border:1px solid var(--line);border-radius:7px;padding:4px 5px;background:#fff;font-size:10px;}
  .cal-ferias-day.empty{visibility:hidden;}
  .cal-ferias-day.feriado{background:var(--bad-tint);border-color:#E8C4B8;}
  .cal-ferias-day.hoje{border-color:var(--burgundy);border-width:1.5px;}
  .cal-ferias-day-num{font-weight:700;color:var(--gray);}
  .cal-ferias-day.feriado .cal-ferias-day-num{color:var(--bad);}
  .cal-ferias-chip{background:var(--info);color:#fff;border-radius:3px;padding:1px 4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-ferias-nav{display:flex;gap:6px;align-items:center;}
  .cal-ferias-nav button{font-family:'Maven Pro',sans-serif;font-size:11.5px;padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;}

  /* Avaliações */
  .aval-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}

  /* Histórico estilo "status uptime" */
  .status-row{display:grid;grid-template-columns:170px 1fr 90px;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);}
  .status-row:last-child{border-bottom:none;}
  .status-row-nome{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .status-bars{display:flex;gap:2px;align-items:flex-end;height:26px;}
  .status-bar{flex:1;min-width:3px;max-width:9px;height:100%;border-radius:2px;cursor:default;background:#E7DFE0;}
  .status-bar.good{background:var(--good);}
  .status-bar.medio{background:var(--warn);}
  .status-bar.ruim{background:var(--bad);}
  .status-row-media{font-size:12px;font-weight:700;text-align:right;}
  .status-row-media.good{color:var(--good);}
  .status-row-media.medio{color:#8A6512;}
  .status-row-media.ruim{color:var(--bad);}
  .status-legenda{display:flex;gap:16px;font-size:11px;color:var(--gray);margin-top:14px;}
  .status-legenda span{display:inline-flex;align-items:center;gap:5px;}
  .status-legenda i{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .aval-filtro-btn{font-family:'Maven Pro',sans-serif;font-size:12px;font-weight:600;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--gray);}
  .aval-filtro-btn.active{background:var(--burgundy);color:#fff;border-color:var(--burgundy);}
  .aval-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .aval-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;}
  .aval-tipo-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:20px;}
  .aval-tipo-tag.avaliacao{background:var(--info-tint);color:var(--info);}
  .aval-tipo-tag.ocorrencia{background:var(--warn-tint);color:#8A6512;}
  .aval-tipo-tag.advertencia{background:var(--bad-tint);color:var(--bad);}
  .aval-tipo-tag.rnc{background:#F1ECEA;color:var(--gray);}
  .aval-tipo-tag.meta{background:var(--good-tint);color:var(--good);}
  .aval-nome{font-family:var(--headfont);font-size:15px;font-weight:600;margin:10px 0 2px;}
  .aval-sub{font-size:11px;color:var(--gray);margin-bottom:10px;}
  .aval-notas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--paper);border-radius:8px;padding:10px;margin-bottom:10px;}
  .aval-notas div{text-align:center;}
  .aval-notas .n{font-family:var(--headfont);font-size:16px;font-weight:600;}
  .aval-notas .l{font-size:9px;color:var(--gray);text-transform:uppercase;}
  .aval-media-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--good-tint);color:var(--good);}
  .aval-desc{font-size:12px;color:var(--ink);margin-bottom:8px;line-height:1.5;}
  .aval-foot{font-size:10.5px;color:var(--gray);border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;}
  .aval-del{border:none;background:none;color:var(--bad);cursor:pointer;font-size:10.5px;}
  .estrelas{color:#E0A93D;}

  /* Relatórios */
  .rel-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
  .rel-kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:14px;}
  .rel-kpi .circ{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .rel-kpi .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);font-weight:600;}
  .rel-kpi .value{font-family:var(--headfont);font-weight:600;font-size:21px;}
  .rel-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
</style>
</head>
<body>
<div class="shell">

  <nav class="rh-nav">
    <h1 class="rh-nav-brand">Central de <span>RH</span></h1>
    <p class="rh-nav-sub">Farmácia Bioflora</p>

    <div class="rh-nav-item" data-tab="dashboard" onclick="trocarAba('dashboard')">🏠 Dashboard</div>

    <div class="rh-nav-group">Cadastro</div>
    <div class="rh-nav-item" data-tab="colaboradores" onclick="trocarAba('colaboradores')">👥 Colaboradores</div>

    <div class="rh-nav-group">Operacional</div>
    <div class="rh-nav-item" data-tab="ponto" onclick="trocarAba('ponto')">⏱️ Ponto</div>
    <div class="rh-nav-item" data-tab="ferias" onclick="trocarAba('ferias')">📅 Férias</div>

    <div class="rh-nav-group">Histórico</div>
    <div class="rh-nav-item" data-tab="avaliacoes" onclick="trocarAba('avaliacoes')">📊 Avaliações</div>
    <div class="rh-nav-item" data-tab="relatorios" onclick="trocarAba('relatorios')">📈 Relatórios</div>

    <div class="rh-nav-foot">
      <a href="index.html">← Voltar ao Hub</a>
    </div>
  </nav>

  <main class="rh-main" id="rhMain"></main>
</div>

<div class="modal-overlay" id="modalColab">
  <div class="modal">
    <h3 id="modalColabTitulo">Novo colaborador</h3>
    <div class="form-grid">
      <div style="grid-column:span 2"><label>Nome completo*</label><input id="cNome" placeholder="Nome completo" /></div>
      <div><label>Cargo</label><input id="cCargo" placeholder="Ex: Atendente" /></div>
      <div><label>Departamento</label><input id="cDepartamento" placeholder="Ex: Recepção" list="departamentosExistentes" /><datalist id="departamentosExistentes"></datalist></div>
      <div><label>E-mail pessoal</label><input id="cEmail" type="email" placeholder="email@exemplo.com" /></div>
      <div><label>Telefone</label><input id="cTelefone" placeholder="(35) 99999-9999" /></div>
      <div><label>Status</label><select id="cStatus">
        <option value="ativo" selected>Ativo</option>

let pontoCurrentWorkbook = null;

function toMin(t){
  if(!t || String(t).indexOf(':')===-1) return 0;
  const neg = String(t).startsWith('-');
  const s = String(t).replace('-','');
  const [h,m] = s.split(':');
  const v = parseInt(h)*60+parseInt(m);
  return neg ? -v : v;
}
function hmToMin(s){
  if(!s || String(s).indexOf(':')===-1) return null;
  const [h,m] = String(s).split(':');
  return parseInt(h)*60+parseInt(m);
}
function fmtMin(m){
  const sign = m<0?'-':'+';
  const abs = Math.abs(m);
  const h = Math.floor(abs/60), mm = abs%60;
  return sign+String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function titleCase(s){ return (s||'—').charAt(0)+(s||'—').slice(1).toLowerCase(); }

function parseWorkbookPonto(wb){
  const results = [];
  wb.SheetNames.forEach(sheetName => {
    const ws = wb.Sheets[sheetName];
    const get = (cell) => { const c = ws[cell]; return c ? c.v : undefined; };
    const nome = (get('B2')||'').toString().trim();
    if(!nome) return;
    const cargo = get('B3');
    const setor = get('B4') || null;
    const saldoInicial = get('B8');
    const ht = get('B45');
    const fa = get('B48');
    const totalTrabalhar = get('B50');
    const bh = get('B53');
    const saldoIniMin = toMin(saldoInicial);
    const bhMin = toMin(bh);

    const sched = {};
    for(let r=3;r<=8;r++){
      const wd = get('D'+r);
      const e1 = get('E'+r);
      if(wd && e1) sched[wd] = hmToMin(e1);
    }

    let diasComPonto=0, leve=0, grave=0;
    for(let r=13; r<=60; r++){
      const a = get('A'+r);
      if(a===undefined) break;
      const label = String(a).trim();
      const m = label.match(/- (\w+)$/);
      const wd = m ? m[1] : null;
      const ponto1 = get('B'+r);
      if(ponto1 && String(ponto1).indexOf(':')!==-1){
        diasComPonto++;
        const p1 = hmToMin(ponto1);
        const exp = sched[wd];
        if(exp!==undefined && p1!==null){
          const diff = p1-exp;
          if(diff>=1 && diff<=10) leve++;
          else if(diff>10) grave++;
        }
      }
    }

    results.push({
      nome, cargo, setor,
      saldo_inicial_min: saldoIniMin,
      variacao_mes_min: bhMin,
      saldo_final_min: saldoIniMin+bhMin,
      horas_trabalhadas_min: ht ? hmToMin(ht.toString().padStart(5,'0')) || parseInt(ht) : null,
      dias_com_ponto: diasComPonto,
      atrasos_leve: leve, atrasos_grave: grave,
      faltas_min: toMin(fa),
      ativo: totalTrabalhar !== '00:00'
    });
  });
  return results;
}

  const { data: ultimo } = await supa.from('folhas_ponto').select('periodo_inicio').order('periodo_inicio',{ascending:false}).limit(1);
  const emAtraso = diaDoMes > 5 && (!ultimo || !ultimo.length || ultimo[0].periodo_inicio < periodoEsperado);

  const banner = document.getElementById('prazoBanner');
  if(!banner) return;
  if(emAtraso){
    banner.textContent = `⚠️ A folha de ponto do mês passado ainda não foi enviada — o prazo (dia 5) já passou. Suba o xlsx abaixo assim que possível.`;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

async function loadDashboardPonto(){

    .from('folhas_ponto')
    .select('*, funcionarios(nome, cargo, setor)')
    .order('periodo_inicio', {ascending:true});
  if(error){ console.error(error); return; }
  const area = document.getElementById('dashboardArea');

  if(!folhas || !folhas.length){
    area.innerHTML = `<div class="panel-white empty-state"><div class="big">📊</div>Nenhum período enviado ainda.</div>`;
    return;
  }
  const periodos = [...new Set(folhas.map(f=>f.periodo_inicio))].sort();
  const byPeriodo = {};
  periodos.forEach(p => byPeriodo[p] = folhas.filter(f=>f.periodo_inicio===p).map(f => ({
    nome: f.funcionarios.nome, cargo: f.funcionarios.cargo, setor: f.funcionarios.setor,
    saldo_inicial_min: f.saldo_inicial_min, variacao_mes_min: f.variacao_mes_min,
    saldo_final_min: f.saldo_final_min, dias_com_ponto: f.dias_com_ponto,
    atrasos_leve: f.atrasos_leve, atrasos_grave: f.atrasos_grave, faltas_min: f.faltas_min
  })));
  renderDashboardPonto(periodos.map(p => ({periodo_inicio:p, registros:byPeriodo[p]})));
}

  const best = active.reduce((a,b)=> a.saldo_final_min > b.saldo_final_min ? a : b);

function renderPeriodContentPonto(active){
  const sorted = [...active].sort((a,b)=>a.saldo_final_min-b.saldo_final_min);
  const maxAbs = Math.max(...sorted.map(d=>Math.abs(d.saldo_final_min)), 1);
  document.getElementById('bars').innerHTML = sorted.map(d=>{
    const pct = Math.min(100, Math.abs(d.saldo_final_min)/maxAbs*50);
    const cls = d.saldo_final_min>=0?'pos':'neg';
    return `<div class="bar-row"><div class="bar-name" title="${d.nome}">${d.nome.split(' ').slice(0,2).join(' ')}</div>
      <div class="bar-track"><div class="bar-mid"></div><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
      <div class="bar-val ${cls}">${fmtMin(d.saldo_final_min)}</div></div>`;
  }).join('');

  const sectorMap = {};
  active.forEach(d=>{
    const s = d.setor || 'NÃO DEFINIDO';
    if(!sectorMap[s]) sectorMap[s]={count:0,total:0};
    sectorMap[s].count++; sectorMap[s].total+=d.saldo_final_min;
  });
  document.getElementById('sectors').innerHTML = Object.entries(sectorMap).sort((a,b)=>b[1].total-a[1].total).map(([name,v])=>{
    const cls = v.total>=0?'good':'bad';
    return `<div class="bar-row" style="justify-content:space-between"><div><strong>${titleCase(name)}</strong> <span style="color:var(--gray);font-size:12px">(${v.count})</span></div><div style="color:var(--${cls});font-weight:600">${fmtMin(v.total)}</div></div>`;
  }).join('');

  document.getElementById('tbodyPonto').innerHTML = sorted.map(d=>{
    let tagCls='good', tagLabel='Em dia';
    if(d.saldo_final_min < -600){ tagCls='bad'; tagLabel='Atenção'; }
    else if(d.saldo_final_min < 0){ tagCls='neutral'; tagLabel='Devedor leve'; }
    return `<tr>
      <td><span class="emp-name">${d.nome}</span><span class="emp-cargo">${d.cargo||''}</span></td>
      <td>${titleCase(d.setor)}</td>
      <td class="num ${d.saldo_final_min>=0?'pos':'neg'}"><strong>${fmtMin(d.saldo_final_min)}</strong></td>
      <td class="num">${d.dias_com_ponto||'—'}</td>
      <td class="num">${d.atrasos_leve||0} / ${d.atrasos_grave||0}</td>
      <td class="num">${d.faltas_min ? fmtMin(d.faltas_min) : '—'}</td>
      <td><span class="tag ${tagCls}">${tagLabel}</span></td>
    </tr>`;
  }).join('');
}

function iniciais(nome){
  return (nome||'?').split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();
}

let setoresCoresCache = {};

async function carregarColaboradores(){
  const { data, error } = await supa.from('colaboradores').select('*').order('nome_completo');
  if(error){ console.error(error); return; }
  todosColaboradores = data || [];

  const { data: cores } = await supa.from('setores_config').select('*');
  setoresCoresCache = {};
  (cores||[]).forEach(s => { setoresCoresCache[s.nome] = s.cor; });
}

function corDoSetor(nome){
  if(!nome) return 'var(--gray)';
  return setoresCoresCache[nome] || 'var(--burgundy)';
}

function renderColaboradores(termoBusca){
  const ativos = todosColaboradores.filter(c => c.status === 'ativo').length;
  const departamentos = new Set(todosColaboradores.map(c=>c.departamento).filter(Boolean)).size;
  const pendenciasEmail = todosColaboradores.filter(c => c.precisa_email_bioflora && c.email_bioflora_status === 'pendente').length;

  document.getElementById('rhMain').innerHTML = `
    <div class="hero">
      <h1>Talentos &<br>Cultura</h1>
      <p>Gerencie os colaboradores da sua organização com eficiência e estilo.</p>
      <div class="hero-stats">
        <div><div class="n">${ativos}</div><div class="l">Ativos</div></div>
        <div><div class="n">${departamentos}</div><div class="l">Departamentos</div></div>
        <div><div class="n">${todosColaboradores.length}</div><div class="l">Total</div></div>
      </div>
    </div>

    ${(pendenciasEmail > 0 && meuPapelRH === 'chefia') ? `<div style="background:var(--warn-tint);color:#8A6512;border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:16px;">📧 <strong>${pendenciasEmail}</strong> colaborador(es) esperando criação de e-mail @farmaciabioflora — dá uma olhada nos cards marcados abaixo.</div>` : ''}

    <div class="toolbar-row">
      <div class="search-box"><span class="ico">🔍</span><input id="buscaColab" placeholder="Buscar colaborador..." oninput="filtrarColaboradores(this.value)"></div>
      <div style="display:flex;gap:8px;">
        ${meuPapelRH === 'chefia' ? `<button class="btn secondary" onclick="abrirConfigSetores()">🎨 Cores dos setores</button>` : ''}
        <button class="btn dark" onclick="abrirModalColab()">+ Adicionar colaborador</button>
      </div>
    </div>

    <div class="colab-grid" id="colabGrid"></div>
  `;
  renderGridColaboradores(termoBusca ? filtrar(termoBusca) : todosColaboradores);

function filtrar(termo){
  const t = termo.trim().toLowerCase();
  if(!t) return todosColaboradores;
  return todosColaboradores.filter(c =>
    (c.nome_completo||'').toLowerCase().includes(t) ||
    (c.cargo||'').toLowerCase().includes(t) ||
    (c.departamento||'').toLowerCase().includes(t)
  );
}
function filtrarColaboradores(termo){ renderGridColaboradores(filtrar(termo)); }
window.filtrarColaboradores = filtrarColaboradores;

function renderGridColaboradores(lista){

function abrirModalColab(id){
  colabEmEdicaoId = id || null;
  const c = id ? todosColaboradores.find(x=>x.id===id) : null;
  document.getElementById('modalColabTitulo').textContent = c ? 'Editar colaborador' : 'Novo colaborador';
  document.getElementById('cNome').value = c?.nome_completo || '';
  document.getElementById('cCargo').value = c?.cargo || '';
  document.getElementById('cDepartamento').value = c?.departamento || '';
  document.getElementById('cEmail').value = c?.email || '';
  document.getElementById('cTelefone').value = c?.telefone || '';
  document.getElementById('cStatus').value = c?.status || 'ativo';
  document.getElementById('cAdmissao').value = c?.data_admissao || '';
  document.getElementById('cPis').value = c?.pis || '';
  document.getElementById('campoSalarioColab').style.display = meuPapelRH === 'chefia' ? 'block' : 'none';
  document.getElementById('cSalario').value = c?.salario || '';
  document.getElementById('cObs').value = c?.observacoes || '';
  document.getElementById('cPrecisaEmail').checked = c?.precisa_email_bioflora || false;
  document.getElementById('cStatusEmail').value = c?.email_bioflora_status === 'criado' ? 'criado' : 'pendente';
  toggleStatusEmailBioflora();

  const listaDeptos = [...new Set(todosColaboradores.map(x=>x.departamento).filter(Boolean))];
  document.getElementById('departamentosExistentes').innerHTML = listaDeptos.map(d=>`<option value="${d}">`).join('');

  const areaDocs = document.getElementById('areaDocumentosColab');
  if(id){
    areaDocs.style.display = 'block';
    carregarDocumentosColab(id);
  } else {
    areaDocs.style.display = 'none';
  }

  document.getElementById('modalColab').classList.add('show');
}
window.abrirModalColab = abrirModalColab;

function toggleStatusEmailBioflora(){
  document.getElementById('statusEmailBiofloraArea').style.display = document.getElementById('cPrecisaEmail').checked ? 'block' : 'none';
}
window.toggleStatusEmailBioflora = toggleStatusEmailBioflora;

function fecharModalColab(){
  document.getElementById('modalColab').classList.remove('show');
  colabEmEdicaoId = null;
}
window.fecharModalColab = fecharModalColab;

async function salvarColaborador(){
  const nome_completo = document.getElementById('cNome').value.trim();
  if(!nome_completo){ alert('Digite o nome completo.'); return; }

  const precisaEmail = document.getElementById('cPrecisaEmail').checked;

  const dados = {
    nome_completo,
    cargo: document.getElementById('cCargo').value.trim() || null,
    departamento: document.getElementById('cDepartamento').value.trim() || null,
    email: document.getElementById('cEmail').value.trim() || null,
    telefone: document.getElementById('cTelefone').value.trim() || null,
    status: document.getElementById('cStatus').value,
    data_admissao: document.getElementById('cAdmissao').value || null,
    pis: document.getElementById('cPis').value.trim() || null,
    ...(meuPapelRH === 'chefia' ? { salario: document.getElementById('cSalario').value || null } : {}),
    observacoes: document.getElementById('cObs').value.trim() || null,
    precisa_email_bioflora: precisaEmail,
    email_bioflora_status: precisaEmail ? document.getElementById('cStatusEmail').value : 'nao_solicitado',
  };

  if(colabEmEdicaoId){
    const { error } = await supa.from('colaboradores').update(dados).eq('id', colabEmEdicaoId);
    if(error){ alert('Erro ao salvar: '+error.message); return; }
  } else {
    const { data: { session } } = await supa.auth.getSession();
    const { error } = await supa.from('colaboradores').insert({ ...dados, criado_por: session.user.id });
    if(error){ alert('Erro ao criar: '+error.message); return; }
  }

  fecharModalColab();
  await carregarColaboradores();
  renderColaboradores();
}
window.salvarColaborador = salvarColaborador;

async function excluirColaborador(id){
  if(!confirm('Excluir este colaborador do cadastro? Não dá pra desfazer.')) return;
  const { error } = await supa.from('colaboradores').delete().eq('id', id);
  if(error){ alert('Erro: '+error.message); return; }
  await carregarColaboradores();
  renderColaboradores();
}
window.excluirColaborador = excluirColaborador;

const TIPO_DOC_LABEL = {foto:'Foto de perfil', identidade_cnh:'Identidade / CNH', carteira_trabalho:'Carteira de trabalho', outro:'Outro'};

async function carregarDocumentosColab(colaboradorId){
  const { data } = await supa.from('colaborador_documentos').select('*').eq('colaborador_id', colaboradorId).order('enviado_em', {ascending:false});
  const lista = document.getElementById('listaDocumentosColab');
  if(!data || !data.length){ lista.innerHTML = '<p style="font-size:11.5px;color:var(--gray);">Nenhum documento enviado ainda.</p>'; return; }

  lista.innerHTML = (await Promise.all(data.map(async d => {
    const { data: signed } = await supa.storage.from('colaboradores-docs').createSignedUrl(d.arquivo_url, 300);
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px;">
      <span>${TIPO_DOC_LABEL[d.tipo]||d.tipo} — ${d.nome_arquivo}</span>
      <span style="display:flex;gap:8px;">
        ${signed?.signedUrl ? `<a href="${signed.signedUrl}" target="_blank" style="color:var(--burgundy);text-decoration:none;font-weight:600;">Ver</a>` : ''}
        <button style="border:none;background:none;color:var(--bad);cursor:pointer;font-size:11px;" onclick="excluirDocumentoColab('${d.id}','${d.arquivo_url}')">Excluir</button>
      </span>
    </div>`;
  }))).join('');
}

async function enviarDocumentoColab(){
  if(!colabEmEdicaoId){ alert('Salve o colaborador primeiro.'); return; }
  const arquivo = document.getElementById('arquivoDocColab').files[0];
  if(!arquivo){ alert('Escolha um arquivo.'); return; }
  const tipo = document.getElementById('tipoDocColab').value;

  const caminho = `${colabEmEdicaoId}/${Date.now()}_${arquivo.name}`;
  const { error: erroUpload } = await supa.storage.from('colaboradores-docs').upload(caminho, arquivo);
  if(erroUpload){ alert('Erro ao enviar: '+erroUpload.message); return; }

  const { data: { session } } = await supa.auth.getSession();
  const { error } = await supa.from('colaborador_documentos').insert({
    colaborador_id: colabEmEdicaoId, tipo, nome_arquivo: arquivo.name, arquivo_url: caminho, enviado_por: session.user.id
  });
  if(error){ alert('Erro ao registrar: '+error.message); return; }

  document.getElementById('arquivoDocColab').value = '';
  await carregarDocumentosColab(colabEmEdicaoId);
}
window.enviarDocumentoColab = enviarDocumentoColab;

async function excluirDocumentoColab(docId, caminhoArquivo){
  if(!confirm('Excluir esse documento?')) return;
  await supa.storage.from('colaboradores-docs').remove([caminhoArquivo]);
  await supa.from('colaborador_documentos').delete().eq('id', docId);
  await carregarDocumentosColab(colabEmEdicaoId);
}
window.excluirDocumentoColab = excluirDocumentoColab;

function abrirConfigSetores(){
  const setores = [...new Set(todosColaboradores.map(c=>c.departamento).filter(Boolean))];
  if(!setores.length){ alert('Cadastre colaboradores com departamento preenchido primeiro.'); return; }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay show';
  overlay.id = 'overlaySetores';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Cor por setor</h3>
      <p class="desc" style="margin-bottom:14px;">Usada nos cards de colaborador e no calendário de férias.</p>
      ${setores.map(s => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);">
          <span style="font-size:13px;">${s}</span>
          <input type="color" value="${setoresCoresCache[s]||'#8B1A3A'}" id="cor_${s.replace(/[^a-zA-Z0-9]/g,'_')}" style="width:44px;height:30px;border:none;cursor:pointer;">
        </div>`).join('')}
      <div class="modal-actions">
        <button class="btn secondary" onclick="document.getElementById('overlaySetores').remove()">Cancelar</button>
        <button class="btn" onclick="salvarConfigSetores(${JSON.stringify(setores)})">Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}
window.abrirConfigSetores = abrirConfigSetores;

async function salvarConfigSetores(setores){
  for(const s of setores){
    const cor = document.getElementById('cor_'+s.replace(/[^a-zA-Z0-9]/g,'_')).value;
    await supa.from('setores_config').upsert({ nome: s, cor });
  }
  document.getElementById('overlaySetores').remove();
  await carregarColaboradores();
  renderColaboradores();
}
window.salvarConfigSetores = salvarConfigSetores;

async function carregarDadosFerias(){
  const { data: solic } = await supa.from('ferias_solicitacoes').select('*').order('criado_em', {ascending:false});
  feriasCache = solic || [];

  const { data: fer } = await supa.from('feriados').select('*').order('data');
  feriadosCache = fer || [];

  renderListaSolicitacoes();
  renderCalendarioFerias();
}

function diasEntre(inicio, fim){
  const d1 = new Date(inicio+'T00:00:00'), d2 = new Date(fim+'T00:00:00');
  return Math.round((d2-d1)/(1000*60*60*24)) + 1;
}

function atualizarCampoMotivoFerias(){
  const tipo = document.getElementById('fTipoFerias').value;
  const label = document.getElementById('labelMotivoFerias');
  if(tipo === 'ausencia'){
    label.textContent = 'Motivo (obrigatório para ausência)';
  } else {
    label.textContent = 'Motivo / observação (opcional)';
  }
}
window.atualizarCampoMotivoFerias = atualizarCampoMotivoFerias;

async function solicitarFerias(){
  const tipo = document.getElementById('fTipoFerias').value;
  const inicio = document.getElementById('fInicioFerias').value;
  const fim = document.getElementById('fFimFerias').value;
  const motivo = document.getElementById('fMotivoFerias').value.trim() || null;
  if(!inicio || !fim){ alert('Escolha as datas de início e fim.'); return; }
  if(fim < inicio){ alert('A data de fim não pode ser antes da data de início.'); return; }
  if(tipo === 'ausencia' && !motivo){ alert('Pra ausência, o motivo é obrigatório.'); return; }

  const { data: { session } } = await supa.auth.getSession();

  const campoNome = document.getElementById('fNomeFerias');
  let nome;
  if(campoNome){
    nome = campoNome.value.trim();
    if(!nome){ alert('Preencha o nome do colaborador.'); return; }
  } else {
    const { data: perfil } = await supa.from('perfis').select('nome_exibicao').eq('id', session.user.id).maybeSingle();
    nome = perfil?.nome_exibicao || session.user.email;
  }

  const { error } = await supa.from('ferias_solicitacoes').insert({
    solicitante_id: session.user.id,
    solicitante_nome: nome,
    tipo,
    data_inicio: inicio, data_fim: fim,
    dias_totais: diasEntre(inicio, fim),
    motivo
  });
  if(error){ alert('Erro ao enviar: '+error.message); return; }

  document.getElementById('fInicioFerias').value = '';
  document.getElementById('fFimFerias').value = '';
  document.getElementById('fMotivoFerias').value = '';
  document.getElementById('fTipoFerias').value = 'ferias';
  atualizarCampoMotivoFerias();
  const confirmEl = document.getElementById('confirmacaoFerias');
  if(confirmEl){
    confirmEl.innerHTML = `<div style="font-size:12.5px;background:var(--good-tint);color:var(--good);border-radius:8px;padding:9px 12px;margin-bottom:10px;">✅ Solicitação recebida! Você será avisado quando a chefia analisar.</div>`;
    setTimeout(()=>{ confirmEl.innerHTML=''; }, 6000);
  }
  await carregarDadosFerias();
}
window.solicitarFerias = solicitarFerias;

// Avisa (não bloqueia) se já tem gente com férias sobrepondo o período digitado
function conferirConflitoFerias(){
  const inicio = document.getElementById('fInicioFerias')?.value;
  const fim = document.getElementById('fFimFerias')?.value;
  const el = document.getElementById('avisoConflitoFerias');
  if(!el) return;
  if(!inicio || !fim){ el.innerHTML=''; return; }

  const sobrepondo = feriasCache.filter(s =>
    s.status !== 'rejeitada' && s.status !== 'cancelada' &&
    s.solicitante_id !== meuUserId &&
    s.data_inicio <= fim && s.data_fim >= inicio
  );
  el.innerHTML = sobrepondo.length
    ? `<div class="aviso-conflito">⚠️ Já tem ${sobrepondo.length} solicitação(ões) nesse período: ${sobrepondo.map(s=>s.solicitante_nome).join(', ')}.</div>`
    : '';
}

function renderListaSolicitacoes(){
  const souChefiaAprovador = PODE_APROVAR_FERIAS.includes(meuPapelRH);
  const lista = souChefiaAprovador ? feriasCache : feriasCache.filter(s => s.solicitante_id === meuUserId);

  if(souChefiaAprovador){
    const pendentes = feriasCache.filter(s=>s.status==='pendente').length;
    const badge = document.getElementById('badgePendentes');
    if(badge) badge.textContent = pendentes + ' pendente' + (pendentes===1?'':'s');
  }

  document.getElementById('listaSolicitacoes').innerHTML = lista.length ? lista.map(s => `
    <div class="solic-item">
      <div>
        <div class="solic-nome">${s.tipo==='ausencia'?'🩺 ':'🏖️ '}${s.solicitante_nome}${s.motivo ? ' — <span style="font-weight:400;color:var(--gray);">'+s.motivo+'</span>' : ''}</div>
        <div class="solic-datas">${s.tipo==='ausencia'?'Ausência':'Férias'} · ${fmtDataBR(s.data_inicio)} a ${fmtDataBR(s.data_fim)} (${s.dias_totais} dia${s.dias_totais===1?'':'s'})</div>
        ${s.status==='rejeitada' && s.motivo_rejeicao ? `<div class="solic-datas" style="color:var(--bad)">Motivo: ${s.motivo_rejeicao}</div>` : ''}
        ${(souChefiaAprovador && s.status==='pendente') ? `<div class="solic-actions">
          <button class="aprovar" onclick="aprovarFerias('${s.id}')">Aprovar</button>
          <button class="rejeitar" onclick="rejeitarFerias('${s.id}')">Rejeitar</button>
        </div>` : ''}
        ${(souChefiaAprovador && s.status==='aprovada') ? `<div class="solic-actions">
          <button class="rejeitar" onclick="rejeitarFerias('${s.id}')">Reprovar</button>
          <button class="rejeitar" onclick="excluirFerias('${s.id}')">Excluir</button>
        </div>` : ''}
        ${(!souChefiaAprovador && s.status==='pendente' && s.solicitante_id===meuUserId) ? `<div class="solic-actions">
          <button class="rejeitar" onclick="cancelarFerias('${s.id}')">Cancelar pedido</button>
        </div>` : ''}
      </div>
      <span class="solic-status ${s.status}">${{pendente:'Pendente',aprovada:'Aprovada',rejeitada:'Rejeitada',cancelada:'Cancelada'}[s.status]}</span>
    </div>
  `).join('') : '<p style="font-size:12.5px;color:var(--gray);text-align:center;padding:20px 0;">Tudo limpo! Nenhuma solicitação.</p>';

  renderListaAprovadas();
  conferirConflitoFerias();
}

function renderListaAprovadas(){
  const el = document.getElementById('listaAprovadas');
  if(!el) return;
  const hojeStr = new Date().toISOString().slice(0,10);
  const aprovadas = feriasCache.filter(s => s.status === 'aprovada').sort((a,b) => a.data_inicio.localeCompare(b.data_inicio));

  el.innerHTML = aprovadas.length ? aprovadas.map(s => {
    const emCurso = s.data_inicio <= hojeStr && s.data_fim >= hojeStr;
    return `
    <div class="solic-item">
      <div>
        <div class="solic-nome">${s.tipo==='ausencia'?'🩺 ':'🏖️ '}${s.solicitante_nome}</div>
        <div class="solic-datas">${s.tipo==='ausencia'?'Ausência':'Férias'} · ${fmtDataBR(s.data_inicio)} a ${fmtDataBR(s.data_fim)} (${s.dias_totais} dia${s.dias_totais===1?'':'s'})</div>
      </div>
      <span class="solic-status ${emCurso?'pendente':'aprovada'}">${emCurso?'Em curso':'Aprovada'}</span>
    </div>`;
  }).join('') : '<p style="font-size:12.5px;color:var(--gray);text-align:center;padding:20px 0;">Ninguém ausente no momento.</p>';
}

function fmtDataBR(d){ return new Date(d+'T00:00:00').toLocaleDateString('pt-BR'); }

async function aprovarFerias(id){
  const { data: { session } } = await supa.auth.getSession();
  const { error } = await supa.from('ferias_solicitacoes').update({ status:'aprovada', aprovado_por: session.user.id, aprovado_em: new Date().toISOString() }).eq('id', id);

  await carregarDadosFerias();
}

function mudarMesCalFerias(delta){
  mesCalFerias = new Date(mesCalFerias.getFullYear(), mesCalFerias.getMonth()+delta, 1);
  renderCalendarioFerias();
}
window.mudarMesCalFerias = mudarMesCalFerias;

function renderCalendarioFerias(){
  const grid = document.getElementById('calFeriasGrid');
  if(!grid) return;
  document.getElementById('mesCalFeriasLabel').textContent = mesCalFerias.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});

  const ano = mesCalFerias.getFullYear(), mes = mesCalFerias.getMonth();
  const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
  const totalDias = new Date(ano, mes+1, 0).getDate();
  const hojeStr = new Date().toISOString().slice(0,10);

  const feriasAprovadas = feriasCache.filter(s => s.status === 'aprovada');
  const feriadosPorData = {};
  feriadosCache.forEach(f => { feriadosPorData[f.data] = f.nome; });

  let html = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cal-ferias-weekday">${d}</div>`).join('');
  for(let i=0;i<primeiroDiaSemana;i++) html += `<div class="cal-ferias-day empty"></div>`;
  for(let dia=1; dia<=totalDias; dia++){
    const key = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const ehFeriado = feriadosPorData[key];
    const pessoasFerias = feriasAprovadas.filter(s => s.data_inicio <= key && s.data_fim >= key);
    html += `<div class="cal-ferias-day ${ehFeriado?'feriado':''} ${key===hojeStr?'hoje':''}" title="${ehFeriado||''}">
      <div class="cal-ferias-day-num">${dia}</div>
      ${ehFeriado ? `<div class="cal-ferias-chip" style="background:var(--bad)">${ehFeriado}</div>` : ''}
      ${pessoasFerias.slice(0,2).map(s=>{
        const colabMatch = todosColaboradores.find(c => c.nome_completo.toLowerCase() === s.solicitante_nome.toLowerCase());
        const cor = colabMatch ? corDoSetor(colabMatch.departamento) : 'var(--info)';
        return `<div class="cal-ferias-chip" style="background:${cor}">${s.solicitante_nome.split(' ')[0]}</div>`;
      }).join('')}
      ${pessoasFerias.length>2 ? `<div style="color:var(--gray);font-size:9px;">+${pessoasFerias.length-2}</div>` : ''}
    </div>`;
  }
  grid.innerHTML = html;
}

document.addEventListener('input', (e) => {
  if(e.target.id === 'fInicioFerias' || e.target.id === 'fFimFerias') conferirConflitoFerias();
});

let filtroTipoAval = null;
const TIPO_AVAL_LABEL = {avaliacao:'Avaliação', ocorrencia:'Ocorrência', advertencia:'Advertência', rnc:'RNC', meta:'Meta'};

    <div class="hero">

      <div class="hero-stats">
        <div><div class="n">${totalAvaliacoes}</div><div class="l">Avaliações</div></div>
        <div><div class="n">${mediaGeral}</div><div class="l">Média geral</div></div>
        <div><div class="n">${avaliacoesCache.length}</div><div class="l">Registros totais</div></div>
      </div>
    </div>

    <div class="panel-white">
      <h2>Histórico de desempenho</h2>
      <p class="desc">Cada barrinha é uma avaliação, da mais antiga (esquerda) pra mais recente (direita) — verde é boa nota, amarelo é média, vermelho pede atenção.</p>
      <div id="statusRows"></div>

        <span><i style="background:var(--good)"></i> Nota ≥ 4</span>

        <span><i style="background:var(--bad)"></i> Nota &lt; 2,5</span>
      </div>
    </div>

    <div class="toolbar-row">
      <div class="aval-toolbar">
        <button class="aval-filtro-btn ${!filtroTipoAval?'active':''}" onclick="filtrarAval(null)">Todos</button>
        ${Object.entries(TIPO_AVAL_LABEL).map(([k,l])=>`<button class="aval-filtro-btn ${filtroTipoAval===k?'active':''}" onclick="filtrarAval('${k}')">${l}</button>`).join('')}
      </div>
      <button class="btn dark" onclick="abrirModalAval()">+ Novo registro</button>
    </div>

    <div class="aval-grid" id="avalGrid"></div>
  `;

  const listaColab = todosColaboradores.map(c=>c.nome_completo);
  document.getElementById('colaboradoresParaAval') && (document.getElementById('colaboradoresParaAval').innerHTML = listaColab.map(n=>`<option value="${n}">`).join(''));

  renderGridAvaliacoes();

window.renderAbaAvaliacoes = renderAbaAvaliacoes;

function mediaAval(a){
  const notas = [a.nota_pontualidade, a.nota_qualidade, a.nota_equipe].filter(n=>n!=null);
  return notas.length ? notas.reduce((x,y)=>x+y,0)/notas.length : 0;
}

function faixaNota(media){
  if(media >= 4) return 'good';
  if(media >= 2.5) return 'medio';
  return 'ruim';
}

function renderStatusRows(){
  const area = document.getElementById('statusRows');
  if(!area) return;

  const soAvaliacoes = avaliacoesCache.filter(a => a.tipo === 'avaliacao');
  const porColaborador = {};
  soAvaliacoes.forEach(a => {
    if(!porColaborador[a.colaborador_nome]) porColaborador[a.colaborador_nome] = [];
    porColaborador[a.colaborador_nome].push(a);
  });

  const nomes = Object.keys(porColaborador).sort();
  if(!nomes.length){
    area.innerHTML = '<p style="font-size:12.5px;color:var(--gray);text-align:center;padding:20px 0;">Ainda não tem avaliações de desempenho registradas.</p>';
    return;
  }

  area.innerHTML = nomes.map(nome => {
    const lista = porColaborador[nome].slice().sort((a,b) => a.data.localeCompare(b.data));
    const mediaGeralColab = lista.reduce((s,a)=>s+mediaAval(a),0) / lista.length;
    const faixaGeral = faixaNota(mediaGeralColab);
    const barras = lista.map(a => {
      const m = mediaAval(a);
      return `<div class="status-bar ${faixaNota(m)}" title="${nome} — ${a.periodo || fmtDataBR(a.data)} — nota ${m.toFixed(1)}"></div>`;
    }).join('');
    return `
      <div class="status-row">
        <div class="status-row-nome">${nome}</div>
        <div class="status-bars">${barras}</div>
        <div class="status-row-media ${faixaGeral}">${mediaGeralColab.toFixed(1)} méd.</div>
      </div>`;
  }).join('');
}

function filtrarAval(tipo){ filtroTipoAval = tipo; renderAbaAvaliacoes(); }
window.filtrarAval = filtrarAval;

      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <span class="aval-tipo-tag ${a.tipo}">${TIPO_AVAL_LABEL[a.tipo]}</span>
        ${media ? `<span class="aval-media-badge">★ ${media}</span>` : ''}
        ${a.tipo==='meta' && a.status_meta ? `<span class="tag ${a.status_meta==='cumprida'?'good':a.status_meta==='nao_cumprida'?'bad':'neutral'}">${{cumprida:'Cumprida',nao_cumprida:'Não cumprida',em_andamento:'Em andamento'}[a.status_meta]}</span>` : ''}
      </div>
      <div class="aval-nome">${a.colaborador_nome}</div>

      ${a.tipo==='avaliacao' ? `<div class="aval-notas">
        <div><div class="n">${a.nota_pontualidade??'—'}</div><div class="l">Pontualidade</div></div>
        <div><div class="n">${a.nota_qualidade??'—'}</div><div class="l">Qualidade</div></div>
        <div><div class="n">${a.nota_equipe??'—'}</div><div class="l">Equipe</div></div>

      <div class="aval-desc">${a.descricao || '<em style="color:var(--gray)">Sem observações.</em>'}</div>
      <div class="aval-foot">

}

  document.getElementById('avColaborador').value = '';
  document.getElementById('avPeriodo').value = '';

function toggleCamposAval(){
  const tipo = document.getElementById('avTipo').value;
  document.getElementById('camposAvaliacaoPeriodica').style.display = tipo==='avaliacao' ? 'grid' : 'none';
  document.getElementById('camposNotas').style.display = tipo==='avaliacao' ? 'block' : 'none';
  document.getElementById('campoTitulo').style.display = tipo==='avaliacao' ? 'none' : 'grid';
  document.getElementById('campoStatusMeta').style.display = tipo==='meta' ? 'grid' : 'none';
}
window.toggleCamposAval = toggleCamposAval;

async function salvarAvaliacao(){
  const colaborador_nome = document.getElementById('avColaborador').value.trim();
  if(!colaborador_nome){ alert('Informe o colaborador.'); return; }
  const tipo = document.getElementById('avTipo').value;

  const { data: { session } } = await supa.auth.getSession();
  const dados = {
    tipo, colaborador_nome,
    periodo: tipo==='avaliacao' ? (document.getElementById('avPeriodo').value.trim() || null) : null,
    nota_pontualidade: tipo==='avaliacao' ? (document.getElementById('avNotaPontualidade').value || null) : null,
    nota_qualidade: tipo==='avaliacao' ? (document.getElementById('avNotaQualidade').value || null) : null,
    nota_equipe: tipo==='avaliacao' ? (document.getElementById('avNotaEquipe').value || null) : null,
    titulo: tipo!=='avaliacao' ? (document.getElementById('avTitulo').value.trim() || null) : null,
    status_meta: tipo==='meta' ? document.getElementById('avStatusMeta').value : null,
    avaliador_nome: document.getElementById('avAvaliador').value.trim() || null,
    data: document.getElementById('avData').value || new Date().toISOString().slice(0,10),
    descricao: document.getElementById('avDescricao').value.trim() || null,
    criado_por: session.user.id
  };

  const { error } = await supa.from('avaliacoes_rh').insert(dados);
  if(error){ alert('Erro ao salvar: '+error.message); return; }
  document.getElementById('modalAval').classList.remove('show');
  await renderAbaAvaliacoes();
}
window.salvarAvaliacao = salvarAvaliacao;

async function excluirAvaliacao(id){
  if(!confirm('Excluir este registro?')) return;
  const { error } = await supa.from('avaliacoes_rh').delete().eq('id', id);
  if(error){ alert('Erro: '+error.message); return; }
  await renderAbaAvaliacoes();
}
window.excluirAvaliacao = excluirAvaliacao;

function renderGraficoPerformanceDept(avaliacoes){
  const porDepto = {};
  avaliacoes.forEach(a => {
    const colab = todosColaboradores.find(c => c.nome_completo.toLowerCase() === a.colaborador_nome.toLowerCase());
    const depto = colab?.departamento || 'Não definido';
    if(!porDepto[depto]) porDepto[depto] = {pont:[], qual:[], eq:[]};
    if(a.nota_pontualidade!=null) porDepto[depto].pont.push(a.nota_pontualidade);
    if(a.nota_qualidade!=null) porDepto[depto].qual.push(a.nota_qualidade);
    if(a.nota_equipe!=null) porDepto[depto].eq.push(a.nota_equipe);
  });
  const media = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
  const deptos = Object.keys(porDepto);

  if(chartPerformanceDept) chartPerformanceDept.destroy();
  const ctx = document.getElementById('chartPerformanceDept');
  if(!ctx) return;
  chartPerformanceDept = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: deptos,
      datasets: [
        { label:'Pontualidade', data: deptos.map(d=>media(porDepto[d].pont)), backgroundColor:'#B4472F' },
        { label:'Qualidade', data: deptos.map(d=>media(porDepto[d].qual)), backgroundColor:'#8B9D6B' },
        { label:'Equipe', data: deptos.map(d=>media(porDepto[d].eq)), backgroundColor:'#3E6B93' },
      ]
    },
    options: { responsive:true, scales:{y:{beginAtZero:true, max:5}}, plugins:{legend:{position:'bottom'}} }
  });
}

function renderGraficoSalarial(ativos){
  const porDepto = {};
  ativos.forEach(c => {
    if(!c.salario) return;
    const depto = c.departamento || 'Não definido';
    if(!porDepto[depto]) porDepto[depto] = [];
    porDepto[depto].push(Number(c.salario));
  });
  const deptos = Object.keys(porDepto);

  if(chartSalarial) chartSalarial.destroy();
  const ctx = document.getElementById('chartSalarial');
  if(!ctx) return;
  if(!deptos.length){ ctx.parentElement.innerHTML = '<p style="font-size:12.5px;color:var(--gray);text-align:center;padding:20px 0;">Nenhum salário cadastrado ainda.</p>'; return; }
  chartSalarial = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: deptos,
      datasets: [{ label:'Salário médio', data: deptos.map(d => porDepto[d].reduce((a,b)=>a+b,0)/porDepto[d].length), backgroundColor: deptos.map(d=>corDoSetor(d)) }]
    },
    options: { responsive:true, indexAxis:'y', plugins:{legend:{display:false}} }
  });
}

      <div class="kpi" style="cursor:pointer" onclick="trocarAba('ferias')"><div class="label">🏖️🩺 Ausentes hoje</div><div class="value">${ausentesAgora.length}</div></div>
      ${admin ? `<div class="kpi" style="cursor:pointer" onclick="trocarAba('colaboradores')"><div class="label">👥 Colaboradores</div><div class="value">${colaboradores.length}</div></div>` : ''}
      ${admin ? `<div class="kpi ${pendenciasEmail>0?'active':''}" style="cursor:pointer" onclick="trocarAba('colaboradores')"><div class="label">📧 E-mail pendente</div><div class="value">${pendenciasEmail}</div></div>` : ''}
    </div>

    ${ausentesAgora.length ? `
    <div class="panel-white">
      <h2>Quem está ausente hoje</h2>
      <div>${ausentesAgora.map(f=>`
        <div class="solic-item"><div>
          <div class="solic-nome">${f.tipo==='ausencia'?'🩺 ':'🏖️ '}${f.solicitante_nome}</div>
          <div class="solic-datas">${f.tipo==='ausencia'?'Ausência':'Férias'} · volta em ${fmtDataBR(f.data_fim)}</div>
        </div></div>`).join('')}</div>
    </div>` : ''}

    ${admin ? `
    <div class="panel-white">
      <h2>Avaliações recentes</h2>
      <p class="desc">Últimos 5 registros de qualquer tipo</p>
      <div>${avaliacoes.slice().sort((a,b)=>b.data.localeCompare(a.data)).slice(0,5).map(a=>`
        <div class="solic-item"><div>
          <div class="solic-nome">${a.colaborador_nome}${a.titulo?' — '+a.titulo:''}</div>
          <div class="solic-datas">${TIPO_AVAL_LABEL?.[a.tipo]||a.tipo} · ${fmtDataBR(a.data)}</div>

}
window.renderDashboardGeralRH = renderDashboardGeralRH;
