  .rh-nav-sub{font-size:11px;color:var(--gray);margin:0 0 22px;}
  .rh-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;color:var(--gray);margin-bottom:2px;}
  .rh-nav-item:hover{background:var(--paper);}
  .rh-nav-item.active{background:var(--burgundy);color:#fff;font-weight:600;}
  .rh-nav-group{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);margin:18px 0 6px 12px;}
  .rh-nav-foot{margin-top:24px;}
  .rh-nav-foot a{font-size:12px;color:var(--gray);text-decoration:none;}
  .rh-nav-foot a:hover{color:var(--burgundy);}

  .rh-main{flex:1;padding:32px 36px 60px;max-width:1300px;}

  .hero{background:linear-gradient(135deg,var(--burgundy),var(--burgundy-dark));border-radius:20px;padding:36px 40px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden;}
  .hero h1{font-family:var(--headfont);font-size:38px;font-weight:600;margin:0 0 8px;letter-spacing:-0.01em;}
  .hero p{font-size:14px;color:rgba(255,255,255,.85);margin:0 0 22px;max-width:440px;}
  .hero-stats{display:flex;gap:36px;}

  .search-box{flex:1;min-width:220px;max-width:340px;position:relative;}

  .btn.dark{background:var(--ink);color:#fff;}

  .colab-status.afastado{background:var(--warn-tint);color:#8A6512;}

  .panel-white .desc{font-size:12.5px;color:var(--gray);margin:0 0 16px;}
  .period-select{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:14px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}

  .bar-track{flex:1;height:16px;background:#F1ECEA;border-radius:4px;position:relative;overflow:hidden;}
  .bar-fill{position:absolute;top:0;bottom:0;border-radius:4px;}
  .bar-fill.pos{background:var(--good);left:50%;} .bar-fill.neg{background:var(--bad);right:50%;}
  .bar-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line);}
  .bar-val{width:56px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0;}
  .bar-val.pos{color:var(--good);} .bar-val.neg{color:var(--bad);}
  .ponto-table{width:100%;border-collapse:collapse;font-size:12.8px;}
  .ponto-table thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);font-weight:600;padding:0 8px 10px;border-bottom:1px solid var(--ink);}
  .ponto-table tbody td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .emp-name{font-weight:600;} .emp-cargo{font-size:11px;color:var(--gray);display:block;margin-top:1px;}
  .tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;text-transform:uppercase;}
  .tag.good{background:var(--good-tint);color:var(--good);}
  .tag.bad{background:var(--bad-tint);color:var(--bad);}
  .tag.neutral{background:#F1ECEA;color:var(--gray);}
  .num{font-variant-numeric:tabular-nums;text-align:right;}
  .num.pos{color:var(--good);} .num.neg{color:var(--bad);}
  th.num, td.num{text-align:right;}
</style>

// ============================================================
// PONTO — migrado do antigo banco-de-horas.html, agora vive aqui
// dentro da Central de RH
// ============================================================
let pontoCurrentWorkbook = null;

function toMin(t){
  if(!t || String(t).indexOf(':')===-1) return 0;
  const neg = String(t).startsWith('-');
  const s = String(t).replace('-','');
  const [h,m] = s.split(':');
  const v = parseInt(h)*60+parseInt(m);
  return neg ? -v : v;
}
function hmToMin(s){
  if(!s || String(s).indexOf(':')===-1) return null;
  const [h,m] = String(s).split(':');
  return parseInt(h)*60+parseInt(m);
}
function fmtMin(m){
  const sign = m<0?'-':'+';
  const abs = Math.abs(m);
  const h = Math.floor(abs/60), mm = abs%60;
  return sign+String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function titleCase(s){ return (s||'—').charAt(0)+(s||'—').slice(1).toLowerCase(); }

function parseWorkbookPonto(wb){
  const results = [];
  wb.SheetNames.forEach(sheetName => {
    const ws = wb.Sheets[sheetName];
    const get = (cell) => { const c = ws[cell]; return c ? c.v : undefined; };
    const nome = (get('B2')||'').toString().trim();
    if(!nome) return;
    const cargo = get('B3');
    const setor = get('B4') || null;
    const saldoInicial = get('B8');
    const ht = get('B45');
    const fa = get('B48');
    const totalTrabalhar = get('B50');
    const bh = get('B53');
    const saldoIniMin = toMin(saldoInicial);
    const bhMin = toMin(bh);

    const sched = {};
    for(let r=3;r<=8;r++){
      const wd = get('D'+r);
      const e1 = get('E'+r);
      if(wd && e1) sched[wd] = hmToMin(e1);
    }

    let diasComPonto=0, leve=0, grave=0;
    for(let r=13; r<=60; r++){
      const a = get('A'+r);
      if(a===undefined) break;
      const label = String(a).trim();
      const m = label.match(/- (\w+)$/);
      const wd = m ? m[1] : null;
      const ponto1 = get('B'+r);
      if(ponto1 && String(ponto1).indexOf(':')!==-1){
        diasComPonto++;
        const p1 = hmToMin(ponto1);
        const exp = sched[wd];
        if(exp!==undefined && p1!==null){
          const diff = p1-exp;
          if(diff>=1 && diff<=10) leve++;
          else if(diff>10) grave++;
        }
      }
    }

    results.push({
      nome, cargo, setor,
      saldo_inicial_min: saldoIniMin,
      variacao_mes_min: bhMin,
      saldo_final_min: saldoIniMin+bhMin,
      horas_trabalhadas_min: ht ? hmToMin(ht.toString().padStart(5,'0')) || parseInt(ht) : null,
      dias_com_ponto: diasComPonto,
      atrasos_leve: leve, atrasos_grave: grave,
      faltas_min: toMin(fa),
      ativo: totalTrabalhar !== '00:00'
    });
  });
  return results;
}

      <h2>Enviar folha de ponto do mês</h2>
      <p class="desc">Faça upload do xlsx exportado do aplicativo de ponto. O sistema calcula tudo automaticamente.</p>
      <div class="upload-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".xlsx">
        <div class="icon">📄</div>
        <div class="label">Clique ou arraste o arquivo .xlsx aqui</div>
        <div class="sub">Mesmo formato do espelho de ponto mensal</div>
      </div>
      <div class="period-row">
        <label>Período: <input type="date" id="periodoInicio"> até <input type="date" id="periodoFim"></label>

      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>
    <div id="dashboardArea"></div>
  `;

  if(meuPapelRH === 'gestao') document.getElementById('uploadPanel').style.display = 'none';

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const processBtn = document.getElementById('processBtn');
  const statusMsg = document.getElementById('statusMsg');

  dropZone.addEventListener('click', ()=>fileInput.click());
  dropZone.addEventListener('dragover', e=>{e.preventDefault(); dropZone.classList.add('drag');});
  dropZone.addEventListener('dragleave', ()=>dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e=>{
    e.preventDefault(); dropZone.classList.remove('drag');
    if(e.dataTransfer.files.length) handleFilePonto(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e=>{ if(e.target.files.length) handleFilePonto(e.target.files[0]); });

  function handleFilePonto(file){
    const reader = new FileReader();
    reader.onload = (e) => {
      const data = new Uint8Array(e.target.result);
      pontoCurrentWorkbook = XLSX.read(data, {type:'array'});
      dropZone.querySelector('.label').textContent = '✓ ' + file.name;
      processBtn.disabled = false;
      showStatusPonto('Arquivo lido. Confirme o período e clique em processar.', 'info');
    };
    reader.readAsArrayBuffer(file);
  }

  function showStatusPonto(msg, type){
    statusMsg.textContent = msg;
    statusMsg.className = 'status-msg show ' + type;
  }

  processBtn.addEventListener('click', async () => {
    if(!pontoCurrentWorkbook) return;
    const inicioInput = document.getElementById('periodoInicio').value;
    const fimInput = document.getElementById('periodoFim').value;
    if(!inicioInput || !fimInput){ showStatusPonto('Informe o período (início e fim) antes de salvar.', 'err'); return; }

    const dataRef = new Date(inicioInput + 'T00:00:00');
    const inicio = new Date(dataRef.getFullYear(), dataRef.getMonth(), 1).toISOString().slice(0,10);
    const fim = new Date(dataRef.getFullYear(), dataRef.getMonth()+1, 0).toISOString().slice(0,10);

    processBtn.disabled = true;
    showStatusPonto('Processando planilha...', 'info');
    const parsed = parseWorkbookPonto(pontoCurrentWorkbook).filter(d=>d.ativo);

    try {
      for(const d of parsed){
        let { data: existing } = await supa.from('funcionarios').select('id,setor').eq('nome', d.nome).maybeSingle();
        let funcionarioId;
        if(!existing){
          const { data: inserted, error } = await supa.from('funcionarios').insert({nome:d.nome, cargo:d.cargo, setor:d.setor}).select().single();
          if(error) throw error;
          funcionarioId = inserted.id;
        } else {
          funcionarioId = existing.id;
          if(!existing.setor && d.setor){
            await supa.from('funcionarios').update({setor:d.setor}).eq('id', funcionarioId);
          }
        }
        const { error: upsertErr } = await supa.from('folhas_ponto').upsert({
          funcionario_id: funcionarioId,
          periodo_inicio: inicio,
          periodo_fim: fim,
          saldo_inicial_min: d.saldo_inicial_min,
          variacao_mes_min: d.variacao_mes_min,
          saldo_final_min: d.saldo_final_min,
          horas_trabalhadas_min: d.horas_trabalhadas_min,
          dias_com_ponto: d.dias_com_ponto,
          atrasos_leve: d.atrasos_leve,
          atrasos_grave: d.atrasos_grave,
          faltas_min: d.faltas_min
        }, { onConflict: 'funcionario_id,periodo_inicio' });
        if(upsertErr) throw upsertErr;
      }
      showStatusPonto(`✓ ${parsed.length} funcionários salvos para o período ${inicio} a ${fim}.`, 'ok');
      await loadDashboardPonto();
    } catch(err){
      console.error(err);
      showStatusPonto('Erro ao salvar: ' + err.message, 'err');
    }
    processBtn.disabled = false;
  });

  checkPrazoPonto();
  loadDashboardPonto();
}

async function checkPrazoPonto(){
  const hoje = new Date();
  const diaDoMes = hoje.getDate();
  const periodoEsperado = new Date(hoje.getFullYear(), hoje.getMonth()-1, 1).toISOString().slice(0,10);

  const { data: ultimo } = await supa.from('folhas_ponto').select('periodo_inicio').order('periodo_inicio',{ascending:false}).limit(1);
  const emAtraso = diaDoMes > 5 && (!ultimo || !ultimo.length || ultimo[0].periodo_inicio < periodoEsperado);

  const banner = document.getElementById('prazoBanner');
  if(!banner) return;
  if(emAtraso){
    banner.textContent = `⚠️ A folha de ponto do mês passado ainda não foi enviada — o prazo (dia 5) já passou. Suba o xlsx abaixo assim que possível.`;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

async function loadDashboardPonto(){
  const { data: folhas, error } = await supa
    .from('folhas_ponto')
    .select('*, funcionarios(nome, cargo, setor)')
    .order('periodo_inicio', {ascending:true});
  if(error){ console.error(error); return; }
  const area = document.getElementById('dashboardArea');
  if(!area) return;
  if(!folhas || !folhas.length){
    area.innerHTML = `<div class="panel-white empty-state"><div class="big">📊</div>Nenhum período enviado ainda.</div>`;
    return;
  }
  const periodos = [...new Set(folhas.map(f=>f.periodo_inicio))].sort();
  const byPeriodo = {};
  periodos.forEach(p => byPeriodo[p] = folhas.filter(f=>f.periodo_inicio===p).map(f => ({
    nome: f.funcionarios.nome, cargo: f.funcionarios.cargo, setor: f.funcionarios.setor,
    saldo_inicial_min: f.saldo_inicial_min, variacao_mes_min: f.variacao_mes_min,
    saldo_final_min: f.saldo_final_min, dias_com_ponto: f.dias_com_ponto,
    atrasos_leve: f.atrasos_leve, atrasos_grave: f.atrasos_grave, faltas_min: f.faltas_min
  })));
  renderDashboardPonto(periodos.map(p => ({periodo_inicio:p, registros:byPeriodo[p]})));
}

function renderDashboardPonto(periodosData){
  const latest = periodosData[periodosData.length-1];
  const active = latest.registros;
  const area = document.getElementById('dashboardArea');

  let periodOptionsHtml = periodosData.map((p,i)=>`<option value="${i}" ${i===periodosData.length-1?'selected':''}>${p.periodo_inicio}</option>`).join('');

  const negCount = active.filter(d=>d.saldo_final_min<0).length;
  const graveTotal = active.reduce((a,d)=>a+d.atrasos_grave,0);
  const worst = active.reduce((a,b)=> a.saldo_final_min < b.saldo_final_min ? a : b);
  const best = active.reduce((a,b)=> a.saldo_final_min > b.saldo_final_min ? a : b);
  const avgMin = active.reduce((a,d)=>a+d.variacao_mes_min,0)/active.length;

  area.innerHTML = `
    <div class="panel-white">
      <div class="period-select">
        <span>Período exibido:</span>
        <select id="periodoSelect">${periodOptionsHtml}</select>
        <span style="color:var(--gray);font-size:12px">${periodosData.length} período(s) no histórico</span>
      </div>
    </div>
    <div class="ponto-kpi-row" style="grid-template-columns:repeat(5,1fr)">
      <div class="ponto-kpi accent"><div class="label">Funcionários</div><div class="value">${active.length}</div><div class="sub">com apontamento</div></div>
      <div class="ponto-kpi"><div class="label">Saldo médio no mês</div><div class="value" style="color:${avgMin>=0?'var(--good)':'var(--bad)'}">${fmtMin(Math.round(avgMin))}</div><div class="sub">por funcionário</div></div>
      <div class="ponto-kpi"><div class="label">Em saldo negativo</div><div class="value" style="color:var(--bad)">${negCount}</div><div class="sub">precisam de atenção</div></div>
      <div class="ponto-kpi" style="background:var(--bad-tint);border-color:#E8C4B8"><div class="label" style="color:var(--bad)">🔻 Maior devedor</div><div class="value" style="color:var(--bad);font-size:17px">${worst.nome.split(' ').slice(0,2).join(' ')}</div><div class="sub" style="color:var(--bad)">${fmtMin(worst.saldo_final_min)}</div></div>
      <div class="ponto-kpi" style="background:var(--good-tint);border-color:#C7E0D0"><div class="label" style="color:var(--good)">🔺 Maior saldo</div><div class="value" style="color:var(--good);font-size:17px">${best.nome.split(' ').slice(0,2).join(' ')}</div><div class="sub" style="color:var(--good)">${fmtMin(best.saldo_final_min)}</div></div>
    </div>
    <div class="grid-2">
      <div class="panel-white"><h2>Saldo acumulado por funcionário</h2><p class="desc">Saldo final do período selecionado</p><div id="bars"></div></div>
      <div class="panel-white"><h2>Por setor</h2><p class="desc">Soma do saldo acumulado</p><div id="sectors"></div></div>
    </div>
    <div class="panel-white">
      <h2>Detalhe por funcionário</h2>
      <table class="ponto-table"><thead><tr>
        <th>Funcionário</th><th>Setor</th><th class="num">Saldo final</th>
        <th class="num">Dias c/ ponto</th><th class="num">Atrasos (leve/grave)</th>
        <th class="num">Faltas</th><th>Situação</th>
      </tr></thead><tbody id="tbodyPonto"></tbody></table>
    </div>
  `;

  document.getElementById('periodoSelect').addEventListener('change', (e)=>{
    renderPeriodContentPonto(periodosData[parseInt(e.target.value)].registros);
  });
  renderPeriodContentPonto(active);
}

function renderPeriodContentPonto(active){
  const sorted = [...active].sort((a,b)=>a.saldo_final_min-b.saldo_final_min);
  const maxAbs = Math.max(...sorted.map(d=>Math.abs(d.saldo_final_min)), 1);
  document.getElementById('bars').innerHTML = sorted.map(d=>{
    const pct = Math.min(100, Math.abs(d.saldo_final_min)/maxAbs*50);
    const cls = d.saldo_final_min>=0?'pos':'neg';
    return `<div class="bar-row"><div class="bar-name" title="${d.nome}">${d.nome.split(' ').slice(0,2).join(' ')}</div>
      <div class="bar-track"><div class="bar-mid"></div><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
      <div class="bar-val ${cls}">${fmtMin(d.saldo_final_min)}</div></div>`;
  }).join('');

  const sectorMap = {};
  active.forEach(d=>{
    const s = d.setor || 'NÃO DEFINIDO';
    if(!sectorMap[s]) sectorMap[s]={count:0,total:0};
    sectorMap[s].count++; sectorMap[s].total+=d.saldo_final_min;
  });
  document.getElementById('sectors').innerHTML = Object.entries(sectorMap).sort((a,b)=>b[1].total-a[1].total).map(([name,v])=>{
    const cls = v.total>=0?'good':'bad';
    return `<div class="bar-row" style="justify-content:space-between"><div><strong>${titleCase(name)}</strong> <span style="color:var(--gray);font-size:12px">(${v.count})</span></div><div style="color:var(--${cls});font-weight:600">${fmtMin(v.total)}</div></div>`;
  }).join('');

  document.getElementById('tbodyPonto').innerHTML = sorted.map(d=>{
    let tagCls='good', tagLabel='Em dia';
    if(d.saldo_final_min < -600){ tagCls='bad'; tagLabel='Atenção'; }
    else if(d.saldo_final_min < 0){ tagCls='neutral'; tagLabel='Devedor leve'; }
    return `<tr>
      <td><span class="emp-name">${d.nome}</span><span class="emp-cargo">${d.cargo||''}</span></td>
      <td>${titleCase(d.setor)}</td>
      <td class="num ${d.saldo_final_min>=0?'pos':'neg'}"><strong>${fmtMin(d.saldo_final_min)}</strong></td>
      <td class="num">${d.dias_com_ponto||'—'}</td>
      <td class="num">${d.atrasos_leve||0} / ${d.atrasos_grave||0}</td>
      <td class="num">${d.faltas_min ? fmtMin(d.faltas_min) : '—'}</td>
      <td><span class="tag ${tagCls}">${tagLabel}</span></td>
    </tr>`;
  }).join('');
}

function iniciais(nome){
  return (nome||'?').split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();
}

async function carregarColaboradores(){
  const { data, error } = await supa.from('colaboradores').select('*').order('nome_completo');
  if(error){ console.error(error); return; }
  todosColaboradores = data || [];
}

function renderColaboradores(termoBusca){
  const ativos = todosColaboradores.filter(c => c.status === 'ativo').length;
  const departamentos = new Set(todosColaboradores.map(c=>c.departamento).filter(Boolean)).size;

  document.getElementById('rhMain').innerHTML = `
    <div class="hero">
      <h1>Talentos &<br>Cultura</h1>
      <p>Gerencie os colaboradores da sua organização com eficiência e estilo.</p>
      <div class="hero-stats">
        <div><div class="n">${ativos}</div><div class="l">Ativos</div></div>
        <div><div class="n">${departamentos}</div><div class="l">Departamentos</div></div>
        <div><div class="n">${todosColaboradores.length}</div><div class="l">Total</div></div>
      </div>
    </div>

    <div class="toolbar-row">
      <div class="search-box"><span class="ico">🔍</span><input id="buscaColab" placeholder="Buscar colaborador..." oninput="filtrarColaboradores(this.value)"></div>
      <button class="btn dark" onclick="abrirModalColab()">+ Adicionar colaborador</button>
    </div>

    <div class="colab-grid" id="colabGrid"></div>
  `;
  renderGridColaboradores(termoBusca ? filtrar(termoBusca) : todosColaboradores);
}

function filtrar(termo){
  const t = termo.trim().toLowerCase();
  if(!t) return todosColaboradores;
  return todosColaboradores.filter(c =>
    (c.nome_completo||'').toLowerCase().includes(t) ||
    (c.cargo||'').toLowerCase().includes(t) ||
    (c.departamento||'').toLowerCase().includes(t)
  );
}
function filtrarColaboradores(termo){ renderGridColaboradores(filtrar(termo)); }
window.filtrarColaboradores = filtrarColaboradores;

function renderGridColaboradores(lista){
  document.getElementById('colabGrid').innerHTML = lista.length ? lista.map(c => `
    <div class="colab-card">
      <div class="colab-card-top">
        <div class="colab-avatar">${iniciais(c.nome_completo)}</div>
        <span class="colab-status ${c.status}">${STATUS_LABELS[c.status]}</span>
      </div>
      <h3 class="colab-nome">${c.nome_completo}</h3>
      <p class="colab-cargo">${c.cargo || 'Cargo não informado'}</p>
      ${c.email ? `<div class="colab-detail"><span class="ico">✉️</span>${c.email}</div>` : ''}
      ${c.telefone ? `<div class="colab-detail"><span class="ico">📞</span>${c.telefone}</div>` : ''}
      ${c.departamento ? `<div class="colab-detail"><span class="ico">📍</span>${c.departamento}</div>` : ''}
      <div class="colab-card-actions">
        <button class="edit" onclick="abrirModalColab('${c.id}')">Editar</button>
        <button class="del" onclick="excluirColaborador('${c.id}')">Excluir</button>
      </div>
    </div>
  `).join('') : '<div class="empty-state">Nenhum colaborador ainda. Clique em "+ Adicionar colaborador" pra começar.</div>';
}

function abrirModalColab(id){
  colabEmEdicaoId = id || null;
  const c = id ? todosColaboradores.find(x=>x.id===id) : null;
  document.getElementById('modalColabTitulo').textContent = c ? 'Editar colaborador' : 'Novo colaborador';
  document.getElementById('cNome').value = c?.nome_completo || '';
  document.getElementById('cCargo').value = c?.cargo || '';
  document.getElementById('cDepartamento').value = c?.departamento || '';
  document.getElementById('cEmail').value = c?.email || '';
  document.getElementById('cTelefone').value = c?.telefone || '';
  document.getElementById('cStatus').value = c?.status || 'ativo';
  document.getElementById('cAdmissao').value = c?.data_admissao || '';
  document.getElementById('cObs').value = c?.observacoes || '';
  document.getElementById('modalColab').classList.add('show');
}
window.abrirModalColab = abrirModalColab;

function fecharModalColab(){
  document.getElementById('modalColab').classList.remove('show');
  colabEmEdicaoId = null;
}
window.fecharModalColab = fecharModalColab;

async function salvarColaborador(){
  const nome_completo = document.getElementById('cNome').value.trim();
  if(!nome_completo){ alert('Digite o nome completo.'); return; }

  const dados = {
    nome_completo,
    cargo: document.getElementById('cCargo').value.trim() || null,
    departamento: document.getElementById('cDepartamento').value.trim() || null,
    email: document.getElementById('cEmail').value.trim() || null,
    telefone: document.getElementById('cTelefone').value.trim() || null,
    status: document.getElementById('cStatus').value,
    data_admissao: document.getElementById('cAdmissao').value || null,
    observacoes: document.getElementById('cObs').value.trim() || null,
  };

  if(colabEmEdicaoId){
    const { error } = await supa.from('colaboradores').update(dados).eq('id', colabEmEdicaoId);
    if(error){ alert('Erro ao salvar: '+error.message); return; }
  } else {
    const { data: { session } } = await supa.auth.getSession();
    const { error } = await supa.from('colaboradores').insert({ ...dados, criado_por: session.user.id });
    if(error){ alert('Erro ao criar: '+error.message); return; }
  }

  fecharModalColab();
  await carregarColaboradores();
  renderColaboradores();
}
window.salvarColaborador = salvarColaborador;

async function excluirColaborador(id){
  if(!confirm('Excluir este colaborador do cadastro? Não dá pra desfazer.')) return;
  const { error } = await supa.from('colaboradores').delete().eq('id', id);
  if(error){ alert('Erro: '+error.message); return; }
  await carregarColaboradores();
  renderColaboradores();
}
window.excluirColaborador = excluirColaborador;

init();
</script>
