<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro de Tarefas — Hub Bioflora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<style>
  :root{
    --burgundy:#8B1A3A; --burgundy-tint:#F7E9EE;
    --ink:#2A2224; --paper:#FBF9F7; --line:#E7DFE0; --gray:#6E6266;
    --good:#3F7A57; --good-tint:#E8F3EC; --bad:#B4472F; --bad-tint:#FBEBE6;
    --warn:#C9922B; --warn-tint:#FBF1DD;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Maven Pro',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1300px;margin:0 auto;padding:36px 28px 80px;}
  header.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:20px;margin-bottom:22px;flex-wrap:wrap;gap:16px;}
  .brand-text h1{font-family:'Space Grotesk','Maven Pro',sans-serif;font-weight:600;font-size:22px;margin:0;letter-spacing:-0.01em;}
  .brand-text p{margin:2px 0 0;font-size:12.5px;color:var(--gray);}
  .btn{font-family:'Maven Pro',sans-serif;font-size:13px;font-weight:600;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;background:var(--burgundy);color:#fff;text-decoration:none;display:inline-block;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn.small{padding:6px 12px;font-size:12px;}

  .quadro-tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
  .quadro-tab{font-family:'Maven Pro',sans-serif;font-size:13px;font-weight:600;padding:9px 16px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--gray);cursor:pointer;}
  .quadro-tab.active{background:var(--burgundy);color:#fff;border-color:var(--burgundy);}

  .board{display:flex;gap:16px;overflow-x:auto;padding-bottom:20px;align-items:flex-start;}
  .coluna{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;min-width:270px;max-width:270px;flex-shrink:0;}
  .coluna-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px;}
  .coluna-head h3{font-family:'Space Grotesk','Maven Pro',sans-serif;font-weight:600;font-size:14px;margin:0;}
  .coluna-count{font-size:11px;color:var(--gray);background:var(--paper);border-radius:10px;padding:2px 8px;}

  .card-tarefa{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px;cursor:pointer;}
  .card-tarefa:hover{border-color:var(--burgundy);}
  .card-tarefa .titulo{font-weight:600;font-size:13.5px;margin-bottom:5px;}
  .card-tarefa .desc-preview{font-size:11.5px;color:var(--gray);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .card-tarefa .meta-row{display:flex;justify-content:space-between;align-items:center;}
  .prio{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:10px;}
  .prio.baixa{background:var(--good-tint);color:var(--good);}
  .prio.media{background:var(--warn-tint);color:#8A6512;}
  .prio.alta{background:var(--bad-tint);color:var(--bad);}
  .responsavel-chip{font-size:11px;color:var(--gray);}

  .add-card-btn{width:100%;font-family:'Maven Pro',sans-serif;font-size:12.5px;font-weight:600;color:var(--gray);background:transparent;border:1.5px dashed var(--line);border-radius:10px;padding:9px;cursor:pointer;}
  .add-card-btn:hover{border-color:var(--burgundy);color:var(--burgundy);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--gray);}
  .empty-state .big{font-size:36px;margin-bottom:10px;}

  /* Modal */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(42,34,36,.45);z-index:50;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
  .modal h2{font-family:'Space Grotesk','Maven Pro',sans-serif;font-weight:600;font-size:18px;margin:0 0 18px;}
  .modal label{font-size:11.5px;font-weight:600;color:var(--gray);display:block;margin:12px 0 5px;}
  .modal label:first-of-type{margin-top:0;}
  .modal input,.modal textarea,.modal select{width:100%;font-family:'Maven Pro',sans-serif;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;}
  .modal textarea{resize:vertical;min-height:70px;font-family:inherit;}
  .modal-actions{display:flex;gap:8px;margin-top:20px;}
  .modal-actions .btn{flex:1;text-align:center;}
  .move-row{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;}
  .quadro-tab.add{background:transparent;border-style:dashed;color:var(--gray);}
  .coluna.add-coluna{background:transparent;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;min-height:80px;}
  .coluna.add-coluna button{font-family:'Maven Pro',sans-serif;font-size:13px;font-weight:600;color:var(--gray);background:transparent;border:none;cursor:pointer;}
  .coluna.add-coluna button:hover{color:var(--burgundy);}  .coluna-del{background:transparent;border:none;color:var(--gray);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:4px;}
  .coluna-del:hover{color:var(--bad);background:var(--bad-tint);}
  .quadro-actions{display:flex;justify-content:flex-end;margin:-10px 0 14px;}
  .link-excluir{font-family:'Maven Pro',sans-serif;font-size:11.5px;color:var(--gray);background:none;border:none;cursor:pointer;text-decoration:underline;}
  .link-excluir:hover{color:var(--bad);}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand-text">
      <h1>Quadro de Tarefas</h1>
      <p>Estilo Trello — tarefas do dia a dia e sugestões/ideias da equipe</p>
    </div>
    <div style="display:flex;gap:10px;">
      <a href="index.html" class="btn secondary">← Voltar ao Hub</a>
      <button class="btn" onclick="logout()">Sair</button>
    </div>
  </header>

  <div class="quadro-tabs" id="quadroTabs"></div>
  <div class="quadro-actions" id="quadroActions"></div>
  <div id="boardArea"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitulo">Novo card</h2>
    <label>Título</label>
    <input id="fTitulo" placeholder="O que precisa ser feito?" />
    <label>Descrição</label>
    <textarea id="fDescricao" placeholder="Detalhes, contexto, links..."></textarea>
    <label>Responsável</label>
    <input id="fResponsavel" placeholder="Nome (opcional)" />
    <label>Prioridade</label>
    <select id="fPrioridade">
      <option value="baixa">Baixa</option>
      <option value="media" selected>Média</option>
      <option value="alta">Alta</option>
    </select>
    <div class="move-row" id="moveRow"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn" id="btnSalvarCard" onclick="salvarCard()">Salvar</button>
    </div>
    <div class="modal-actions" id="excluirRow" style="display:none">
      <button class="btn secondary" style="color:var(--bad);border-color:var(--bad-tint)" onclick="excluirCard()">Excluir card</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://gbbjpltqmbhlfluqhrmg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiYmpwbHRxbWJobGZsdXFocm1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDY3ODAsImV4cCI6MjA5ODkyMjc4MH0.Gi3iw6IMyJ_6wrOG3WOcHPTW5Mo1IROTH3x_2qTyzrA';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let quadros = [];
let quadroAtivoId = null;
let colunasAtivas = [];
let cardsAtivos = [];
let cardEmEdicaoId = null;

async function init(){
  await requireRole(['chefia','rh','gestao','laboratorio','recepcao','conferencia','atendente']);
  await carregarQuadros();
}

async function carregarQuadros(){
  const { data, error } = await supa.from('quadros').select('*').order('criado_em');
  if(error){ console.error(error); return; }
  quadros = data || [];
  if(!quadros.length){
    document.getElementById('boardArea').innerHTML = `<div class="empty-state"><div class="big">🗂️</div>Nenhum quadro criado ainda.</div>`;
    document.getElementById('quadroTabs').innerHTML = `<button class="quadro-tab add" onclick="criarQuadro()">+ Novo quadro</button>`;
    document.getElementById('quadroActions').innerHTML = '';
    return;
  }
  if(!quadroAtivoId || !quadros.find(q=>q.id===quadroAtivoId)) quadroAtivoId = quadros[0].id;

  document.getElementById('quadroTabs').innerHTML = quadros.map(q => `
    <button class="quadro-tab ${q.id===quadroAtivoId?'active':''}" onclick="trocarQuadro('${q.id}')">${q.privado?'🔒 ':''}${q.nome}</button>
  `).join('') + `<button class="quadro-tab add" onclick="criarQuadro()">+ Novo quadro</button>`;

  const quadroAtivo = quadros.find(q=>q.id===quadroAtivoId);
  document.getElementById('quadroActions').innerHTML = quadroAtivo
    ? `<button class="link-excluir" onclick="excluirQuadro()">Excluir quadro "${quadroAtivo.nome}"</button>`
    : '';

  await carregarBoard();
}

async function excluirQuadro(){
  const quadroAtivo = quadros.find(q=>q.id===quadroAtivoId);
  if(!quadroAtivo) return;
  if(!confirm(`Excluir o quadro "${quadroAtivo.nome}" inteiro, com todas as colunas e cards dele? Não dá pra desfazer.`)) return;
  const { error } = await supa.from('quadros').delete().eq('id', quadroAtivoId);
  if(error){ alert('Erro ao excluir: ' + error.message); return; }
  quadroAtivoId = null;
  await carregarQuadros();
}
window.excluirQuadro = excluirQuadro;

async function excluirColuna(colunaId, qtdCards){
  const aviso = qtdCards > 0
    ? `Essa coluna tem ${qtdCards} card(s). Excluir a coluna apaga os cards junto. Continuar?`
    : 'Excluir essa coluna?';
  if(!confirm(aviso)) return;
  const { error } = await supa.from('colunas').delete().eq('id', colunaId);
  if(error){ alert('Erro ao excluir: ' + error.message); return; }
  await carregarBoard();
}
window.excluirColuna = excluirColuna;

async function criarQuadro(){
  const nome = prompt('Nome do novo quadro (ex: Marketing, Comercial, RH):');
  if(!nome || !nome.trim()) return;
  const particular = confirm('Esse quadro é PARTICULAR (só você vai ver)?\n\nOK = particular, só seu\nCancelar = compartilhado, todo mundo vê');
  const colunasStr = prompt('Colunas do quadro, separadas por vírgula:', 'A fazer, Em andamento, Concluído');
  if(!colunasStr) return;
  const nomesColunas = colunasStr.split(',').map(c=>c.trim()).filter(Boolean);
  if(!nomesColunas.length){ alert('Precisa de pelo menos uma coluna.'); return; }

  const { data: { session } } = await supa.auth.getSession();
  const { data: novoQuadro, error } = await supa.from('quadros').insert({ nome: nome.trim(), privado: particular, criado_por: session.user.id }).select().single();
  if(error){ alert('Erro ao criar quadro: ' + error.message); return; }

  const inserts = nomesColunas.map((nomeCol, i) => ({ quadro_id: novoQuadro.id, nome: nomeCol, ordem: i }));
  const { error: colError } = await supa.from('colunas').insert(inserts);
  if(colError){ alert('Erro ao criar colunas: ' + colError.message); return; }

  quadroAtivoId = novoQuadro.id;
  await carregarQuadros();
}

function trocarQuadro(id){
  quadroAtivoId = id;
  carregarQuadros();
}

const PESO_PRIORIDADE = { alta: 0, media: 1, baixa: 2 };

async function carregarBoard(){
  const { data: colunas } = await supa.from('colunas').select('*').eq('quadro_id', quadroAtivoId).order('ordem');
  colunasAtivas = colunas || [];
  const colunaIds = colunasAtivas.map(c=>c.id);

  let cards = [];
  if(colunaIds.length){
    const { data } = await supa.from('cards_tarefas').select('*').in('coluna_id', colunaIds).order('ordem');
    cards = data || [];
  }
  cardsAtivos = cards;

  const area = document.getElementById('boardArea');
  area.innerHTML = `<div class="board">
    ${colunasAtivas.map(col => {
      // Prioridade alta primeiro, depois média, depois baixa. Dentro da
      // mesma prioridade, mantém a ordem de criação (sort é estável).
      const doCards = cards.filter(c=>c.coluna_id===col.id)
        .sort((a,b) => (PESO_PRIORIDADE[a.prioridade]??1) - (PESO_PRIORIDADE[b.prioridade]??1));
      return `
      <div class="coluna">
        <div class="coluna-head"><h3>${col.nome}</h3><div style="display:flex;align-items:center;gap:6px"><span class="coluna-count">${doCards.length}</span><button class="coluna-del" title="Excluir coluna" onclick="excluirColuna('${col.id}', ${doCards.length})">✕</button></div></div>
        ${doCards.map(c => `
          <div class="card-tarefa" onclick="abrirEdicao('${c.id}')">
            <div class="titulo">${c.titulo}</div>
            ${c.descricao ? `<div class="desc-preview">${c.descricao.replace(/</g,'&lt;')}</div>` : ''}
            <div class="meta-row">
              <span class="prio ${c.prioridade}">${c.prioridade}</span>
              ${c.responsavel ? `<span class="responsavel-chip">${c.responsavel}</span>` : '<span></span>'}
            </div>
          </div>
        `).join('')}
        <button class="add-card-btn" onclick="abrirNovoCard('${col.id}')">+ Adicionar card</button>
      </div>`;
    }).join('')}
    <div class="coluna add-coluna"><button onclick="criarColuna()">+ Nova coluna</button></div>
  </div>`;
}

async function criarColuna(){
  const nome = prompt('Nome da nova coluna:');
  if(!nome || !nome.trim()) return;
  const proximaOrdem = colunasAtivas.length ? Math.max(...colunasAtivas.map(c=>c.ordem)) + 1 : 0;
  const { error } = await supa.from('colunas').insert({ quadro_id: quadroAtivoId, nome: nome.trim(), ordem: proximaOrdem });
  if(error){ alert('Erro ao criar coluna: ' + error.message); return; }
  await carregarBoard();
}

function abrirNovoCard(colunaId){
  cardEmEdicaoId = null;
  document.getElementById('modalTitulo').textContent = 'Novo card';
  document.getElementById('fTitulo').value = '';
  document.getElementById('fDescricao').value = '';
  document.getElementById('fResponsavel').value = '';
  document.getElementById('fPrioridade').value = 'media';
  document.getElementById('excluirRow').style.display = 'none';
  document.getElementById('moveRow').innerHTML = '';
  document.getElementById('modalOverlay').dataset.colunaAlvo = colunaId;
  document.getElementById('modalOverlay').classList.add('show');
}

function abrirEdicao(cardId){
  const c = cardsAtivos.find(x=>x.id===cardId);
  if(!c) return;
  cardEmEdicaoId = cardId;
  document.getElementById('modalTitulo').textContent = 'Editar card';
  document.getElementById('fTitulo').value = c.titulo;
  document.getElementById('fDescricao').value = c.descricao || '';
  document.getElementById('fResponsavel').value = c.responsavel || '';
  document.getElementById('fPrioridade').value = c.prioridade;
  document.getElementById('excluirRow').style.display = 'flex';
  document.getElementById('modalOverlay').dataset.colunaAlvo = c.coluna_id;

  // Botões de mover pra outra coluna do mesmo quadro
  document.getElementById('moveRow').innerHTML = colunasAtivas
    .filter(col => col.id !== c.coluna_id)
    .map(col => `<button class="btn secondary small" onclick="moverCard('${col.id}')">→ ${col.nome}</button>`)
    .join('');

  document.getElementById('modalOverlay').classList.add('show');
}

function fecharModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}

async function salvarCard(){
  const titulo = document.getElementById('fTitulo').value.trim();
  if(!titulo){ alert('Digite um título pro card.'); return; }
  const descricao = document.getElementById('fDescricao').value.trim();
  const responsavel = document.getElementById('fResponsavel').value.trim();
  const prioridade = document.getElementById('fPrioridade').value;
  const colunaAlvo = document.getElementById('modalOverlay').dataset.colunaAlvo;

  if(cardEmEdicaoId){
    const { error } = await supa.from('cards_tarefas').update({ titulo, descricao, responsavel, prioridade }).eq('id', cardEmEdicaoId);
    if(error){ alert('Erro ao salvar: ' + error.message); return; }
  } else {
    const { data: { session } } = await supa.auth.getSession();
    const { error } = await supa.from('cards_tarefas').insert({ coluna_id: colunaAlvo, titulo, descricao, responsavel, prioridade, criado_por: session.user.id });
    if(error){ alert('Erro ao criar: ' + error.message); return; }
  }
  fecharModal();
  await carregarBoard();
}

async function moverCard(novaColunaId){
  if(!cardEmEdicaoId) return;
  const { error } = await supa.from('cards_tarefas').update({ coluna_id: novaColunaId }).eq('id', cardEmEdicaoId);
  if(error){ alert('Erro ao mover: ' + error.message); return; }
  fecharModal();
  await carregarBoard();
}

async function excluirCard(){
  if(!cardEmEdicaoId) return;
  if(!confirm('Excluir esse card? Não dá pra desfazer.')) return;
  const { error } = await supa.from('cards_tarefas').delete().eq('id', cardEmEdicaoId);
  if(error){ alert('Erro ao excluir: ' + error.message); return; }
  fecharModal();
  await carregarBoard();
}

init();
</script>
<script src="acessibilidade.js"></script>
<script src="hub-sidebar.js"></script>
</body>
</html>
